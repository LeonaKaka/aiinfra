<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc">
<title id="title">Autoregressive generation dataflow</title>
<desc id="desc">Current confirmed prefix enters a decoder-only transformer, the last-position logits are processed by a sampling policy, one token is selected and appended to the prefix, and only then can the next ordinary decode step proceed.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6f766f"/></marker>
 <style>
  .bg{fill:#fff}.panel{fill:#fbfbf8;stroke:#c9cec7;stroke-width:1.4}.model{fill:#eef3f7;stroke:#bfd1dd;stroke-width:1.4}.sampler{fill:#eaf1ed;stroke:#bfd2c5;stroke-width:1.4}.token{fill:#f5f6f2;stroke:#d3d7d0;stroke-width:1.2}.gen{fill:#eaf1ed;stroke:#bfd2c5;stroke-width:1.2}.logits{fill:#f7f3e8;stroke:#ddcfb5;stroke-width:1.2}.dark{fill:#202622}.line{stroke:#6f766f;stroke-width:1.5;fill:none}.title{font:700 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20231f}.subtitle{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666d66}.kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#8b918a}.label{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344139}.small{font:500 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687068}.tiny{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#737b74}.strong{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#273029}.white{fill:#f4f7f3}.white2{fill:#b9c4bc}
 </style>
</defs>
<rect class="bg" width="1100" height="830"/>
<text class="kicker" x="56" y="48">DECODER-ONLY LLM · BASELINE AUTOREGRESSIVE GENERATION</text>
<text class="title" x="56" y="82">The confirmed prefix is state; one selected token unlocks the next step</text>
<text class="subtitle" x="56" y="108">The target model produces logits. A decoding policy chooses a token. That token becomes part of the next conditional context.</text>
<rect class="panel" x="56" y="146" rx="14" width="988" height="392"/>
<text class="kicker" x="80" y="177">ONE ORDINARY GENERATION STEP · t</text><text class="strong" x="80" y="202">Input is the already-confirmed prefix — not a batch of unknown future outputs.</text>
<g transform="translate(80,240)">
 <text class="kicker" x="0" y="0">CURRENT CONTEXT</text>
 <rect class="token" x="0" y="18" rx="7" width="82" height="44"/><text class="label" x="24" y="45">x₀</text><rect class="token" x="90" y="18" rx="7" width="82" height="44"/><text class="label" x="114" y="45">x₁</text><rect class="token" x="180" y="18" rx="7" width="82" height="44"/><text class="label" x="204" y="45">…</text><rect class="gen" x="270" y="18" rx="7" width="82" height="44"/><text class="label" x="294" y="45">y₁</text><rect class="gen" x="360" y="18" rx="7" width="82" height="44"/><text class="label" x="384" y="45">yₜ₋₁</text>
 <path class="line" marker-end="url(#a)" d="M450 40 H500"/><rect class="model" x="506" y="2" rx="12" width="180" height="76"/><text class="kicker" x="526" y="25">TARGET MODEL</text><text class="strong" x="526" y="49">Transformer</text><text class="tiny" x="526" y="66">last position hidden state</text><path class="line" marker-end="url(#a)" d="M692 40 H735"/><rect class="logits" x="741" y="2" rx="12" width="166" height="76"/><text class="kicker" x="760" y="25">OUTPUT HEAD</text><text class="strong" x="760" y="49">logits ∈ ℝ^V</text><text class="tiny" x="760" y="66">one score / vocab token</text>
</g>
<g transform="translate(80,352)">
 <rect class="sampler" x="660" y="0" rx="12" width="244" height="91"/><text class="kicker" x="680" y="24">DECODING POLICY</text><text class="strong" x="680" y="48">greedy / temperature / top-p …</text><text class="tiny" x="680" y="68">logit processors → choose one token ID</text><path class="line" marker-end="url(#a)" d="M822 -29 V-5"/><path class="line" marker-end="url(#a)" d="M660 46 H582"/><rect class="gen" x="470" y="18" rx="9" width="104" height="57"/><text class="kicker" x="488" y="39">SELECTED</text><text class="strong" x="496" y="61">yₜ</text><path class="line" marker-end="url(#a)" d="M470 46 H390"/><rect class="panel" x="158" y="8" rx="11" width="224" height="76"/><text class="kicker" x="178" y="32">APPEND TO PREFIX</text><text class="strong" x="178" y="55">context ← context + yₜ</text><text class="tiny" x="178" y="73">yₜ is now confirmed state</text><path class="line" d="M158 46 H70 V-87 H0" marker-end="url(#a)"/><text class="tiny" x="0" y="-103">feedback path → next ordinary decode step</text>
</g>
<text class="kicker" x="56" y="580">SERIAL DEPENDENCY ACROSS ORDINARY TARGET-MODEL STEPS</text>
<g transform="translate(56,602)"><rect class="panel" x="0" y="0" rx="12" width="988" height="105"/><rect class="gen" x="30" y="27" rx="8" width="160" height="50"/><text class="label" x="73" y="57">select y₁</text><path class="line" marker-end="url(#a)" d="M197 52 H248"/><text class="tiny" x="204" y="39">append</text><rect class="gen" x="255" y="27" rx="8" width="160" height="50"/><text class="label" x="298" y="57">select y₂</text><path class="line" marker-end="url(#a)" d="M422 52 H473"/><text class="tiny" x="429" y="39">append</text><rect class="gen" x="480" y="27" rx="8" width="160" height="50"/><text class="label" x="523" y="57">select y₃</text><path class="line" marker-end="url(#a)" d="M647 52 H698"/><text class="tiny" x="654" y="39">append</text><rect class="token" x="705" y="27" rx="8" width="250" height="50"/><text class="label" x="751" y="57">… until stop condition</text></g>
<rect class="dark" x="56" y="728" rx="12" width="988" height="66"/><text class="tiny white2" x="78" y="750">ADVANCED CAVEAT</text><text class="small white" x="202" y="750">Speculative / multi-token methods can verify several candidates per expensive target-model iteration,</text><text class="small white" x="202" y="771">but accepted tokens must still respect the target autoregressive distribution.</text><text class="tiny" x="56" y="819">Next: split this request lifecycle into Prefill (process prompt) and Decode (advance generated tokens).</text>
</svg>