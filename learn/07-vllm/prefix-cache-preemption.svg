<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 prefix cache, eviction, and preemption</title>
<desc id="desc">The first panel separates prefix identity, shared physical KV ownership, and the free-but-still-cached state. The second panel separates cache-level eviction from request-level preemption when KV allocation cannot fit.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#747b74"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
 <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d5d6f"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .ey{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#8a918a}.ttl{font-size:24px;font-weight:760;fill:#252a25}.subt{font-size:13px;fill:#687069}.sec{font-size:10px;font-weight:700;letter-spacing:1.35px;fill:#8b928b}.label{font-size:11px;font-weight:760;fill:#343c35}.small{font-size:10px;fill:#687069}.tiny{font-size:9px;fill:#687069}.panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}.box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}.blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}.green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}.gold{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}.purple{fill:#f5eef3;stroke:#dac7d2;stroke-width:1.1}.dark{fill:#222824}.line{fill:none;stroke:#747b74;stroke-width:1.3}.bline{fill:none;stroke:#315f82;stroke-width:1.4}.gline{fill:none;stroke:#255b46;stroke-width:1.4}.pline{fill:none;stroke:#7d5d6f;stroke-width:1.4}.dash{fill:none;stroke:#9da49e;stroke-dasharray:5 5;stroke-width:1.1}
 </style>
</defs>
<text class="mono ey" x="34" y="34">vLLM V1 · 本地 KV 生命周期</text>
<text class="sans ttl" x="34" y="67">前缀标识、缓存淘汰与请求抢占</text>
<text class="sans ttl" x="34" y="94">是三种不同的生命周期</text>
<text class="sans subt" x="34" y="119">不要混淆哈希标识、物理块归属与调度器请求状态。</text>

<text class="mono sec" x="34" y="154">1 · 前缀标识 + 共享物理块</text>
<rect class="panel" x="34" y="170" width="692" height="456" rx="14"/>

<rect class="gold" x="52" y="204" width="150" height="88" rx="9"/>
<text class="mono sec" x="70" y="228" fill="#7b6a3e">请求 A</text><text class="sans label" x="70" y="252">相同前缀 token</text><text class="sans tiny" x="70" y="274">计算可缓存 KV</text>
<rect class="blue" x="52" y="326" width="150" height="88" rx="9"/>
<text class="mono sec" x="70" y="350" fill="#315f82">请求 B</text><text class="sans label" x="70" y="374">相同前缀 token</text><text class="sans tiny" x="70" y="396">查找命中相同标识</text>

<rect class="box" x="244" y="204" width="150" height="88" rx="9"/>
<text class="mono sec" x="262" y="228">块哈希</text><text class="sans label" x="262" y="252">H(prefix,…)</text><text class="sans tiny" x="262" y="274">缓存标识</text>
<rect class="blue" x="244" y="326" width="150" height="88" rx="9"/>
<text class="mono sec" x="262" y="350" fill="#315f82">前缀命中</text><text class="sans label" x="262" y="374">H → block #42</text><text class="sans tiny" x="262" y="396">复用 KV；跳过重复计算</text>
<path class="line" d="M202 248 H244" marker-end="url(#a)"/><path class="bline" d="M202 370 H244" marker-end="url(#ab)"/>

<rect class="green" x="436" y="204" width="150" height="122" rx="10"/>
<text class="mono sec" x="454" y="228" fill="#255b46">物理块 #42</text><text class="sans label" x="454" y="252">有效缓存 KV</text><text class="mono tiny" x="454" y="274" fill="#255b46">hash H · ref_cnt = 1</text><text class="sans tiny" x="454" y="294">请求 A 是活跃所有者</text>
<path class="gline" d="M394 248 H436" marker-end="url(#ag)"/>
<path class="bline" d="M394 370 H414 V302 H436" marker-end="url(#ab)"/>

<rect class="green" x="622" y="204" width="86" height="210" rx="10"/>
<text class="mono sec" x="665" y="228" text-anchor="middle" fill="#255b46">共享</text><text class="sans label" x="665" y="252" text-anchor="middle">ref = 2</text>
<text class="sans tiny" x="637" y="282">A + B</text><line x1="637" y1="296" x2="693" y2="296" stroke="#c4d6ca"/>
<text class="sans tiny" x="637" y="320">A 结束 → 1</text><text class="sans tiny" x="637" y="342">B 结束 → 0</text>
<rect class="gold" x="634" y="360" width="62" height="38" rx="7"/>
<text class="mono tiny" x="665" y="376" text-anchor="middle" fill="#7b6a3e">仍然有效</text><text class="mono tiny" x="665" y="390" text-anchor="middle" fill="#7b6a3e">可淘汰</text>
<path class="gline" d="M586 264 H622" marker-end="url(#ag)"/>

<rect class="gold" x="436" y="362" width="150" height="94" rx="9"/>
<text class="mono sec" x="454" y="386" fill="#7b6a3e">空闲 / 可淘汰</text><text class="sans label" x="454" y="410">ref_cnt = 0</text><text class="sans tiny" x="454" y="432">哈希 + KV 仍可复用</text>
<path class="dash" d="M622 390 H586" marker-end="url(#a)"/>

<rect class="box" x="52" y="486" width="656" height="112" rx="10"/>
<text class="mono sec" x="70" y="510">关键不变量</text>
<text class="sans small" x="70" y="535">ref_cnt = 0 表示当前没有活跃请求持有该块。</text>
<text class="sans small" x="70" y="558">这不表示 KV 数据消失、哈希失效，也不表示某个请求被抢占。</text>
<text class="sans tiny" x="70" y="582">在缓存淘汰真正复用这个物理槽位前，它仍可服务后续前缀命中。</text>

<text class="mono sec" x="34" y="664">2 · 容量不足时：该结束哪种生命周期？</text>
<rect class="panel" x="34" y="680" width="692" height="232" rx="14"/>
<rect class="gold" x="52" y="714" width="184" height="150" rx="10"/>
<text class="mono sec" x="70" y="738" fill="#7b6a3e">缓存层</text><text class="sans label" x="70" y="764">淘汰无引用缓存</text><text class="sans small" x="70" y="788">使旧 H 失效</text><text class="sans small" x="70" y="808">复用物理块 #42</text><text class="sans tiny" x="70" y="838">请求仍可保持运行</text>

<rect class="dark" x="288" y="714" width="184" height="150" rx="10"/>
<text class="mono sec" x="306" y="738" fill="#b8c2bb">分配槽位</text><text class="sans label" x="306" y="764" style="fill:#eef2ed">所需 KV 放得下吗？</text>
<rect x="306" y="790" width="62" height="38" rx="7" fill="#eaf2ed"/><text class="mono sec" x="337" y="814" text-anchor="middle" fill="#255b46">可以</text>
<rect x="392" y="790" width="62" height="38" rx="7" fill="#f5eef3"/><text class="mono sec" x="423" y="814" text-anchor="middle" fill="#7d5d6f">不行</text>
<path class="line" d="M236 789 H288" marker-end="url(#a)"/>

<rect class="purple" x="524" y="714" width="184" height="150" rx="10"/>
<text class="mono sec" x="542" y="738" fill="#7d5d6f">请求层</text><text class="sans label" x="542" y="764">抢占运行中请求</text><text class="sans small" x="542" y="788">释放其资源</text><text class="sans small" x="542" y="808">让请求退出运行路径</text><text class="sans tiny" x="542" y="838">V1 默认恢复：重新计算</text>
<path class="pline" d="M472 789 H524" marker-end="url(#ap)"/>

<rect class="box" x="52" y="878" width="656" height="24" rx="7"/>
<text class="sans tiny" x="70" y="894">如果淘汰可回收的缓存块后已经能满足分配，只做缓存淘汰就可能足够，不一定需要请求级抢占。</text>
<text class="sans tiny" x="34" y="944">连接到下一模块：远端缓存复用还要额外处理传输就绪状态和远端生命周期。</text>
</svg>
