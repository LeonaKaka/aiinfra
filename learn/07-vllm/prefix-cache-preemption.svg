<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" role="img" aria-labelledby="title desc">
  <title id="title">vLLM V1 prefix cache, eviction, and preemption</title>
  <desc id="desc">Two-part architecture diagram. The first part shows two requests with the same prefix converging on the same hashed KV block, reference count changes, and a cached block becoming free but still reusable. The second part distinguishes cache-level eviction from request-level preemption when allocate_slots cannot satisfy KV capacity.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d847c"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
    <marker id="arrow-plum" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d5d6f"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.2px;fill:#8b938c}.title{font-size:27px;font-weight:750;fill:#252923}.subtitle{font-size:14px;fill:#6c746d}.section{font-size:11px;font-weight:700;letter-spacing:2.2px;fill:#8b938c}.cap{font-size:10px;font-weight:700;letter-spacing:.6px}.h{font-size:14px;font-weight:700;fill:#2f342f}.body{font-size:11px;fill:#69716a}.tiny{font-size:9px;fill:#707870}.tinybold{font-size:9px;font-weight:700}.box{fill:#fff;stroke:#cbd1ca;stroke-width:1.4}.green{fill:#eaf2ed;stroke:#bfd5c6;stroke-width:1.4}.blue{fill:#edf4f8;stroke:#c1d6e4;stroke-width:1.4}.sand{fill:#faf5ea;stroke:#e0cfad;stroke-width:1.4}.plum{fill:#f5eef3;stroke:#dcc8d4;stroke-width:1.4}.panel{fill:#fcfcfa;stroke:#cfd4cd;stroke-width:1.5}.dark{fill:#1f2521}.line{fill:none;stroke:#7d847c;stroke-width:1.5}.dash{fill:none;stroke:#9ba19a;stroke-width:1.3;stroke-dasharray:5 5}.greenline{fill:none;stroke:#255b46;stroke-width:1.6}.blueline{fill:none;stroke:#315f82;stroke-width:1.6}.plumline{fill:none;stroke:#7d5d6f;stroke-width:1.6}
    </style>
  </defs>
  <text class="mono eyebrow" x="56" y="48">VLLM V1 · LOCAL KV LIFETIME</text>
  <text class="sans title" x="56" y="82">Prefix cache, eviction, and preemption are three different lifetimes</text>
  <text class="sans subtitle" x="56" y="110">Keeping the three layers separate makes BlockPool and Scheduler behavior much easier to read.</text>
  <rect class="panel" x="56" y="146" width="988" height="402" rx="16"/>
  <text class="mono section" x="80" y="176">A · PREFIX IDENTITY + SHARED PHYSICAL OWNERSHIP</text>
  <rect class="sand" x="82" y="210" width="194" height="98" rx="12"/>
  <text class="mono cap" x="102" y="238" fill="#7b6a3e">REQUEST A</text><text class="sans h" x="102" y="265">same prefix tokens</text><text class="sans tiny" x="102" y="288">first request computes a full cacheable block</text>
  <rect class="blue" x="82" y="350" width="194" height="98" rx="12"/>
  <text class="mono cap" x="102" y="378" fill="#315f82">REQUEST B</text><text class="sans h" x="102" y="405">same prefix tokens</text><text class="sans tiny" x="102" y="428">lookup computes the same prefix identity</text>
  <rect class="box" x="326" y="210" width="190" height="98" rx="12"/>
  <text class="mono cap" x="346" y="238" fill="#59605a">BLOCK HASH</text><text class="sans h" x="346" y="265">H(prefix, parent, extras)</text><text class="sans tiny" x="346" y="288">group-aware cache identity</text>
  <rect class="blue" x="326" y="350" width="190" height="98" rx="12"/>
  <text class="mono cap" x="346" y="378" fill="#315f82">PREFIX HIT</text><text class="sans h" x="346" y="405">H -&gt; block #42</text><text class="sans tiny" x="346" y="428">reuse KV; skip duplicate Prefill work</text>
  <rect class="green" x="566" y="202" width="216" height="114" rx="13"/>
  <text class="mono cap" x="586" y="230" fill="#255b46">PHYSICAL KV BLOCK #42</text><text class="sans h" x="586" y="258">valid cached KV</text><text class="mono tinybold" x="586" y="282" fill="#255b46">hash H · ref_cnt = 1</text><text class="sans tiny" x="586" y="301">active owner: request A</text>
  <rect class="green" x="834" y="202" width="174" height="244" rx="13"/>
  <text class="mono cap" x="854" y="230" fill="#255b46">SAME BLOCK</text><text class="sans h" x="854" y="258">ref_cnt = 2</text><text class="sans tinybold" x="854" y="283" fill="#255b46">A + B both reference #42</text><line x1="854" y1="306" x2="988" y2="306" stroke="#c7d6cc"/><text class="sans tiny" x="854" y="330">A finishes: ref 1</text><text class="sans tiny" x="854" y="352">B finishes: ref 0</text>
  <rect class="sand" x="854" y="374" width="134" height="54" rx="9"/><text class="sans tinybold" x="871" y="397" fill="#7b6a3e">still valid cache</text><text class="sans tiny" x="871" y="416">now evictable</text>
  <rect class="sand" x="566" y="350" width="216" height="98" rx="12"/>
  <text class="mono cap" x="586" y="378" fill="#7b6a3e">FREE / EVICTABLE QUEUE</text><text class="sans h" x="586" y="405">ref_cnt = 0, hash still valid</text><text class="sans tiny" x="586" y="428">available for hit or future eviction</text>
  <path class="line" d="M276 259 H326" marker-end="url(#arrow-gray)"/><path class="greenline" d="M516 259 H566" marker-end="url(#arrow-green)"/><path class="greenline" d="M782 259 H834" marker-end="url(#arrow-green)"/><path class="blueline" d="M276 399 H326" marker-end="url(#arrow-blue)"/><path class="blueline" d="M516 399 H540 V296 H566" marker-end="url(#arrow-blue)"/><path class="dash" d="M834 399 H782" marker-end="url(#arrow-gray)"/>
  <text class="sans tinybold" x="80" y="504" fill="#737b74">Important: “free” means available for allocation / eviction ordering; ref_cnt=0 does not erase reusable KV contents or the hash.</text>
  <text class="mono section" x="56" y="594">B · WHEN CAPACITY IS NEEDED, ASK WHICH LIFETIME SHOULD END</text>
  <rect class="panel" x="56" y="616" width="988" height="248" rx="16"/>
  <rect class="sand" x="82" y="650" width="252" height="164" rx="13"/>
  <text class="mono cap" x="102" y="678" fill="#7b6a3e">CACHE-LEVEL DECISION</text><text class="sans h" x="102" y="706">evict an unreferenced cached block</text><text class="sans body" x="102" y="730">BlockPool needs a reusable physical block.</text><rect class="box" x="102" y="754" width="212" height="44" rx="8"/><text class="sans tinybold" x="116" y="773" fill="#777f78">invalidate old H; reuse #42</text><text class="sans tiny" x="116" y="790">request state does not need preemption</text>
  <rect class="dark" x="424" y="650" width="252" height="164" rx="13"/>
  <text class="mono cap" x="444" y="678" fill="#b8c1bb">ALLOCATE_SLOTS</text><text class="sans h" x="444" y="706" style="fill:#f3f5f1">does required KV fit?</text><text class="sans body" x="444" y="730" style="fill:#aeb8b1">scheduler asks through KVCacheManager</text><rect x="444" y="754" width="98" height="42" rx="8" fill="#eaf2ed"/><rect x="558" y="754" width="98" height="42" rx="8" fill="#f5eef3"/><text class="mono tinybold" x="493" y="780" text-anchor="middle" fill="#255b46">YES</text><text class="mono tinybold" x="607" y="780" text-anchor="middle" fill="#7d5d6f">NO</text>
  <rect class="plum" x="766" y="650" width="242" height="164" rx="13"/>
  <text class="mono cap" x="786" y="678" fill="#7d5d6f">REQUEST-LEVEL DECISION</text><text class="sans h" x="786" y="706">preempt a running request</text><text class="sans body" x="786" y="730">free its owned resources, change status</text><rect class="box" x="786" y="754" width="202" height="44" rx="8"/><text class="mono tinybold" x="800" y="773" fill="#7d5d6f">PREEMPTED / waiting path</text><text class="sans tiny" x="800" y="790">V1 default resume: recompute KV</text>
  <path class="line" d="M334 732 H424" marker-end="url(#arrow-gray)"/><path class="plumline" d="M676 732 H766" marker-end="url(#arrow-plum)"/><path class="greenline" d="M493 796 V838 H550 V814" marker-end="url(#arrow-green)"/>
  <text class="sans tinybold" x="550" y="847" text-anchor="middle" fill="#255b46">If a free / evictable block satisfies allocation, no request-level preemption is needed.</text>
  <text class="sans tinybold" x="82" y="904" fill="#737b74">Bridge to KV Connector: a remote cache hit adds readiness and transfer lifetime—not only a local block hash.</text>
</svg>