<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 prefix cache, eviction, and preemption</title>
<desc id="desc">The first panel separates prefix identity, shared physical KV ownership, and the free-but-still-cached state. The second panel separates cache-level eviction from request-level preemption when KV allocation cannot fit.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#747b74"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
 <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d5d6f"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .ey{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#8a918a}.ttl{font-size:24px;font-weight:760;fill:#252a25}.subt{font-size:13px;fill:#687069}.sec{font-size:10px;font-weight:700;letter-spacing:1.35px;fill:#8b928b}.label{font-size:11px;font-weight:760;fill:#343c35}.small{font-size:10px;fill:#687069}.tiny{font-size:9px;fill:#687069}.panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}.box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}.blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}.green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}.gold{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}.purple{fill:#f5eef3;stroke:#dac7d2;stroke-width:1.1}.dark{fill:#222824}.line{fill:none;stroke:#747b74;stroke-width:1.3}.bline{fill:none;stroke:#315f82;stroke-width:1.4}.gline{fill:none;stroke:#255b46;stroke-width:1.4}.pline{fill:none;stroke:#7d5d6f;stroke-width:1.4}.dash{fill:none;stroke:#9da49e;stroke-dasharray:5 5;stroke-width:1.1}
 </style>
</defs>
<text class="mono ey" x="34" y="34">vLLM V1 · LOCAL KV LIFETIME</text>
<text class="sans ttl" x="34" y="67">Prefix identity, cache eviction and request preemption</text>
<text class="sans ttl" x="34" y="94">are three different lifetimes</text>
<text class="sans subt" x="34" y="119">Keep hash identity, physical block ownership, and scheduler request state separate.</text>

<text class="mono sec" x="34" y="154">1 · PREFIX IDENTITY + SHARED PHYSICAL OWNERSHIP</text>
<rect class="panel" x="34" y="170" width="692" height="456" rx="14"/>

<rect class="gold" x="52" y="204" width="150" height="88" rx="9"/>
<text class="mono sec" x="70" y="228" fill="#7b6a3e">REQUEST A</text><text class="sans label" x="70" y="252">same prefix tokens</text><text class="sans tiny" x="70" y="274">computes cacheable KV</text>
<rect class="blue" x="52" y="326" width="150" height="88" rx="9"/>
<text class="mono sec" x="70" y="350" fill="#315f82">REQUEST B</text><text class="sans label" x="70" y="374">same prefix tokens</text><text class="sans tiny" x="70" y="396">lookup finds same identity</text>

<rect class="box" x="244" y="204" width="150" height="88" rx="9"/>
<text class="mono sec" x="262" y="228">BLOCK HASH</text><text class="sans label" x="262" y="252">H(prefix,…)</text><text class="sans tiny" x="262" y="274">cache identity</text>
<rect class="blue" x="244" y="326" width="150" height="88" rx="9"/>
<text class="mono sec" x="262" y="350" fill="#315f82">PREFIX HIT</text><text class="sans label" x="262" y="374">H → block #42</text><text class="sans tiny" x="262" y="396">reuse KV; skip duplicate work</text>
<path class="line" d="M202 248 H244" marker-end="url(#a)"/><path class="bline" d="M202 370 H244" marker-end="url(#ab)"/>

<rect class="green" x="436" y="204" width="150" height="122" rx="10"/>
<text class="mono sec" x="454" y="228" fill="#255b46">PHYSICAL BLOCK #42</text><text class="sans label" x="454" y="252">valid cached KV</text><text class="mono tiny" x="454" y="274" fill="#255b46">hash H · ref_cnt = 1</text><text class="sans tiny" x="454" y="294">request A is active owner</text>
<path class="gline" d="M394 248 H436" marker-end="url(#ag)"/>
<path class="bline" d="M394 370 H414 V302 H436" marker-end="url(#ab)"/>

<rect class="green" x="622" y="204" width="86" height="210" rx="10"/>
<text class="mono sec" x="665" y="228" text-anchor="middle" fill="#255b46">SHARED</text><text class="sans label" x="665" y="252" text-anchor="middle">ref = 2</text>
<text class="sans tiny" x="637" y="282">A + B</text><line x1="637" y1="296" x2="693" y2="296" stroke="#c4d6ca"/>
<text class="sans tiny" x="637" y="320">A ends → 1</text><text class="sans tiny" x="637" y="342">B ends → 0</text>
<rect class="gold" x="634" y="360" width="62" height="38" rx="7"/>
<text class="mono tiny" x="665" y="376" text-anchor="middle" fill="#7b6a3e">still valid</text><text class="mono tiny" x="665" y="390" text-anchor="middle" fill="#7b6a3e">evictable</text>
<path class="gline" d="M586 264 H622" marker-end="url(#ag)"/>

<rect class="gold" x="436" y="362" width="150" height="94" rx="9"/>
<text class="mono sec" x="454" y="386" fill="#7b6a3e">FREE / EVICTABLE</text><text class="sans label" x="454" y="410">ref_cnt = 0</text><text class="sans tiny" x="454" y="432">hash + KV remain reusable</text>
<path class="dash" d="M622 390 H586" marker-end="url(#a)"/>

<rect class="box" x="52" y="486" width="656" height="112" rx="10"/>
<text class="mono sec" x="70" y="510">THE KEY INVARIANT</text>
<text class="sans small" x="70" y="535">`ref_cnt = 0` means no active request owns this block right now.</text>
<text class="sans small" x="70" y="558">It does not mean the KV bytes disappeared, the hash was invalidated, or a request was preempted.</text>
<text class="sans tiny" x="70" y="582">The block can satisfy a later prefix hit until cache-level eviction reuses that physical slot.</text>

<text class="mono sec" x="34" y="664">2 · CAPACITY PRESSURE: WHICH LIFETIME SHOULD END?</text>
<rect class="panel" x="34" y="680" width="692" height="232" rx="14"/>
<rect class="gold" x="52" y="714" width="184" height="150" rx="10"/>
<text class="mono sec" x="70" y="738" fill="#7b6a3e">CACHE-LEVEL</text><text class="sans label" x="70" y="764">evict unreferenced cache</text><text class="sans small" x="70" y="788">invalidate old H</text><text class="sans small" x="70" y="808">reuse physical block #42</text><text class="sans tiny" x="70" y="838">request state can stay running</text>

<rect class="dark" x="288" y="714" width="184" height="150" rx="10"/>
<text class="mono sec" x="306" y="738" fill="#b8c2bb">ALLOCATE_SLOTS</text><text class="sans label" x="306" y="764" style="fill:#eef2ed">does required KV fit?</text>
<rect x="306" y="790" width="62" height="38" rx="7" fill="#eaf2ed"/><text class="mono sec" x="337" y="814" text-anchor="middle" fill="#255b46">YES</text>
<rect x="392" y="790" width="62" height="38" rx="7" fill="#f5eef3"/><text class="mono sec" x="423" y="814" text-anchor="middle" fill="#7d5d6f">NO</text>
<path class="line" d="M236 789 H288" marker-end="url(#a)"/>

<rect class="purple" x="524" y="714" width="184" height="150" rx="10"/>
<text class="mono sec" x="542" y="738" fill="#7d5d6f">REQUEST-LEVEL</text><text class="sans label" x="542" y="764">preempt running request</text><text class="sans small" x="542" y="788">free owned resources</text><text class="sans small" x="542" y="808">move request off running path</text><text class="sans tiny" x="542" y="838">V1 default resume: recompute</text>
<path class="pline" d="M472 789 H524" marker-end="url(#ap)"/>

<rect class="box" x="52" y="878" width="656" height="24" rx="7"/>
<text class="sans tiny" x="70" y="894">If evictable cache blocks satisfy allocation, cache eviction may be enough; request-level preemption is not automatically required.</text>
<text class="sans tiny" x="34" y="944">Bridge to KV Connector: remote cache reuse adds transfer readiness and remote lifetime on top of this local cache identity.</text>
</svg>
