<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 Scheduler and continuous batching</title>
<desc id="desc">Running and waiting requests enter a token-budget scheduler. The scheduler checks KV 容量, emits a mixed SchedulerOutput, can preempt requests on allocation failure, and rebuilds batch membership between execution iterations rather than inserting work into a running kernel.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#747b74"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
 <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d5d6f"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .ey{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#8a918a}.ttl{font-size:24px;font-weight:760;fill:#252a25}.subt{font-size:13px;fill:#687069}.sec{font-size:10px;font-weight:700;letter-spacing:1.35px;fill:#8b928b}.label{font-size:11px;font-weight:760;fill:#343c35}.small{font-size:10px;fill:#687069}.tiny{font-size:9px;fill:#687069}.panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}.box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}.blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}.green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}.gold{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}.purple{fill:#f5eef3;stroke:#dac7d2;stroke-width:1.1}.dark{fill:#222824}.line{fill:none;stroke:#747b74;stroke-width:1.3}.bline{fill:none;stroke:#315f82;stroke-width:1.4}.gline{fill:none;stroke:#255b46;stroke-width:1.4}.pline{fill:none;stroke:#7d5d6f;stroke-width:1.4}.dash{fill:none;stroke:#9da49e;stroke-dasharray:5 5;stroke-width:1.1}
 </style>
</defs>
<text class="mono ey" x="34" y="34">vLLM V1 · 连续批处理 · 每轮重新规划</text>
<text class="sans ttl" x="34" y="67">批次不是固定请求集合；</text>
<text class="sans ttl" x="34" y="94">它会在 token、请求数和 KV 预算约束下重新生成</text>
<text class="sans subt" x="34" y="119">每一轮都重新判断当前能放入哪些 token 工作：执行 → 更新状态 → 再规划。</text>

<text class="mono sec" x="34" y="154">1 · 请求状态 → 资源检查 → SCHEDULEROUTPUT</text>
<rect class="panel" x="34" y="170" width="692" height="500" rx="14"/>

<rect class="blue" x="52" y="202" width="164" height="154" rx="10"/>
<text class="mono sec" x="70" y="226" fill="#315f82">运行中</text>
<text class="sans small" x="70" y="248">已有执行状态 / KV</text>
<rect class="box" x="70" y="266" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="282">A · +1 token</text>
<rect class="box" x="70" y="296" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="312">B · +1 token</text>
<rect class="gold" x="70" y="326" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="342" fill="#7b6a3e">C · Prefill 分块</text>

<rect class="gold" x="52" y="382" width="164" height="142" rx="10"/>
<text class="mono sec" x="70" y="406" fill="#7b6a3e">等待中</text>
<text class="sans small" x="70" y="428">本轮未准入</text>
<rect class="box" x="70" y="446" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="462">D · 长输入</text>
<rect class="box" x="70" y="476" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="492">E · 短输入</text>
<text class="sans tiny" x="70" y="514">准入时检查前缀 / 远端命中</text>

<rect class="dark" x="272" y="202" width="194" height="250" rx="11"/>
<text class="mono sec" x="290" y="228" fill="#b8c2bb">调度器 · schedule()</text>
<text class="sans label" x="290" y="253" style="fill:#eef2ed">推进当前放得下的 token 工作</text>
<rect x="290" y="274" width="158" height="42" rx="7" fill="#edf4f8"/>
<text class="mono tiny" x="302" y="292" fill="#315f82">1 · 运行中请求</text><text class="mono tiny" x="302" y="306" fill="#315f82">优先考虑</text>
<rect x="290" y="328" width="158" height="56" rx="7" fill="#faf5ea"/>
<text class="mono tiny" x="302" y="346" fill="#7b6a3e">2 · 有余量再考虑等待请求</text><text class="mono tiny" x="302" y="360" fill="#7b6a3e">长 Prefill 仍有剩余</text><text class="mono tiny" x="302" y="374" fill="#7b6a3e">可以分块</text>
<text class="mono tiny" x="290" y="408" style="fill:#b8c2bb">token 预算</text><text class="mono tiny" x="290" y="424" style="fill:#b8c2bb">请求数上限</text><text class="mono tiny" x="290" y="440" style="fill:#b8c2bb">KV 容量</text>
<path class="bline" d="M216 278 H272" marker-end="url(#ab)"/>
<path class="line" d="M216 454 H244 V356 H272" marker-end="url(#a)"/>

<rect class="green" x="272" y="488" width="194" height="104" rx="10"/>
<text class="mono sec" x="290" y="512" fill="#255b46">KVCACHEMANAGER</text>
<text class="sans small" x="290" y="536">缓存前缀 · 分配槽位 · 释放</text>
<text class="sans tiny" x="290" y="558">分配是否成功会约束调度</text>
<path class="gline" d="M326 452 V488" marker-end="url(#ag)"/><path class="gline" d="M412 488 V452" marker-end="url(#ag)"/>
<text class="mono tiny" x="424" y="475" fill="#255b46">KV 块 / 失败</text>

<rect class="box" x="522" y="202" width="184" height="250" rx="11"/>
<text class="mono sec" x="540" y="228">SCHEDULEROUTPUT</text>
<text class="sans small" x="540" y="250">一个混合执行计划</text>
<text class="mono tiny" x="540" y="276">已调度 token 工作</text>
<g transform="translate(540 288)" class="mono tiny">
 <rect class="blue" width="36" height="28" rx="5"/><text x="18" y="19" text-anchor="middle" fill="#315f82">A+1</text>
 <rect class="blue" x="42" width="36" height="28" rx="5"/><text x="60" y="19" text-anchor="middle" fill="#315f82">B+1</text>
 <rect class="gold" x="84" width="82" height="28" rx="5"/><text x="125" y="19" text-anchor="middle" fill="#7b6a3e">C chunk</text>
</g>
<rect class="green" x="540" y="338" width="148" height="62" rx="7"/>
<text class="sans tiny" x="552" y="358" fill="#255b46">+ 每个请求的 token 数</text>
<text class="sans tiny" x="552" y="376" fill="#255b46">+ 物理 KV 块映射</text>
<path class="bline" d="M466 326 H522" marker-end="url(#ab)"/>

<rect class="purple" x="522" y="488" width="184" height="104" rx="10"/>
<text class="mono sec" x="540" y="512" fill="#7d5d6f">如果 KV 放不下</text>
<text class="sans small" x="540" y="536">抢占请求 → 释放资源</text>
<text class="sans tiny" x="540" y="558">V1 默认恢复：重新计算</text>
<path class="pline" d="M466 540 H522" marker-end="url(#ap)"/>
<path class="dash" d="M614 592 V630 H134 V524" marker-end="url(#a)"/>
<text class="sans tiny" x="272" y="622">被抢占的工作可以在后续调度轮次重新进入</text>

<text class="mono sec" x="34" y="708">2 · 连续批处理发生在执行轮次之间</text>
<rect class="panel" x="34" y="724" width="692" height="168" rx="14"/>
<rect class="box" x="52" y="756" width="182" height="92" rx="9"/>
<text class="mono sec" x="70" y="780">第 k 轮</text><text class="sans small" x="70" y="804">批次：A · B · C</text><text class="sans tiny" x="70" y="826">输出更新后 A 完成</text>
<rect class="blue" x="290" y="756" width="182" height="92" rx="9"/>
<text class="mono sec" x="308" y="780" fill="#315f82">更新状态</text><text class="sans small" x="308" y="804">完成请求退出 · 进度继续推进</text><text class="sans tiny" x="308" y="826">新的容量空出来</text>
<rect class="green" x="528" y="756" width="178" height="92" rx="9"/>
<text class="mono sec" x="546" y="780" fill="#255b46">第 k 轮+1</text><text class="sans small" x="546" y="804">B · C 继续</text><text class="sans tiny" x="546" y="826">D / E 此时可以进入</text>
<path class="line" d="M234 802 H290" marker-end="url(#a)"/><path class="gline" d="M472 802 H528" marker-end="url(#ag)"/>

<rect class="box" x="34" y="906" width="692" height="18" rx="7"/>
<text class="sans tiny" x="52" y="919">连续批处理不会把请求插进正在运行的内核；批次成员只会在调度 / 执行边界发生变化。</text>
</svg>
