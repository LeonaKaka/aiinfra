<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 930" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 Scheduler and continuous batching</title>
<desc id="desc">Running and waiting requests enter a token-budget scheduler. The scheduler checks KV capacity, emits a mixed SchedulerOutput, can preempt requests on allocation failure, and rebuilds batch membership between execution iterations rather than inserting work into a running kernel.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#747b74"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
 <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d5d6f"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .ey{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#8a918a}.ttl{font-size:24px;font-weight:760;fill:#252a25}.subt{font-size:13px;fill:#687069}.sec{font-size:10px;font-weight:700;letter-spacing:1.35px;fill:#8b928b}.label{font-size:11px;font-weight:760;fill:#343c35}.small{font-size:10px;fill:#687069}.tiny{font-size:9px;fill:#687069}.panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}.box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}.blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}.green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}.gold{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}.purple{fill:#f5eef3;stroke:#dac7d2;stroke-width:1.1}.dark{fill:#222824}.line{fill:none;stroke:#747b74;stroke-width:1.3}.bline{fill:none;stroke:#315f82;stroke-width:1.4}.gline{fill:none;stroke:#255b46;stroke-width:1.4}.pline{fill:none;stroke:#7d5d6f;stroke-width:1.4}.dash{fill:none;stroke:#9da49e;stroke-dasharray:5 5;stroke-width:1.1}
 </style>
</defs>
<text class="mono ey" x="34" y="34">vLLM V1 · CONTINUOUS BATCHING · RE-PLAN EVERY ITERATION</text>
<text class="sans ttl" x="34" y="67">The batch is not a fixed set of requests;</text>
<text class="sans ttl" x="34" y="94">it is a plan rebuilt under token, request and KV budgets</text>
<text class="sans subt" x="34" y="119">Each iteration asks what token work can fit now, executes it, updates state, then plans again.</text>

<text class="mono sec" x="34" y="154">1 · REQUEST STATE → RESOURCE CHECKS → SCHEDULEROUTPUT</text>
<rect class="panel" x="34" y="170" width="692" height="500" rx="14"/>

<rect class="blue" x="52" y="202" width="164" height="154" rx="10"/>
<text class="mono sec" x="70" y="226" fill="#315f82">RUNNING</text>
<text class="sans small" x="70" y="248">already has execution state / KV</text>
<rect class="box" x="70" y="266" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="282">A · +1 token</text>
<rect class="box" x="70" y="296" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="312">B · +1 token</text>
<rect class="gold" x="70" y="326" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="342" fill="#7b6a3e">C · Prefill chunk</text>

<rect class="gold" x="52" y="382" width="164" height="142" rx="10"/>
<text class="mono sec" x="70" y="406" fill="#7b6a3e">WAITING</text>
<text class="sans small" x="70" y="428">not admitted this iteration</text>
<rect class="box" x="70" y="446" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="462">D · long prompt</text>
<rect class="box" x="70" y="476" width="128" height="24" rx="5"/><text class="mono tiny" x="82" y="492">E · short prompt</text>
<text class="sans tiny" x="70" y="514">prefix / remote hits checked on admission</text>

<rect class="dark" x="272" y="202" width="194" height="250" rx="11"/>
<text class="mono sec" x="290" y="228" fill="#b8c2bb">SCHEDULER · schedule()</text>
<text class="sans label" x="290" y="253" style="fill:#eef2ed">advance token progress that fits</text>
<rect x="290" y="274" width="158" height="42" rx="7" fill="#edf4f8"/>
<text class="mono tiny" x="302" y="292" fill="#315f82">1 · running requests</text><text class="mono tiny" x="302" y="306" fill="#315f82">considered first</text>
<rect x="290" y="328" width="158" height="56" rx="7" fill="#faf5ea"/>
<text class="mono tiny" x="302" y="346" fill="#7b6a3e">2 · waiting if room</text><text class="mono tiny" x="302" y="360" fill="#7b6a3e">remains; long Prefill</text><text class="mono tiny" x="302" y="374" fill="#7b6a3e">can be chunked</text>
<text class="mono tiny" x="290" y="408" style="fill:#b8c2bb">token budget</text><text class="mono tiny" x="290" y="424" style="fill:#b8c2bb">request limit</text><text class="mono tiny" x="290" y="440" style="fill:#b8c2bb">KV capacity</text>
<path class="bline" d="M216 278 H272" marker-end="url(#ab)"/>
<path class="line" d="M216 454 H244 V356 H272" marker-end="url(#a)"/>

<rect class="green" x="272" y="488" width="194" height="104" rx="10"/>
<text class="mono sec" x="290" y="512" fill="#255b46">KVCACHEMANAGER</text>
<text class="sans small" x="290" y="536">cached prefix · allocate_slots · free</text>
<text class="sans tiny" x="290" y="558">allocation success constrains schedule</text>
<path class="gline" d="M326 452 V488" marker-end="url(#ag)"/><path class="gline" d="M412 488 V452" marker-end="url(#ag)"/>
<text class="mono tiny" x="424" y="475" fill="#255b46">blocks / fail</text>

<rect class="box" x="522" y="202" width="184" height="250" rx="11"/>
<text class="mono sec" x="540" y="228">SCHEDULEROUTPUT</text>
<text class="sans small" x="540" y="250">one mixed execution plan</text>
<text class="mono tiny" x="540" y="276">scheduled token work</text>
<g transform="translate(540 288)" class="mono tiny">
 <rect class="blue" width="36" height="28" rx="5"/><text x="18" y="19" text-anchor="middle" fill="#315f82">A+1</text>
 <rect class="blue" x="42" width="36" height="28" rx="5"/><text x="60" y="19" text-anchor="middle" fill="#315f82">B+1</text>
 <rect class="gold" x="84" width="82" height="28" rx="5"/><text x="125" y="19" text-anchor="middle" fill="#7b6a3e">C chunk</text>
</g>
<rect class="green" x="540" y="338" width="148" height="62" rx="7"/>
<text class="sans tiny" x="552" y="358" fill="#255b46">per-request token counts</text>
<text class="sans tiny" x="552" y="376" fill="#255b46">+ physical KV block mapping</text>
<path class="bline" d="M466 326 H522" marker-end="url(#ab)"/>

<rect class="purple" x="522" y="488" width="184" height="104" rx="10"/>
<text class="mono sec" x="540" y="512" fill="#7d5d6f">IF KV CANNOT FIT</text>
<text class="sans small" x="540" y="536">preempt victim → free resources</text>
<text class="sans tiny" x="540" y="558">V1 recovery: recompute by default</text>
<path class="pline" d="M466 540 H522" marker-end="url(#ap)"/>
<path class="dash" d="M614 592 V630 H134 V524" marker-end="url(#a)"/>
<text class="sans tiny" x="272" y="622">preempted work may re-enter a later scheduling iteration</text>

<text class="mono sec" x="34" y="708">2 · CONTINUOUS BATCHING HAPPENS BETWEEN EXECUTION ITERATIONS</text>
<rect class="panel" x="34" y="724" width="692" height="168" rx="14"/>
<rect class="box" x="52" y="756" width="182" height="92" rx="9"/>
<text class="mono sec" x="70" y="780">ITERATION k</text><text class="sans small" x="70" y="804">batch: A · B · C</text><text class="sans tiny" x="70" y="826">A finishes after output update</text>
<rect class="blue" x="290" y="756" width="182" height="92" rx="9"/>
<text class="mono sec" x="308" y="780" fill="#315f82">UPDATE STATE</text><text class="sans small" x="308" y="804">finished leaves · progress advances</text><text class="sans tiny" x="308" y="826">new capacity becomes visible</text>
<rect class="green" x="528" y="756" width="178" height="92" rx="9"/>
<text class="mono sec" x="546" y="780" fill="#255b46">ITERATION k+1</text><text class="sans small" x="546" y="804">B · C continue</text><text class="sans tiny" x="546" y="826">D / E may now enter</text>
<path class="line" d="M234 802 H290" marker-end="url(#a)"/><path class="gline" d="M472 802 H528" marker-end="url(#ag)"/>

<rect class="box" x="34" y="906" width="692" height="18" rx="7"/>
<text class="sans tiny" x="52" y="919">Continuous batching does not insert a request into a running kernel; membership changes at scheduling / execution boundaries.</text>
</svg>
