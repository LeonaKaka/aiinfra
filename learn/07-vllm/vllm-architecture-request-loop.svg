<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 request lifecycle and execution boundary</title>
<desc id="desc">EngineCore and Scheduler own request planning on the control plane. KVCacheManager provides scheduler-side block state. SchedulerOutput crosses into ModelExecutor and GPU Worker, which selects a V2 or V1 GPUModelRunner implementation. GPU execution produces ModelRunnerOutput, then EngineCore and Scheduler update request state.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#747b74"/></marker>
 <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
 <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
 <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d5d6f"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .ey{font-size:11px;font-weight:700;letter-spacing:1.6px;fill:#8a918a}.ttl{font-size:24px;font-weight:760;fill:#252a25}.subt{font-size:13px;fill:#687069}.sec{font-size:10px;font-weight:700;letter-spacing:1.35px;fill:#8b928b}.label{font-size:11px;font-weight:760;fill:#343c35}.small{font-size:10px;fill:#687069}.tiny{font-size:9px;fill:#687069}.plane{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}.box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}.blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}.green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}.purple{fill:#f5eef3;stroke:#dac7d2;stroke-width:1.1}.gold{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}.dark{fill:#222824}.line{fill:none;stroke:#747b74;stroke-width:1.3}.bline{fill:none;stroke:#315f82;stroke-width:1.4}.gline{fill:none;stroke:#255b46;stroke-width:1.4}.pline{fill:none;stroke:#7d5d6f;stroke-width:1.4}.dash{stroke:#a9afa9;stroke-dasharray:5 5;stroke-width:1.1}
 </style>
</defs>
<text class="mono ey" x="34" y="34">vLLM V1 · REQUEST LOOP · CONTROL → EXECUTION → FEEDBACK</text>
<text class="sans ttl" x="34" y="67">Scheduler decides the work;</text>
<text class="sans ttl" x="34" y="94">the execution plane turns that plan into GPU tensors</text>
<text class="sans subt" x="34" y="119">Read the architecture as one loop: request state → plan + KV allocation → GPU work → output → state update.</text>

<text class="mono sec" x="34" y="154">1 · CONTROL PLANE · REQUEST STATE + MEMORY OWNERSHIP + PLAN</text>
<rect class="plane" x="34" y="170" width="692" height="320" rx="14"/>
<rect class="gold" x="52" y="208" width="138" height="76" rx="9"/>
<text class="mono sec" x="70" y="231" fill="#7b6a3e">REQUEST STATE</text><text class="sans label" x="70" y="254">prompt / outputs</text><text class="sans tiny" x="70" y="273">WAITING or RUNNING</text>
<rect class="blue" x="232" y="200" width="150" height="92" rx="10"/>
<text class="mono sec" x="250" y="224" fill="#315f82">ENGINECORE</text><text class="sans label" x="250" y="248">owns step loop</text><text class="sans tiny" x="250" y="268">schedule → execute → update</text>
<rect class="blue" x="424" y="200" width="150" height="92" rx="10"/>
<text class="mono sec" x="442" y="224" fill="#315f82">SCHEDULER</text><text class="sans label" x="442" y="248">choose token work</text><text class="sans tiny" x="442" y="268">budgets · WAITING/RUNNING</text>
<path class="bline" d="M190 246 H232" marker-end="url(#ab)"/><path class="bline" d="M382 246 H424" marker-end="url(#ab)"/>

<rect class="green" x="424" y="330" width="150" height="88" rx="10"/>
<text class="mono sec" x="442" y="354" fill="#255b46">KVCACHEMANAGER</text><text class="sans small" x="442" y="377">prefix hit · allocate · free</text><text class="sans tiny" x="442" y="397">physical block ownership</text>
<path class="gline" d="M468 292 V330" marker-end="url(#ag)"/><path class="gline" d="M532 330 V292" marker-end="url(#ag)"/>
<text class="mono tiny" x="548" y="315" fill="#255b46">query / result</text>

<rect class="dark" x="610" y="200" width="98" height="218" rx="10"/>
<text class="mono sec" x="659" y="224" text-anchor="middle" fill="#b9c3bc">SCHEDULER</text><text class="mono sec" x="659" y="238" text-anchor="middle" fill="#b9c3bc">OUTPUT</text>
<text class="sans tiny" x="626" y="266" style="fill:#eef2ed">request IDs</text><text class="sans tiny" x="626" y="284" style="fill:#eef2ed">token counts</text><text class="sans tiny" x="626" y="302" style="fill:#eef2ed">KV blocks</text><text class="sans tiny" x="626" y="320" style="fill:#eef2ed">metadata</text>
<path class="bline" d="M574 246 H610" marker-end="url(#ab)"/>
<rect x="620" y="346" width="78" height="54" rx="7" fill="#fff"/>
<text class="mono tiny" x="659" y="365" text-anchor="middle">iteration</text><text class="mono tiny" x="659" y="380" text-anchor="middle">execution</text><text class="mono tiny" x="659" y="395" text-anchor="middle">contract</text>

<rect class="box" x="232" y="430" width="342" height="48" rx="8"/>
<text class="mono sec" x="250" y="450">UPDATE_FROM_OUTPUT</text>
<text class="sans tiny" x="250" y="466">advance request state / finish</text>
<path class="bline" d="M232 454 H210 V310 H307 V292" marker-end="url(#ab)"/>

<line class="dash" x1="34" y1="526" x2="726" y2="526"/>
<rect class="gold" x="267" y="510" width="226" height="32" rx="7"/>
<text class="mono sec" x="380" y="531" text-anchor="middle" fill="#7b6a3e">CONTROL / EXECUTION BOUNDARY</text>

<text class="mono sec" x="34" y="574">2 · EXECUTION PLANE · PLAN → DEVICE WORK → MODELRUNNEROUTPUT</text>
<rect class="plane" x="34" y="590" width="692" height="250" rx="14"/>
<rect class="purple" x="52" y="626" width="138" height="80" rx="9"/>
<text class="mono sec" x="70" y="650" fill="#7d5d6f">MODEL EXECUTOR</text><text class="sans label" x="70" y="674">execute_model(...)</text><text class="sans tiny" x="70" y="692">distributed facade</text>
<rect class="purple" x="226" y="626" width="126" height="80" rx="9"/>
<text class="mono sec" x="244" y="650" fill="#7d5d6f">GPU WORKER</text><text class="sans label" x="244" y="674">device process</text><text class="sans tiny" x="244" y="692">owns model_runner</text>
<path class="pline" d="M190 666 H226" marker-end="url(#ap)"/>

<rect class="box" x="388" y="610" width="142" height="112" rx="10"/>
<text class="mono sec" x="406" y="634">RUNNER SELECTOR</text><text class="mono tiny" x="406" y="654">use_v2_model_runner</text>
<rect class="blue" x="406" y="670" width="48" height="34" rx="6"/><text class="mono tiny" x="430" y="691" text-anchor="middle" fill="#315f82">V2</text>
<rect class="gold" x="464" y="670" width="48" height="34" rx="6"/><text class="mono tiny" x="488" y="691" text-anchor="middle" fill="#7b6a3e">V1</text>
<path class="line" d="M352 666 H388" marker-end="url(#a)"/>

<rect class="green" x="566" y="626" width="142" height="80" rx="9"/>
<text class="mono sec" x="584" y="650" fill="#255b46">GPU EXECUTION</text><text class="sans label" x="584" y="674">model + attention</text><text class="sans tiny" x="584" y="692">block tables · kernels</text>
<path class="gline" d="M454 704 V744 H548 V666 H566" marker-end="url(#ag)"/><path class="gline" d="M488 704 V732 H538 V682 H566" marker-end="url(#ag)"/>

<rect class="box" x="566" y="746" width="142" height="64" rx="9"/>
<text class="mono sec" x="584" y="769">MODELRUNNEROUTPUT</text><text class="sans tiny" x="584" y="790">sample / model results</text>
<path class="gline" d="M637 706 V746" marker-end="url(#ag)"/>

<path class="pline" d="M659 418 V558 H121 V626" marker-end="url(#ap)"/>
<text class="mono tiny" x="138" y="550" fill="#7d5d6f">SchedulerOutput crosses into execution</text>
<path class="line" d="M708 778 H720 V454 H574" marker-end="url(#a)"/>

<rect class="box" x="34" y="858" width="692" height="34" rx="8"/>
<text class="sans small" x="52" y="879">Naming guard: “vLLM V1 engine” ≠ “V1/V2 GPUModelRunner implementation.” Inspect gpu_worker.py before assuming one runner path.</text>
</svg>
