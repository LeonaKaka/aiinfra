<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 request lifecycle and execution boundary</title>
<desc id="desc">An architecture diagram showing EngineCore and Scheduler on the control plane, KVCacheManager as scheduler-side memory management, SchedulerOutput crossing into the execution plane through ModelExecutor and GPU Worker, GPU Worker selecting V2 or V1 GPUModelRunner, GPU execution producing ModelRunnerOutput, and scheduler update closing the loop.</desc>
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#737a73"/></marker>
  <marker id="ab" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#315f82"/></marker>
  <marker id="ag" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#255b46"/></marker>
  <marker id="ap" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7d5d6f"/></marker>
  <style>
    .bg{fill:#fff}.plane{fill:#fbfbf8;stroke:#c9cec7;stroke-width:1.4}.sub{fill:#fff;stroke:#c9cec7;stroke-width:1.3}.blue{fill:#eef3f7;stroke:#c3d4df;stroke-width:1.3}.green{fill:#eaf1ed;stroke:#bdd2c4;stroke-width:1.3}.purple{fill:#f4eef2;stroke:#d7c7d1;stroke-width:1.3}.gold{fill:#f6f2e8;stroke:#ddcfb4;stroke-width:1.3}.dark{fill:#202622}.line{stroke:#737a73;stroke-width:1.5;fill:none}.lineB{stroke:#315f82;stroke-width:1.55;fill:none}.lineG{stroke:#255b46;stroke-width:1.55;fill:none}.lineP{stroke:#7d5d6f;stroke-width:1.55;fill:none}.dash{stroke:#a7aca6;stroke-width:1.1;stroke-dasharray:5 5;fill:none}
    .title{font:700 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20231f}.subtitle{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666d66}.kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#8b918a}.label{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#4d554f}.strong{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#273029}.small{font:500 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687068}.tiny{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#737b74}.white{fill:#f5f7f3}.white2{fill:#bdc8c0}.blueText{fill:#315f82}.greenText{fill:#255b46}.purpleText{fill:#7d5d6f}.goldText{fill:#7b6a3e}
  </style>
</defs>
<rect class="bg" width="1100" height="900"/>
<text class="kicker" x="56" y="48">vLLM V1 · ONE REQUEST THROUGH ONE ENGINE ITERATION</text>
<text class="title" x="56" y="82">Control plane decides the work; execution plane turns SchedulerOutput into GPU tensors</text>
<text class="subtitle" x="56" y="109">Read the system as a loop: request state → schedule + KV allocation → device execution → model output → scheduler state update.</text>
<rect class="plane" x="56" y="145" rx="15" width="988" height="304"/>
<text class="kicker" x="80" y="174">A · CONTROL PLANE · REQUEST STATE + MEMORY OWNERSHIP + PLAN</text>
<rect class="gold" x="82" y="212" rx="10" width="142" height="74"/>
<text class="label goldText" x="101" y="238">INTERNAL REQUEST</text><text class="small" x="101" y="259">prompt / output state</text><text class="tiny" x="101" y="276">waiting or running</text>
<rect class="blue" x="268" y="204" rx="11" width="176" height="90"/>
<text class="label blueText" x="288" y="230">ENGINECORE</text><text class="strong" x="288" y="253">owns step loop</text><text class="tiny" x="288" y="274">schedule → execute → update</text>
<rect class="blue" x="492" y="204" rx="11" width="190" height="90"/>
<text class="label blueText" x="512" y="230">SCHEDULER</text><text class="strong" x="512" y="253">choose token work</text><text class="tiny" x="512" y="274">waiting / running / budgets</text>
<path class="lineB" marker-end="url(#ab)" d="M224 249 H268"/><path class="lineB" marker-end="url(#ab)" d="M444 249 H492"/>
<rect class="green" x="492" y="332" rx="11" width="190" height="80"/>
<text class="label greenText" x="512" y="358">KVCACHEMANAGER</text><text class="small" x="512" y="380">prefix hit · allocate · free</text><text class="tiny greenText" x="512" y="399">physical block ownership</text>
<path class="lineG" marker-end="url(#ag)" d="M548 294 V332"/><path class="lineG" marker-end="url(#ag)" d="M626 332 V294"/>
<text class="tiny greenText" x="640" y="318">query / allocation result</text>
<rect class="dark" x="734" y="204" rx="11" width="244" height="90"/>
<text class="kicker white2" x="754" y="228">SCHEDULEROUTPUT</text><text class="strong white" x="754" y="251">this iteration's contract</text><text class="tiny white2" x="754" y="271">request IDs · token counts</text><text class="tiny white2" x="754" y="286">KV blocks · execution metadata</text>
<path class="lineB" marker-end="url(#ab)" d="M682 249 H734"/>
<rect class="sub" x="760" y="340" rx="10" width="218" height="60"/>
<text class="label" x="780" y="365">UPDATE_FROM_OUTPUT</text><text class="small" x="780" y="385">advance request state / finish</text>
<path class="lineB" marker-end="url(#ab)" d="M760 370 H706 V305 H642"/>
<text class="tiny blueText" x="694" y="344">state update</text>
<line class="dash" x1="56" y1="482" x2="1044" y2="482"/>
<rect class="gold" x="425" y="466" rx="7" width="250" height="32"/>
<text class="tiny goldText" x="458" y="486">CONTROL / EXECUTION BOUNDARY</text>
<rect class="plane" x="56" y="516" rx="15" width="988" height="302"/>
<text class="kicker" x="80" y="545">B · EXECUTION PLANE · TURN THE PLAN INTO DEVICE WORK</text>
<rect class="purple" x="82" y="584" rx="11" width="172" height="84"/>
<text class="label purpleText" x="102" y="610">MODEL EXECUTOR</text><text class="small" x="102" y="632">execute_model(...)</text><text class="tiny" x="102" y="650">distributed execution facade</text>
<rect class="purple" x="300" y="584" rx="11" width="160" height="84"/>
<text class="label purpleText" x="320" y="610">GPU WORKER</text><text class="small" x="320" y="632">device process</text><text class="tiny" x="320" y="650">owns model_runner</text>
<path class="lineP" marker-end="url(#ap)" d="M254 626 H300"/>
<path class="lineP" marker-end="url(#ap)" d="M856 294 V476 H168 V584"/>
<text class="tiny purpleText" x="183" y="502">SchedulerOutput crosses into execution</text>
<rect class="sub" x="506" y="566" rx="11" width="214" height="120"/>
<text class="label" x="526" y="592">RUNNER SELECTOR</text><text class="tiny" x="526" y="613">vllm_config.use_v2_model_runner</text>
<rect class="blue" x="526" y="628" rx="7" width="78" height="38"/><text class="tiny blueText" x="541" y="651">V2 runner</text>
<rect class="gold" x="622" y="628" rx="7" width="78" height="38"/><text class="tiny goldText" x="637" y="651">V1 runner</text>
<path class="line" marker-end="url(#a)" d="M460 626 H506"/>
<rect class="green" x="766" y="584" rx="11" width="212" height="84"/>
<text class="label greenText" x="786" y="610">GPU EXECUTION</text><text class="strong" x="786" y="632">batch + attention + model</text><text class="tiny greenText" x="786" y="651">tensors / block tables / kernels</text>
<path class="lineG" marker-end="url(#ag)" d="M604 647 H738 V614 H766"/><path class="lineG" marker-end="url(#ag)" d="M700 647 H738 V638 H766"/>
<rect class="sub" x="766" y="714" rx="10" width="212" height="64"/>
<text class="label" x="786" y="739">MODELRUNNEROUTPUT</text><text class="small" x="786" y="760">sample / model results</text>
<path class="lineG" marker-end="url(#ag)" d="M872 668 V714"/>
<path class="line" marker-end="url(#a)" d="M978 746 H1018 V370 H978"/>
<text class="tiny" x="744" y="799">ModelRunnerOutput returns to EngineCore</text><text class="tiny" x="744" y="813">then scheduler.update_from_output(...)</text>
<text class="tiny" x="82" y="854">Stable reading order: EngineCore step loop → Scheduler contract → KVCacheManager allocation → executor/worker boundary → runner selector → actual ModelRunner.</text>
<text class="tiny" x="82" y="877">“vLLM V1 engine” and “V1/V2 GPUModelRunner implementations” are different naming layers; inspect gpu_worker.py before assuming one runner path.</text>
</svg>