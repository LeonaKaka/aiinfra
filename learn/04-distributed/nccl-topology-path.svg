<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc">
  <title id="title">NCCL maps a logical collective onto real GPU topology</title>
  <desc id="desc">A logical PyTorch all-reduce enters an NCCL communicator. NCCL considers the collective, message size, topology and platform, chooses an algorithm and transport, then moves data across intra-node GPU fabric or a GPU-to-NIC network path. The logical collective contract stays the same while the physical cost changes.</desc>
  <defs>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7e857e"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#255b46"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ey{font-size:11px;font-weight:700;letter-spacing:2.1px;fill:#8b938c}.ttl{font-size:27px;font-weight:750;fill:#252923}.sub{font-size:14px;fill:#6c746d}.sec{font-size:11px;font-weight:700;letter-spacing:2px;fill:#8b938c}.cap{font-size:10px;font-weight:700;letter-spacing:.6px}.h{font-size:14px;font-weight:700;fill:#2f342f}.body{font-size:11px;fill:#69716a}.tiny{font-size:9px;fill:#707870}.tinyb{font-size:9px;font-weight:700}.box{fill:#fff;stroke:#cbd1ca;stroke-width:1.4}.green{fill:#eaf2ed;stroke:#bfd5c6;stroke-width:1.4}.blue{fill:#edf4f8;stroke:#c1d6e4;stroke-width:1.4}.sand{fill:#faf5ea;stroke:#e0cfad;stroke-width:1.4}.panel{fill:#fcfcfa;stroke:#cfd4cd;stroke-width:1.5}.dark{fill:#1f2521}.line{fill:none;stroke:#7e857e;stroke-width:1.5}.gline{fill:none;stroke:#255b46;stroke-width:1.7}.bline{fill:none;stroke:#315f82;stroke-width:1.7}.dash{fill:none;stroke:#8e958e;stroke-width:1.3;stroke-dasharray:5 5}
    </style>
  </defs>
  <text class="mono ey" x="56" y="46">NCCL · LOGICAL CONTRACT → PHYSICAL PATH</text>
  <text class="sans ttl" x="56" y="80">The collective name stays the same; topology decides how expensive it is</text>
  <text class="sans sub" x="56" y="108">Think in two layers: what result ranks need, then which links the bytes actually cross.</text>
  <rect class="panel" x="56" y="140" width="988" height="214" rx="16"/>
  <text class="mono sec" x="80" y="170">A · LOGICAL COLLECTIVE CONTRACT</text>
  <rect class="blue" x="82" y="198" width="210" height="112" rx="12"/>
  <text class="mono cap" x="102" y="226" fill="#315f82">PYTORCH / FRAMEWORK</text><text class="sans h" x="102" y="253">all_reduce(tensor, TP group)</text><text class="sans tiny" x="102" y="276">same semantic request on every rank</text><text class="sans tiny" x="102" y="294">result: each participant gets reduced tensor</text>
  <rect class="dark" x="378" y="188" width="344" height="132" rx="14"/>
  <text class="mono cap" x="402" y="216" fill="#b8c1bb">NCCL COMMUNICATOR</text><text class="sans h" x="402" y="244" style="fill:#f3f5f1">map the contract onto this machine</text><text class="sans tiny" x="402" y="270" style="fill:#aeb8b1">collective · message size · rank count · topology · architecture</text>
  <rect x="402" y="286" width="128" height="22" rx="6" fill="#eaf2ed"/><text class="mono tinyb" x="466" y="301" text-anchor="middle" fill="#255b46">Ring / Tree / ...</text><rect x="546" y="286" width="152" height="22" rx="6" fill="#edf4f8"/><text class="mono tinyb" x="622" y="301" text-anchor="middle" fill="#315f82">P2P / SHM / NET / ...</text>
  <rect class="sand" x="808" y="198" width="210" height="112" rx="12"/>
  <text class="mono cap" x="828" y="226" fill="#7b6a3e">ALGORITHM / TRANSPORT</text><text class="sans h" x="828" y="253">chosen execution plan</text><text class="sans tiny" x="828" y="276">not a new mathematical collective</text><text class="sans tiny" x="828" y="294">just a different way to realize it</text>
  <path class="bline" d="M292 254 H378" marker-end="url(#a-blue)"/><path class="line" d="M722 254 H808" marker-end="url(#a-gray)"/>
  <text class="mono sec" x="56" y="400">B · PHYSICAL TOPOLOGY / DATA PATH</text>
  <rect class="panel" x="56" y="424" width="988" height="330" rx="16"/>
  <rect class="green" x="78" y="454" width="382" height="260" rx="14"/>
  <text class="mono cap" x="100" y="481" fill="#255b46">NODE 0 · FAST INTRA-NODE DOMAIN</text>
  <rect class="box" x="100" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="136" y="528" text-anchor="middle" fill="#255b46">GPU0</text><text class="sans tiny" x="136" y="546" text-anchor="middle">rank 0</text><rect class="box" x="186" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="222" y="528" text-anchor="middle" fill="#255b46">GPU1</text><text class="sans tiny" x="222" y="546" text-anchor="middle">rank 1</text><rect class="box" x="272" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="308" y="528" text-anchor="middle" fill="#255b46">GPU2</text><text class="sans tiny" x="308" y="546" text-anchor="middle">rank 2</text><rect class="box" x="358" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="394" y="528" text-anchor="middle" fill="#255b46">GPU3</text><text class="sans tiny" x="394" y="546" text-anchor="middle">rank 3</text>
  <rect x="118" y="584" width="292" height="54" rx="9" fill="#dfece4" stroke="#b7cfbf"/><text class="mono tinyb" x="264" y="606" text-anchor="middle" fill="#255b46">GPU FABRIC · NVLink / NVSwitch / PCIe P2P</text><text class="sans tiny" x="264" y="624" text-anchor="middle">actual path depends on platform topology</text><path class="gline" d="M136 558 V584 M222 558 V584 M308 558 V584 M394 558 V584"/>
  <rect class="box" x="196" y="660" width="136" height="38" rx="8"/><text class="mono tinyb" x="264" y="684" text-anchor="middle" fill="#59605a">NIC 0 / PCIe path</text><path class="line" d="M264 638 V660" marker-end="url(#a-gray)"/>
  <rect class="blue" x="640" y="454" width="382" height="260" rx="14"/>
  <text class="mono cap" x="662" y="481" fill="#315f82">NODE 1 · ANOTHER GPU DOMAIN</text>
  <rect class="box" x="662" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="698" y="528" text-anchor="middle" fill="#315f82">GPU4</text><text class="sans tiny" x="698" y="546" text-anchor="middle">rank 4</text><rect class="box" x="748" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="784" y="528" text-anchor="middle" fill="#315f82">GPU5</text><text class="sans tiny" x="784" y="546" text-anchor="middle">rank 5</text><rect class="box" x="834" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="870" y="528" text-anchor="middle" fill="#315f82">GPU6</text><text class="sans tiny" x="870" y="546" text-anchor="middle">rank 6</text><rect class="box" x="920" y="506" width="72" height="52" rx="8"/><text class="mono tinyb" x="956" y="528" text-anchor="middle" fill="#315f82">GPU7</text><text class="sans tiny" x="956" y="546" text-anchor="middle">rank 7</text>
  <rect x="680" y="584" width="292" height="54" rx="9" fill="#e1edf4" stroke="#bfd3df"/><text class="mono tinyb" x="826" y="606" text-anchor="middle" fill="#315f82">GPU FABRIC · NVLink / NVSwitch / PCIe P2P</text><text class="sans tiny" x="826" y="624" text-anchor="middle">same collective, different local fabric possible</text><path class="bline" d="M698 558 V584 M784 558 V584 M870 558 V584 M956 558 V584"/>
  <rect class="box" x="758" y="660" width="136" height="38" rx="8"/><text class="mono tinyb" x="826" y="684" text-anchor="middle" fill="#59605a">NIC 1 / PCIe path</text><path class="line" d="M826 638 V660" marker-end="url(#a-gray)"/>
  <rect class="sand" x="472" y="594" width="156" height="78" rx="11"/><text class="mono cap" x="550" y="618" text-anchor="middle" fill="#7b6a3e">NETWORK FABRIC</text><text class="sans h" x="550" y="642" text-anchor="middle">IB / RoCE / Ethernet</text><text class="sans tiny" x="550" y="659" text-anchor="middle">switches · congestion · routing</text>
  <path class="bline" d="M332 679 H438 V633 H472" marker-end="url(#a-blue)"/><path class="bline" d="M628 633 H662 V679 H758" marker-end="url(#a-blue)"/>
  <text class="mono tinyb" x="82" y="782" fill="#255b46">FAST CASE</text><text class="sans tiny" x="148" y="782">keep high-frequency TP collectives inside a fast local GPU fabric when possible.</text>
  <text class="mono tinyb" x="82" y="806" fill="#315f82">SCALE-OUT CASE</text><text class="sans tiny" x="178" y="806">cross-node bytes add GPU↔NIC topology + network fabric; GPUDirect RDMA can avoid host staging, not topology cost.</text>
</svg>