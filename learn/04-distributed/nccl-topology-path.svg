<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-labelledby="title desc">
  <title id="title">NCCL maps a logical collective onto real GPU topology</title>
  <desc id="desc">A logical all-reduce enters an NCCL communicator. NCCL maps that collective onto an algorithm and transport, then moves data through intra-node GPU fabrics or cross-node GPU-to-NIC and network paths. The logical collective result stays the same while physical cost changes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7c847d"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#315f82"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ey{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#8a918a}
      .ttl{font-size:24px;font-weight:760;fill:#252a25}
      .sub{font-size:13px;fill:#687069}
      .sec{font-size:10px;font-weight:700;letter-spacing:1.4px;fill:#8b928b}
      .label{font-size:11px;font-weight:760;fill:#353c36}
      .small{font-size:10px;fill:#687069}
      .tiny{font-size:9px;fill:#687069}
      .panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}
      .box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}
      .blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}
      .green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}
      .sand{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}
      .dark{fill:#222824;stroke:#222824}
      .line{fill:none;stroke:#7c847d;stroke-width:1.3}
      .bline{fill:none;stroke:#315f82;stroke-width:1.5}
      .gline{fill:none;stroke:#255b46;stroke-width:1.5}
    </style>
  </defs>

  <text class="mono ey" x="34" y="34">NCCL · LOGICAL CONTRACT → PHYSICAL PATH</text>
  <text class="sans ttl" x="34" y="67">The collective stays the same; topology changes its cost</text>
  <text class="sans sub" x="34" y="91">First ask what result the ranks need. Then ask which links the bytes actually cross.</text>

  <text class="mono sec" x="34" y="126">1 · LOGICAL COLLECTIVE CONTRACT</text>
  <rect class="panel" x="34" y="142" width="692" height="180" rx="14"/>
  <rect class="blue" x="54" y="178" width="176" height="104" rx="11"/>
  <text class="mono sec" x="72" y="202" fill="#315f82">FRAMEWORK</text>
  <text class="sans label" x="72" y="227">all_reduce(tensor, TP group)</text>
  <text class="sans small" x="72" y="249">semantic request is identical</text>
  <text class="sans small" x="72" y="266">on every participant</text>

  <rect class="dark" x="286" y="166" width="188" height="128" rx="12"/>
  <text class="mono sec" x="306" y="192" fill="#b6c0b9">NCCL COMMUNICATOR</text>
  <text class="sans label" x="306" y="218" style="fill:#f1f3ef">map contract to machine</text>
  <text class="sans tiny" x="306" y="240" style="fill:#b6beb8">collective · bytes · ranks</text>
  <text class="sans tiny" x="306" y="257" style="fill:#b6beb8">topology · architecture</text>
  <rect x="306" y="270" width="68" height="18" rx="5" fill="#eaf2ed"/><text class="mono tiny" x="340" y="283" text-anchor="middle" fill="#255b46">Ring/Tree</text>
  <rect x="382" y="270" width="72" height="18" rx="5" fill="#edf4f8"/><text class="mono tiny" x="418" y="283" text-anchor="middle" fill="#315f82">P2P/NET</text>

  <rect class="sand" x="530" y="178" width="176" height="104" rx="11"/>
  <text class="mono sec" x="548" y="202" fill="#7b6a3e">EXECUTION PLAN</text>
  <text class="sans label" x="548" y="227">algorithm + transport</text>
  <text class="sans small" x="548" y="249">different physical path,</text>
  <text class="sans small" x="548" y="266">same mathematical result</text>
  <path class="line" d="M230 230 H286" marker-end="url(#arrow)"/><path class="line" d="M474 230 H530" marker-end="url(#arrow)"/>

  <text class="mono sec" x="34" y="358">2 · PHYSICAL TOPOLOGY / DATA PATH</text>
  <rect class="panel" x="34" y="374" width="692" height="354" rx="14"/>

  <rect class="green" x="52" y="410" width="270" height="252" rx="13"/>
  <text class="mono sec" x="70" y="435" fill="#255b46">NODE 0 · LOCAL GPU DOMAIN</text>
  <g transform="translate(70 454)" class="mono">
    <g><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU0</text><text class="tiny" x="25" y="35" text-anchor="middle">r0</text></g>
    <g transform="translate(58)"><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU1</text><text class="tiny" x="25" y="35" text-anchor="middle">r1</text></g>
    <g transform="translate(116)"><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU2</text><text class="tiny" x="25" y="35" text-anchor="middle">r2</text></g>
    <g transform="translate(174)"><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU3</text><text class="tiny" x="25" y="35" text-anchor="middle">r3</text></g>
  </g>
  <rect x="70" y="524" width="234" height="54" rx="9" fill="#dfece4" stroke="#b7cfbf"/>
  <text class="mono small" x="187" y="546" text-anchor="middle" fill="#255b46">NVLink / NVSwitch / PCIe P2P</text>
  <text class="sans tiny" x="187" y="565" text-anchor="middle">local fabric depends on platform</text>
  <path class="gline" d="M95 498 V524 M153 498 V524 M211 498 V524 M269 498 V524"/>
  <rect class="box" x="126" y="600" width="122" height="38" rx="8"/>
  <text class="mono small" x="187" y="624" text-anchor="middle">NIC 0 / PCIe path</text>
  <path class="line" d="M187 578 V600" marker-end="url(#arrow)"/>

  <rect class="blue" x="438" y="410" width="270" height="252" rx="13"/>
  <text class="mono sec" x="456" y="435" fill="#315f82">NODE 1 · LOCAL GPU DOMAIN</text>
  <g transform="translate(456 454)" class="mono">
    <g><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU4</text><text class="tiny" x="25" y="35" text-anchor="middle">r4</text></g>
    <g transform="translate(58)"><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU5</text><text class="tiny" x="25" y="35" text-anchor="middle">r5</text></g>
    <g transform="translate(116)"><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU6</text><text class="tiny" x="25" y="35" text-anchor="middle">r6</text></g>
    <g transform="translate(174)"><rect class="box" width="50" height="44" rx="7"/><text class="label" x="25" y="20" text-anchor="middle">GPU7</text><text class="tiny" x="25" y="35" text-anchor="middle">r7</text></g>
  </g>
  <rect x="456" y="524" width="234" height="54" rx="9" fill="#e1edf4" stroke="#bfd3df"/>
  <text class="mono small" x="573" y="546" text-anchor="middle" fill="#315f82">NVLink / NVSwitch / PCIe P2P</text>
  <text class="sans tiny" x="573" y="565" text-anchor="middle">local fabric can differ by machine</text>
  <path class="bline" d="M481 498 V524 M539 498 V524 M597 498 V524 M655 498 V524"/>
  <rect class="box" x="512" y="600" width="122" height="38" rx="8"/>
  <text class="mono small" x="573" y="624" text-anchor="middle">NIC 1 / PCIe path</text>
  <path class="line" d="M573 578 V600" marker-end="url(#arrow)"/>

  <rect class="sand" x="326" y="520" width="108" height="82" rx="10"/>
  <text class="mono sec" x="380" y="544" text-anchor="middle" fill="#7b6a3e">NETWORK</text>
  <text class="sans label" x="380" y="565" text-anchor="middle">IB / RoCE</text>
  <text class="sans tiny" x="380" y="583" text-anchor="middle">switches · routing</text>
  <path class="bline" d="M248 619 H290 V561 H326" marker-end="url(#blue-arrow)"/>
  <path class="bline" d="M434 561 H470 V619 H512" marker-end="url(#blue-arrow)"/>

  <text class="mono sec" x="52" y="698" fill="#255b46">FAST LOCAL CASE</text>
  <text class="sans small" x="184" y="698">keep frequent TP traffic inside the fast GPU fabric when possible.</text>
  <text class="mono sec" x="52" y="716" fill="#315f82">SCALE-OUT CASE</text>
  <text class="sans small" x="184" y="716">cross-node traffic adds GPU↔NIC placement and network congestion.</text>

  <rect class="box" x="34" y="756" width="692" height="48" rx="10"/>
  <text class="sans small" x="52" y="777">GPUDirect RDMA can avoid host staging on a supported path; it does not erase PCIe/NIC/network topology cost.</text>
  <text class="sans tiny" x="52" y="794">Logical contract = what result ranks need. Physical path = which links must move the bytes.</text>
</svg>
