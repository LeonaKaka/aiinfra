<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc"><title id="title">Processes, global rank, local rank, device binding, and process groups</title><desc id="desc">A two-node distributed job. A launcher and rendezvous establish an eight-process world. Global ranks 0 through 7 are unique across the job, while local ranks 0 through 3 repeat on each node and bind each process to a local GPU. Process groups are then subsets of global ranks.</desc><defs><marker id="pr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d847c"/></marker><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ey{font-size:11px;font-weight:700;letter-spacing:2.1px;fill:#8b938c}.ttl{font-size:27px;font-weight:750;fill:#252923}.sub{font-size:14px;fill:#6c746d}.sec{font-size:10px;font-weight:700;letter-spacing:1.8px;fill:#8b938c}.cap{font-size:10px;font-weight:700;letter-spacing:.6px}.h{font-size:14px;font-weight:700;fill:#2f342f}.tiny{font-size:9px;fill:#69716a}.tinyb{font-size:9px;font-weight:700}.box{fill:#fff;stroke:#ccd2cb;stroke-width:1.3}.green{fill:#eaf2ed;stroke:#bfd5c6;stroke-width:1.3}.blue{fill:#edf4f8;stroke:#c1d6e4;stroke-width:1.3}.sand{fill:#faf5ea;stroke:#e0cfad;stroke-width:1.3}.panel{fill:#fcfcfa;stroke:#cfd4cd;stroke-width:1.4}.line{fill:none;stroke:#7d847c;stroke-width:1.5}.rankchip{fill:#f3f5f1;stroke:#d3d8d1}.tp{fill:#eaf2ed;stroke:#bfd5c6}.dp{fill:#edf4f8;stroke:#c1d6e4}</style></defs><text class="mono ey" x="56" y="46">PROCESS → IDENTITY → DEVICE → GROUP</text><text class="sans ttl" x="56" y="80">Global rank is unique; local rank repeats inside every node</text><text class="sans sub" x="56" y="108">The common one-process-per-GPU layout is a deployment pattern. Process groups are communication subsets built from global ranks.</text><rect class="panel" x="56" y="142" width="988" height="148" rx="16"/><text class="mono sec" x="80" y="172">A · FORM ONE DISTRIBUTED WORLD</text><rect class="blue" x="86" y="194" width="218" height="70" rx="11"/><text class="mono cap" x="106" y="219" fill="#315f82">LAUNCHER</text><text class="sans h" x="106" y="243">torchrun / cluster launcher</text><text class="sans tiny" x="106" y="258">starts processes on each node</text><rect class="sand" x="440" y="194" width="220" height="70" rx="11"/><text class="mono cap" x="460" y="219" fill="#7b6a3e">RENDEZVOUS / STORE</text><text class="sans h" x="460" y="243">peers discover one another</text><text class="sans tiny" x="460" y="258">membership + init coordination</text><rect class="green" x="796" y="194" width="218" height="70" rx="11"/><text class="mono cap" x="816" y="219" fill="#255b46">DEFAULT WORLD</text><text class="sans h" x="816" y="243">WORLD_SIZE = 8</text><text class="sans tiny" x="816" y="258">global ranks 0…7 are unique</text><path class="line" d="M304 229 H440" marker-end="url(#pr-a)"/><path class="line" d="M660 229 H796" marker-end="url(#pr-a)"/><text class="mono sec" x="56" y="334">B · THE SAME LOCAL RANKS REPEAT ON DIFFERENT NODES</text><rect class="green" x="56" y="356" width="478" height="282" rx="16"/><text class="mono cap" x="80" y="385" fill="#255b46">NODE A</text><text class="sans tiny" x="143" y="385">global ranks 0–3</text><rect class="blue" x="566" y="356" width="478" height="282" rx="16"/><text class="mono cap" x="590" y="385" fill="#315f82">NODE B</text><text class="sans tiny" x="653" y="385">global ranks 4–7</text><g transform="translate(80 412)"><rect class="box" width="96" height="72" rx="9"/><text class="mono tinyb" x="48" y="21" text-anchor="middle" fill="#255b46">PROCESS</text><text class="sans h" x="48" y="43" text-anchor="middle">rank 0</text><text class="mono tiny" x="48" y="61" text-anchor="middle">local 0</text><rect class="box" x="108" width="96" height="72" rx="9"/><text class="mono tinyb" x="156" y="21" text-anchor="middle" fill="#255b46">PROCESS</text><text class="sans h" x="156" y="43" text-anchor="middle">rank 1</text><text class="mono tiny" x="156" y="61" text-anchor="middle">local 1</text><rect class="box" x="216" width="96" height="72" rx="9"/><text class="mono tinyb" x="264" y="21" text-anchor="middle" fill="#255b46">PROCESS</text><text class="sans h" x="264" y="43" text-anchor="middle">rank 2</text><text class="mono tiny" x="264" y="61" text-anchor="middle">local 2</text><rect class="box" x="324" width="96" height="72" rx="9"/><text class="mono tinyb" x="372" y="21" text-anchor="middle" fill="#255b46">PROCESS</text><text class="sans h" x="372" y="43" text-anchor="middle">rank 3</text><text class="mono tiny" x="372" y="61" text-anchor="middle">local 3</text></g><g transform="translate(80 532)"><rect class="box" width="96" height="58" rx="9"/><text class="mono tinyb" x="48" y="23" text-anchor="middle">GPU 0</text><text class="sans tiny" x="48" y="42" text-anchor="middle">cuda:0</text><rect class="box" x="108" width="96" height="58" rx="9"/><text class="mono tinyb" x="156" y="23" text-anchor="middle">GPU 1</text><text class="sans tiny" x="156" y="42" text-anchor="middle">cuda:1</text><rect class="box" x="216" width="96" height="58" rx="9"/><text class="mono tinyb" x="264" y="23" text-anchor="middle">GPU 2</text><text class="sans tiny" x="264" y="42" text-anchor="middle">cuda:2</text><rect class="box" x="324" width="96" height="58" rx="9"/><text class="mono tinyb" x="372" y="23" text-anchor="middle">GPU 3</text><text class="sans tiny" x="372" y="42" text-anchor="middle">cuda:3</text></g><path class="line" d="M128 484 V532 M236 484 V532 M344 484 V532 M452 484 V532" marker-end="url(#pr-a)"/><g transform="translate(590 412)"><rect class="box" width="96" height="72" rx="9"/><text class="mono tinyb" x="48" y="21" text-anchor="middle" fill="#315f82">PROCESS</text><text class="sans h" x="48" y="43" text-anchor="middle">rank 4</text><text class="mono tiny" x="48" y="61" text-anchor="middle">local 0</text><rect class="box" x="108" width="96" height="72" rx="9"/><text class="mono tinyb" x="156" y="21" text-anchor="middle" fill="#315f82">PROCESS</text><text class="sans h" x="156" y="43" text-anchor="middle">rank 5</text><text class="mono tiny" x="156" y="61" text-anchor="middle">local 1</text><rect class="box" x="216" width="96" height="72" rx="9"/><text class="mono tinyb" x="264" y="21" text-anchor="middle" fill="#315f82">PROCESS</text><text class="sans h" x="264" y="43" text-anchor="middle">rank 6</text><text class="mono tiny" x="264" y="61" text-anchor="middle">local 2</text><rect class="box" x="324" width="96" height="72" rx="9"/><text class="mono tinyb" x="372" y="21" text-anchor="middle" fill="#315f82">PROCESS</text><text class="sans h" x="372" y="43" text-anchor="middle">rank 7</text><text class="mono tiny" x="372" y="61" text-anchor="middle">local 3</text></g><g transform="translate(590 532)"><rect class="box" width="96" height="58" rx="9"/><text class="mono tinyb" x="48" y="23" text-anchor="middle">GPU 0</text><text class="sans tiny" x="48" y="42" text-anchor="middle">cuda:0</text><rect class="box" x="108" width="96" height="58" rx="9"/><text class="mono tinyb" x="156" y="23" text-anchor="middle">GPU 1</text><text class="sans tiny" x="156" y="42" text-anchor="middle">cuda:1</text><rect class="box" x="216" width="96" height="58" rx="9"/><text class="mono tinyb" x="264" y="23" text-anchor="middle">GPU 2</text><text class="sans tiny" x="264" y="42" text-anchor="middle">cuda:2</text><rect class="box" x="324" width="96" height="58" rx="9"/><text class="mono tinyb" x="372" y="23" text-anchor="middle">GPU 3</text><text class="sans tiny" x="372" y="42" text-anchor="middle">cuda:3</text></g><path class="line" d="M638 484 V532 M746 484 V532 M854 484 V532 M962 484 V532" marker-end="url(#pr-a)"/><text class="sans tinyb" x="80" y="616" fill="#255b46">local rank chooses a device inside this node</text><text class="sans tinyb" x="590" y="616" fill="#315f82">local 0…3 repeat; global ranks do not</text><text class="mono sec" x="56" y="690">C · PROCESS GROUPS ARE SUBSETS OF GLOBAL RANKS</text><rect class="panel" x="56" y="712" width="988" height="146" rx="16"/><text class="mono tinyb" x="80" y="744" fill="#59605a">GLOBAL</text><g transform="translate(176 726)"><rect class="rankchip" width="58" height="34" rx="7"/><text class="mono tinyb" x="29" y="22" text-anchor="middle">0</text><rect class="rankchip" x="64" width="58" height="34" rx="7"/><text class="mono tinyb" x="93" y="22" text-anchor="middle">1</text><rect class="rankchip" x="128" width="58" height="34" rx="7"/><text class="mono tinyb" x="157" y="22" text-anchor="middle">2</text><rect class="rankchip" x="192" width="58" height="34" rx="7"/><text class="mono tinyb" x="221" y="22" text-anchor="middle">3</text><rect class="rankchip" x="256" width="58" height="34" rx="7"/><text class="mono tinyb" x="285" y="22" text-anchor="middle">4</text><rect class="rankchip" x="320" width="58" height="34" rx="7"/><text class="mono tinyb" x="349" y="22" text-anchor="middle">5</text><rect class="rankchip" x="384" width="58" height="34" rx="7"/><text class="mono tinyb" x="413" y="22" text-anchor="middle">6</text><rect class="rankchip" x="448" width="58" height="34" rx="7"/><text class="mono tinyb" x="477" y="22" text-anchor="middle">7</text></g><text class="mono tinyb" x="80" y="794" fill="#255b46">TP EXAMPLE</text><g transform="translate(176 776)"><rect class="tp" width="58" height="34" rx="7"/><text class="mono tinyb" x="29" y="22" text-anchor="middle">0</text><rect class="tp" x="64" width="58" height="34" rx="7"/><text class="mono tinyb" x="93" y="22" text-anchor="middle">1</text><text class="sans tiny" x="142" y="22">another TP group can be [2,3], [4,5], [6,7]</text></g><text class="mono tinyb" x="620" y="794" fill="#315f82">DP EXAMPLE</text><g transform="translate(714 776)"><rect class="dp" width="58" height="34" rx="7"/><text class="mono tinyb" x="29" y="22" text-anchor="middle">0</text><rect class="dp" x="64" width="58" height="34" rx="7"/><text class="mono tinyb" x="93" y="22" text-anchor="middle">2</text><rect class="dp" x="128" width="58" height="34" rx="7"/><text class="mono tinyb" x="157" y="22" text-anchor="middle">4</text><rect class="dp" x="192" width="58" height="34" rx="7"/><text class="mono tinyb" x="221" y="22" text-anchor="middle">6</text></g><text class="sans tiny" x="56" y="886">The subgroup examples are illustrative only. Megatron's real rank layout depends on parallel sizes and rank ordering.</text></svg>