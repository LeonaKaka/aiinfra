<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 940" role="img" aria-labelledby="title desc"><title id="title">Four core distributed collective state transformations</title><desc id="desc">A comparison of broadcast, all-reduce, all-gather, and reduce-scatter. Each row shows what ranks hold before the operation, the group-level transformation, and what each rank holds after the operation.</desc><defs><marker id="cg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7d847c"/></marker><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ey{font-size:11px;font-weight:700;letter-spacing:2.1px;fill:#8b938c}.ttl{font-size:27px;font-weight:750;fill:#252923}.sub{font-size:14px;fill:#6c746d}.sec{font-size:10px;font-weight:700;letter-spacing:1.8px;fill:#8b938c}.op{font-size:13px;font-weight:750}.tiny{font-size:9px;fill:#69716a}.tinyb{font-size:9px;font-weight:700}.box{fill:#fff;stroke:#ccd2cb;stroke-width:1.3}.green{fill:#eaf2ed;stroke:#bfd5c6;stroke-width:1.3}.blue{fill:#edf4f8;stroke:#c1d6e4;stroke-width:1.3}.sand{fill:#faf5ea;stroke:#e0cfad;stroke-width:1.3}.plum{fill:#f5eef3;stroke:#dcc8d4;stroke-width:1.3}.panel{fill:#fcfcfa;stroke:#cfd4cd;stroke-width:1.4}.line{fill:none;stroke:#7d847c;stroke-width:1.4}.divider{stroke:#e1e4de}.rank{font-size:8px;font-weight:700;fill:#7a817a}.val{font-size:11px;font-weight:700;fill:#303530}</style></defs><text class="mono ey" x="56" y="46">COLLECTIVES · BEFORE → CONTRACT → AFTER</text><text class="sans ttl" x="56" y="80">Stop memorizing names; read each collective as a state transformation</text><text class="sans sub" x="56" y="108">Fix one process group. Ask what every rank owns before the call, then what every rank must own after it.</text><text class="mono sec" x="72" y="154">BEFORE · R0 / R1 / R2 / R3</text><text class="mono sec" x="452" y="154">GROUP-LEVEL CONTRACT</text><text class="mono sec" x="756" y="154">AFTER · R0 / R1 / R2 / R3</text><rect class="panel" x="56" y="174" width="988" height="690" rx="16"/><text class="mono tinyb" x="80" y="210" fill="#315f82">01 · BROADCAST</text><text class="sans tiny" x="174" y="210">one source owns A</text><rect class="blue" x="80" y="230" width="72" height="54" rx="8"/><text class="mono rank" x="116" y="249" text-anchor="middle">R0</text><text class="mono val" x="116" y="270" text-anchor="middle">A</text><rect class="box" x="164" y="230" width="72" height="54" rx="8"/><text class="mono rank" x="200" y="249" text-anchor="middle">R1</text><text class="mono val" x="200" y="270" text-anchor="middle">?</text><rect class="box" x="248" y="230" width="72" height="54" rx="8"/><text class="mono rank" x="284" y="249" text-anchor="middle">R2</text><text class="mono val" x="284" y="270" text-anchor="middle">?</text><rect class="box" x="332" y="230" width="72" height="54" rx="8"/><text class="mono rank" x="368" y="249" text-anchor="middle">R3</text><text class="mono val" x="368" y="270" text-anchor="middle">?</text><rect class="blue" x="448" y="222" width="210" height="70" rx="10"/><text class="sans op" x="553" y="248" text-anchor="middle" fill="#315f82">copy source to group</text><text class="sans tiny" x="553" y="270" text-anchor="middle">no reduction · one-to-many</text><path class="line" d="M404 257 H448" marker-end="url(#cg)"/><path class="line" d="M658 257 H710" marker-end="url(#cg)"/><g transform="translate(724 230)"><rect class="blue" width="72" height="54" rx="8"/><text class="mono rank" x="36" y="19" text-anchor="middle">R0</text><text class="mono val" x="36" y="40" text-anchor="middle">A</text><rect class="blue" x="84" width="72" height="54" rx="8"/><text class="mono rank" x="120" y="19" text-anchor="middle">R1</text><text class="mono val" x="120" y="40" text-anchor="middle">A</text><rect class="blue" x="168" width="72" height="54" rx="8"/><text class="mono rank" x="204" y="19" text-anchor="middle">R2</text><text class="mono val" x="204" y="40" text-anchor="middle">A</text><rect class="blue" x="252" width="72" height="54" rx="8"/><text class="mono rank" x="288" y="19" text-anchor="middle">R3</text><text class="mono val" x="288" y="40" text-anchor="middle">A</text></g><line class="divider" x1="80" y1="318" x2="1020" y2="318"/><text class="mono tinyb" x="80" y="354" fill="#255b46">02 · ALL-REDUCE (SUM)</text><text class="sans tiny" x="222" y="354">different local contributions</text><g transform="translate(80 374)"><rect class="green" width="72" height="54" rx="8"/><text class="mono rank" x="36" y="19" text-anchor="middle">R0</text><text class="mono val" x="36" y="40" text-anchor="middle">1</text><rect class="green" x="84" width="72" height="54" rx="8"/><text class="mono rank" x="120" y="19" text-anchor="middle">R1</text><text class="mono val" x="120" y="40" text-anchor="middle">2</text><rect class="green" x="168" width="72" height="54" rx="8"/><text class="mono rank" x="204" y="19" text-anchor="middle">R2</text><text class="mono val" x="204" y="40" text-anchor="middle">3</text><rect class="green" x="252" width="72" height="54" rx="8"/><text class="mono rank" x="288" y="19" text-anchor="middle">R3</text><text class="mono val" x="288" y="40" text-anchor="middle">4</text></g><rect class="green" x="448" y="366" width="210" height="70" rx="10"/><text class="sans op" x="553" y="392" text-anchor="middle" fill="#255b46">reduce SUM, then replicate</text><text class="sans tiny" x="553" y="414" text-anchor="middle">everyone gets the full reduced result</text><path class="line" d="M404 401 H448" marker-end="url(#cg)"/><path class="line" d="M658 401 H710" marker-end="url(#cg)"/><g transform="translate(724 374)"><rect class="green" width="72" height="54" rx="8"/><text class="mono rank" x="36" y="19" text-anchor="middle">R0</text><text class="mono val" x="36" y="40" text-anchor="middle">10</text><rect class="green" x="84" width="72" height="54" rx="8"/><text class="mono rank" x="120" y="19" text-anchor="middle">R1</text><text class="mono val" x="120" y="40" text-anchor="middle">10</text><rect class="green" x="168" width="72" height="54" rx="8"/><text class="mono rank" x="204" y="19" text-anchor="middle">R2</text><text class="mono val" x="204" y="40" text-anchor="middle">10</text><rect class="green" x="252" width="72" height="54" rx="8"/><text class="mono rank" x="288" y="19" text-anchor="middle">R3</text><text class="mono val" x="288" y="40" text-anchor="middle">10</text></g><line class="divider" x1="80" y1="462" x2="1020" y2="462"/><text class="mono tinyb" x="80" y="498" fill="#7b6a3e">03 · ALL-GATHER</text><text class="sans tiny" x="190" y="498">each rank owns one shard</text><g transform="translate(80 518)"><rect class="sand" width="72" height="54" rx="8"/><text class="mono rank" x="36" y="19" text-anchor="middle">R0</text><text class="mono val" x="36" y="40" text-anchor="middle">A</text><rect class="sand" x="84" width="72" height="54" rx="8"/><text class="mono rank" x="120" y="19" text-anchor="middle">R1</text><text class="mono val" x="120" y="40" text-anchor="middle">B</text><rect class="sand" x="168" width="72" height="54" rx="8"/><text class="mono rank" x="204" y="19" text-anchor="middle">R2</text><text class="mono val" x="204" y="40" text-anchor="middle">C</text><rect class="sand" x="252" width="72" height="54" rx="8"/><text class="mono rank" x="288" y="19" text-anchor="middle">R3</text><text class="mono val" x="288" y="40" text-anchor="middle">D</text></g><rect class="sand" x="448" y="510" width="210" height="70" rx="10"/><text class="sans op" x="553" y="536" text-anchor="middle" fill="#7b6a3e">concatenate shards</text><text class="sans tiny" x="553" y="558" text-anchor="middle">no reduction · replicate full tensor</text><path class="line" d="M404 545 H448" marker-end="url(#cg)"/><path class="line" d="M658 545 H710" marker-end="url(#cg)"/><g transform="translate(724 514)"><rect class="sand" width="72" height="62" rx="8"/><text class="mono rank" x="36" y="18" text-anchor="middle">R0</text><text class="mono tinyb" x="36" y="41" text-anchor="middle">A B C D</text><rect class="sand" x="84" width="72" height="62" rx="8"/><text class="mono rank" x="120" y="18" text-anchor="middle">R1</text><text class="mono tinyb" x="120" y="41" text-anchor="middle">A B C D</text><rect class="sand" x="168" width="72" height="62" rx="8"/><text class="mono rank" x="204" y="18" text-anchor="middle">R2</text><text class="mono tinyb" x="204" y="41" text-anchor="middle">A B C D</text><rect class="sand" x="252" width="72" height="62" rx="8"/><text class="mono rank" x="288" y="18" text-anchor="middle">R3</text><text class="mono tinyb" x="288" y="41" text-anchor="middle">A B C D</text></g><line class="divider" x1="80" y1="606" x2="1020" y2="606"/><text class="mono tinyb" x="80" y="642" fill="#7d5d6f">04 · REDUCE-SCATTER (SUM)</text><text class="sans tiny" x="260" y="642">reduce first, keep only one result shard per rank</text><g transform="translate(80 662)"><rect class="plum" width="72" height="66" rx="8"/><text class="mono rank" x="36" y="18" text-anchor="middle">R0</text><text class="mono tinyb" x="36" y="39" text-anchor="middle">1 2 3 4</text><rect class="plum" x="84" width="72" height="66" rx="8"/><text class="mono rank" x="120" y="18" text-anchor="middle">R1</text><text class="mono tinyb" x="120" y="39" text-anchor="middle">10 20</text><text class="mono tinyb" x="120" y="53" text-anchor="middle">30 40</text><rect class="plum" x="168" width="72" height="66" rx="8"/><text class="mono rank" x="204" y="18" text-anchor="middle">R2</text><text class="mono tinyb" x="204" y="39" text-anchor="middle">100 200</text><text class="mono tinyb" x="204" y="53" text-anchor="middle">300 400</text><rect class="plum" x="252" width="72" height="66" rx="8"/><text class="mono rank" x="288" y="18" text-anchor="middle">R3</text><text class="mono tinyb" x="288" y="39" text-anchor="middle">1000 2000</text><text class="mono tinyb" x="288" y="53" text-anchor="middle">3000 4000</text></g><rect class="plum" x="448" y="658" width="210" height="74" rx="10"/><text class="sans op" x="553" y="684" text-anchor="middle" fill="#7d5d6f">SUM = [1111,2222,3333,4444]</text><text class="sans tiny" x="553" y="706" text-anchor="middle">then scatter one reduced shard to each rank</text><path class="line" d="M404 695 H448" marker-end="url(#cg)"/><path class="line" d="M658 695 H710" marker-end="url(#cg)"/><g transform="translate(724 668)"><rect class="plum" width="72" height="54" rx="8"/><text class="mono rank" x="36" y="18" text-anchor="middle">R0</text><text class="mono tinyb" x="36" y="39" text-anchor="middle">1111</text><rect class="plum" x="84" width="72" height="54" rx="8"/><text class="mono rank" x="120" y="18" text-anchor="middle">R1</text><text class="mono tinyb" x="120" y="39" text-anchor="middle">2222</text><rect class="plum" x="168" width="72" height="54" rx="8"/><text class="mono rank" x="204" y="18" text-anchor="middle">R2</text><text class="mono tinyb" x="204" y="39" text-anchor="middle">3333</text><rect class="plum" x="252" width="72" height="54" rx="8"/><text class="mono rank" x="288" y="18" text-anchor="middle">R3</text><text class="mono tinyb" x="288" y="39" text-anchor="middle">4444</text></g><rect x="80" y="772" width="940" height="64" rx="10" fill="#f3f5f1" stroke="#d7dbd4"/><text class="mono tinyb" x="102" y="797" fill="#59605a">DECISION RULE</text><text class="sans h" x="102" y="816">Need the full reduced result everywhere? all-reduce. Need only reduced shards? reduce-scatter.</text><text class="sans tiny" x="102" y="832">Need no reduction, only every shard collected on every rank? all-gather.</text><text class="sans tiny" x="56" y="895">All-to-All is the next distinct pattern: destination-dependent reshuffle rather than one shared result.</text><text class="sans tiny" x="56" y="914">Point-to-point send/recv is not a collective: it names explicit sender/receiver peers.</text></svg>