<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" role="img" aria-labelledby="title desc">
  <title id="title">Four core collective state transformations</title>
  <desc id="desc">Broadcast, all-reduce, all-gather, and reduce-scatter shown as before, contract, and after state transformations for one four-rank process group.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7c847d"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ey{font-size:11px;font-weight:700;letter-spacing:1.8px;fill:#8a918a}
      .ttl{font-size:24px;font-weight:760;fill:#252a25}
      .sub{font-size:13px;fill:#687069}
      .head{font-size:10px;font-weight:700;letter-spacing:1.4px;fill:#8b928b}
      .op{font-size:12px;font-weight:760;fill:#333a34}
      .small{font-size:10px;fill:#687069}
      .tiny{font-size:9px;fill:#687069}
      .rank{font-size:9px;font-weight:700;fill:#727a73}
      .val{font-size:12px;font-weight:760;fill:#2e352f}
      .panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}
      .box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}
      .blue{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}
      .green{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}
      .sand{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}
      .plum{fill:#f5eef3;stroke:#dac7d2;stroke-width:1.1}
      .line{fill:none;stroke:#7c847d;stroke-width:1.3}
      .divider{stroke:#e3e6e0;stroke-width:1}
    </style>
  </defs>

  <text class="mono ey" x="34" y="34">COLLECTIVES · BEFORE → CONTRACT → AFTER</text>
  <text class="sans ttl" x="34" y="67">Read each collective as a state transformation</text>
  <text class="sans sub" x="34" y="91">Fix one process group. Ask what every rank owns before the call, then what every rank must own after it.</text>

  <text class="mono head" x="42" y="128">BEFORE · R0 / R1 / R2 / R3</text>
  <text class="mono head" x="308" y="128">GROUP CONTRACT</text>
  <text class="mono head" x="510" y="128">AFTER · R0 / R1 / R2 / R3</text>
  <rect class="panel" x="34" y="144" width="692" height="700" rx="14"/>

  <text class="mono op" x="52" y="176" fill="#315f82">01 · BROADCAST</text>
  <text class="sans small" x="177" y="176">one source owns A</text>
  <g transform="translate(52 194)">
    <g><rect class="blue" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R0</text><text class="mono val" x="26" y="36" text-anchor="middle">A</text></g>
    <g transform="translate(58)"><rect class="box" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R1</text><text class="mono val" x="26" y="36" text-anchor="middle">?</text></g>
    <g transform="translate(116)"><rect class="box" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R2</text><text class="mono val" x="26" y="36" text-anchor="middle">?</text></g>
    <g transform="translate(174)"><rect class="box" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R3</text><text class="mono val" x="26" y="36" text-anchor="middle">?</text></g>
  </g>
  <rect class="blue" x="300" y="190" width="166" height="56" rx="9"/>
  <text class="sans op" x="383" y="214" text-anchor="middle" fill="#315f82">copy source to group</text>
  <text class="sans tiny" x="383" y="232" text-anchor="middle">no reduction · one-to-many</text>
  <path class="line" d="M278 218 H300" marker-end="url(#arrow)"/><path class="line" d="M466 218 H488" marker-end="url(#arrow)"/>
  <g transform="translate(500 194)">
    <g><rect class="blue" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R0</text><text class="mono val" x="26" y="36" text-anchor="middle">A</text></g>
    <g transform="translate(58)"><rect class="blue" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R1</text><text class="mono val" x="26" y="36" text-anchor="middle">A</text></g>
    <g transform="translate(116)"><rect class="blue" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R2</text><text class="mono val" x="26" y="36" text-anchor="middle">A</text></g>
    <g transform="translate(174)"><rect class="blue" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R3</text><text class="mono val" x="26" y="36" text-anchor="middle">A</text></g>
  </g>
  <line class="divider" x1="52" y1="274" x2="708" y2="274"/>

  <text class="mono op" x="52" y="306" fill="#255b46">02 · ALL-REDUCE (SUM)</text>
  <text class="sans small" x="218" y="306">local contributions</text>
  <g transform="translate(52 324)">
    <g><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R0</text><text class="mono val" x="26" y="36" text-anchor="middle">1</text></g>
    <g transform="translate(58)"><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R1</text><text class="mono val" x="26" y="36" text-anchor="middle">2</text></g>
    <g transform="translate(116)"><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R2</text><text class="mono val" x="26" y="36" text-anchor="middle">3</text></g>
    <g transform="translate(174)"><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R3</text><text class="mono val" x="26" y="36" text-anchor="middle">4</text></g>
  </g>
  <rect class="green" x="300" y="320" width="166" height="56" rx="9"/>
  <text class="sans op" x="383" y="344" text-anchor="middle" fill="#255b46">SUM, then replicate</text>
  <text class="sans tiny" x="383" y="362" text-anchor="middle">everyone gets the full result</text>
  <path class="line" d="M278 348 H300" marker-end="url(#arrow)"/><path class="line" d="M466 348 H488" marker-end="url(#arrow)"/>
  <g transform="translate(500 324)">
    <g><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R0</text><text class="mono val" x="26" y="36" text-anchor="middle">10</text></g>
    <g transform="translate(58)"><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R1</text><text class="mono val" x="26" y="36" text-anchor="middle">10</text></g>
    <g transform="translate(116)"><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R2</text><text class="mono val" x="26" y="36" text-anchor="middle">10</text></g>
    <g transform="translate(174)"><rect class="green" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R3</text><text class="mono val" x="26" y="36" text-anchor="middle">10</text></g>
  </g>
  <line class="divider" x1="52" y1="404" x2="708" y2="404"/>

  <text class="mono op" x="52" y="436" fill="#7b6a3e">03 · ALL-GATHER</text>
  <text class="sans small" x="184" y="436">one shard per rank</text>
  <g transform="translate(52 454)">
    <g><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R0</text><text class="mono val" x="26" y="36" text-anchor="middle">A</text></g>
    <g transform="translate(58)"><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R1</text><text class="mono val" x="26" y="36" text-anchor="middle">B</text></g>
    <g transform="translate(116)"><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R2</text><text class="mono val" x="26" y="36" text-anchor="middle">C</text></g>
    <g transform="translate(174)"><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="17" text-anchor="middle">R3</text><text class="mono val" x="26" y="36" text-anchor="middle">D</text></g>
  </g>
  <rect class="sand" x="300" y="450" width="166" height="56" rx="9"/>
  <text class="sans op" x="383" y="474" text-anchor="middle" fill="#7b6a3e">concatenate shards</text>
  <text class="sans tiny" x="383" y="492" text-anchor="middle">no reduction · full tensor replicated</text>
  <path class="line" d="M278 478 H300" marker-end="url(#arrow)"/><path class="line" d="M466 478 H488" marker-end="url(#arrow)"/>
  <g transform="translate(500 454)">
    <g><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R0</text><text class="mono tiny" x="26" y="35" text-anchor="middle">ABCD</text></g>
    <g transform="translate(58)"><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R1</text><text class="mono tiny" x="26" y="35" text-anchor="middle">ABCD</text></g>
    <g transform="translate(116)"><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R2</text><text class="mono tiny" x="26" y="35" text-anchor="middle">ABCD</text></g>
    <g transform="translate(174)"><rect class="sand" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R3</text><text class="mono tiny" x="26" y="35" text-anchor="middle">ABCD</text></g>
  </g>
  <line class="divider" x1="52" y1="534" x2="708" y2="534"/>

  <text class="mono op" x="52" y="566" fill="#7d5d6f">04 · REDUCE-SCATTER (SUM)</text>
  <text class="sans small" x="250" y="566">reduce, then keep one result shard per rank</text>
  <g transform="translate(52 584)">
    <g><rect class="plum" width="52" height="70" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R0</text><text class="mono tiny" x="26" y="35" text-anchor="middle">1 2</text><text class="mono tiny" x="26" y="50" text-anchor="middle">3 4</text></g>
    <g transform="translate(58)"><rect class="plum" width="52" height="70" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R1</text><text class="mono tiny" x="26" y="35" text-anchor="middle">10 20</text><text class="mono tiny" x="26" y="50" text-anchor="middle">30 40</text></g>
    <g transform="translate(116)"><rect class="plum" width="52" height="70" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R2</text><text class="mono tiny" x="26" y="35" text-anchor="middle">100 200</text><text class="mono tiny" x="26" y="50" text-anchor="middle">300 400</text></g>
    <g transform="translate(174)"><rect class="plum" width="52" height="70" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R3</text><text class="mono tiny" x="26" y="35" text-anchor="middle">1000 2000</text><text class="mono tiny" x="26" y="50" text-anchor="middle">3000 4000</text></g>
  </g>
  <rect class="plum" x="300" y="584" width="166" height="70" rx="9"/>
  <text class="sans op" x="383" y="607" text-anchor="middle" fill="#7d5d6f">SUM full vector</text>
  <text class="mono tiny" x="383" y="627" text-anchor="middle">[1111,2222,3333,4444]</text>
  <text class="sans tiny" x="383" y="644" text-anchor="middle">then scatter one shard</text>
  <path class="line" d="M278 619 H300" marker-end="url(#arrow)"/><path class="line" d="M466 619 H488" marker-end="url(#arrow)"/>
  <g transform="translate(500 595)">
    <g><rect class="plum" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R0</text><text class="mono tiny" x="26" y="35" text-anchor="middle">1111</text></g>
    <g transform="translate(58)"><rect class="plum" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R1</text><text class="mono tiny" x="26" y="35" text-anchor="middle">2222</text></g>
    <g transform="translate(116)"><rect class="plum" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R2</text><text class="mono tiny" x="26" y="35" text-anchor="middle">3333</text></g>
    <g transform="translate(174)"><rect class="plum" width="52" height="48" rx="7"/><text class="mono rank" x="26" y="16" text-anchor="middle">R3</text><text class="mono tiny" x="26" y="35" text-anchor="middle">4444</text></g>
  </g>

  <rect class="box" x="52" y="686" width="656" height="124" rx="10"/>
  <text class="mono head" x="70" y="712">THE DISTINCTION TO REMEMBER</text>
  <text class="sans small" x="70" y="738">All-reduce: reduce + replicate → every rank gets the full reduced result.</text>
  <text class="sans small" x="70" y="762">Reduce-scatter: reduce + shard → every rank keeps only its assigned part of that result.</text>
  <text class="sans small" x="70" y="786">All-gather: shard → replicate, but without a mathematical reduction.</text>
  <text class="sans tiny" x="34" y="868">The concrete values are teaching examples; real collectives operate on tensors and a specific process group.</text>
</svg>
