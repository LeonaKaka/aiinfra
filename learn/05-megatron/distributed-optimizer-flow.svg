<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
<title id="title">Distributed Optimizer data and ownership flow</title>
<desc id="desc">Four data-parallel ranks start with full local gradient buffers from different data. Reduce-scatter produces one reduced gradient shard per rank. Each rank updates its own FP32 main parameter and Adam state shard. Parameter all-gather then reconstructs synchronized forward-visible model parameters on every data-parallel rank.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#737a73"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.k{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#858d86}.title{font-size:22px;font-weight:750;fill:#252923}.sub{font-size:12px;fill:#687068}.label{font-size:12px;font-weight:700;fill:#2d332e}.body{font-size:11px;fill:#697069}.tiny{font-size:10px;fill:#737a73}.panel{fill:#fbfbf8;stroke:#c9cec7;stroke-width:1.4}.card{fill:#fff;stroke:#cbd1ca;stroke-width:1.25}.green{fill:#eaf2ed;stroke:#bfd5c6;stroke-width:1.3}.blue{fill:#edf4f8;stroke:#c1d6e4;stroke-width:1.3}.plum{fill:#f5eef3;stroke:#dcc8d4;stroke-width:1.3}.sand{fill:#faf5ea;stroke:#e0cfad;stroke-width:1.3}.collective{fill:#202622}.line{fill:none;stroke:#737a73;stroke-width:1.5}.dash{fill:none;stroke:#9ba19b;stroke-width:1.2;stroke-dasharray:5 5}
 </style>
</defs>
<rect width="760" height="850" fill="#fff"/>
<text class="mono k" x="28" y="34">DISTRIBUTED OPTIMIZER · DP=4 · ONE PARAMETER BUFFER</text>
<text class="sans title" x="28" y="66">Optimizer state stays sharded;</text><text class="sans title" x="28" y="91">forward-visible model params are synchronized</text>
<text class="sans sub" x="28" y="116">The memory saving comes from persistent optimizer/main-param ownership,</text><text class="sans sub" x="28" y="133">not from letting DP ranks use different model weights.</text>
<text class="mono k" x="28" y="168">1 · EACH DP RANK FINISHES BACKWARD WITH A FULL LOCAL GRADIENT BUFFER</text>
<g transform="translate(28 186)">
 <rect class="green" width="164" height="82" rx="11"/><text class="mono tiny" x="14" y="22" fill="#255b46">DP RANK 0</text><text class="sans label" x="14" y="45">local grad buffer</text><text class="mono tiny" x="14" y="65">g⁽⁰⁾[0…15]</text>
 <rect class="blue" x="180" width="164" height="82" rx="11"/><text class="mono tiny" x="194" y="22" fill="#315f82">DP RANK 1</text><text class="sans label" x="194" y="45">local grad buffer</text><text class="mono tiny" x="194" y="65">g⁽¹⁾[0…15]</text>
 <rect class="plum" x="360" width="164" height="82" rx="11"/><text class="mono tiny" x="374" y="22" fill="#7d5d6f">DP RANK 2</text><text class="sans label" x="374" y="45">local grad buffer</text><text class="mono tiny" x="374" y="65">g⁽²⁾[0…15]</text>
 <rect class="sand" x="540" width="164" height="82" rx="11"/><text class="mono tiny" x="554" y="22" fill="#7b6a3e">DP RANK 3</text><text class="sans label" x="554" y="45">local grad buffer</text><text class="mono tiny" x="554" y="65">g⁽³⁾[0…15]</text>
</g>
<text class="sans tiny" x="28" y="286">Same parameter layout, different local data → different local gradient values.</text>
<path class="line" d="M110 268 V306 H380" marker-end="url(#a)"/><path class="line" d="M290 268 V306 H380" marker-end="url(#a)"/><path class="line" d="M470 268 V306 H380" marker-end="url(#a)"/><path class="line" d="M650 268 V306 H380" marker-end="url(#a)"/>
<rect class="collective" x="252" y="306" width="256" height="62" rx="11"/>
<text class="mono k" x="380" y="330" text-anchor="middle" fill="#c3cec6">REDUCE-SCATTER ACROSS DP</text><text class="sans tiny" x="380" y="352" text-anchor="middle" style="fill:#dbe3dc">SUM/average logically, then keep one reduced shard per rank</text>
<text class="mono k" x="28" y="410">2 · REDUCED GRADIENT OWNERSHIP MATCHES PERSISTENT OPTIMIZER OWNERSHIP</text>
<g transform="translate(28 428)">
 <rect class="green" width="164" height="154" rx="11"/><text class="mono tiny" x="14" y="22" fill="#255b46">RANK 0 · SHARD 0</text><text class="sans label" x="14" y="46">reduced grad [0:4]</text><line x1="14" y1="60" x2="150" y2="60" stroke="#c9d7cc"/><text class="sans body" x="14" y="83">FP32 main param shard</text><text class="sans body" x="14" y="104">Adam m / v shard</text><rect class="card" x="14" y="118" width="136" height="24" rx="6"/><text class="mono tiny" x="82" y="134" text-anchor="middle">local Adam update</text>
 <rect class="blue" x="180" width="164" height="154" rx="11"/><text class="mono tiny" x="194" y="22" fill="#315f82">RANK 1 · SHARD 1</text><text class="sans label" x="194" y="46">reduced grad [4:8]</text><line x1="194" y1="60" x2="330" y2="60" stroke="#cbd9e1"/><text class="sans body" x="194" y="83">FP32 main param shard</text><text class="sans body" x="194" y="104">Adam m / v shard</text><rect class="card" x="194" y="118" width="136" height="24" rx="6"/><text class="mono tiny" x="262" y="134" text-anchor="middle">local Adam update</text>
 <rect class="plum" x="360" width="164" height="154" rx="11"/><text class="mono tiny" x="374" y="22" fill="#7d5d6f">RANK 2 · SHARD 2</text><text class="sans label" x="374" y="46">reduced grad [8:12]</text><line x1="374" y1="60" x2="510" y2="60" stroke="#dcced6"/><text class="sans body" x="374" y="83">FP32 main param shard</text><text class="sans body" x="374" y="104">Adam m / v shard</text><rect class="card" x="374" y="118" width="136" height="24" rx="6"/><text class="mono tiny" x="442" y="134" text-anchor="middle">local Adam update</text>
 <rect class="sand" x="540" width="164" height="154" rx="11"/><text class="mono tiny" x="554" y="22" fill="#7b6a3e">RANK 3 · SHARD 3</text><text class="sans label" x="554" y="46">reduced grad [12:16]</text><line x1="554" y1="60" x2="690" y2="60" stroke="#e1d6bd"/><text class="sans body" x="554" y="83">FP32 main param shard</text><text class="sans body" x="554" y="104">Adam m / v shard</text><rect class="card" x="554" y="118" width="136" height="24" rx="6"/><text class="mono tiny" x="622" y="134" text-anchor="middle">local Adam update</text>
</g>
<path class="line" d="M380 368 V392 H110 V428" marker-end="url(#a)"/><path class="line" d="M380 392 H290 V428" marker-end="url(#a)"/><path class="line" d="M380 392 H470 V428" marker-end="url(#a)"/><path class="line" d="M380 392 H650 V428" marker-end="url(#a)"/>
<text class="sans tiny" x="28" y="611">Long-lived memory win: each rank persists only its optimizer/main-param shard for this DP buffer.</text>
<path class="line" d="M110 582 V640 H380" marker-end="url(#a)"/><path class="line" d="M290 582 V640 H380" marker-end="url(#a)"/><path class="line" d="M470 582 V640 H380" marker-end="url(#a)"/><path class="line" d="M650 582 V640 H380" marker-end="url(#a)"/>
<rect class="collective" x="252" y="640" width="256" height="62" rx="11"/>
<text class="mono k" x="380" y="664" text-anchor="middle" fill="#c3cec6">PARAMETER ALL-GATHER</text><text class="sans tiny" x="380" y="686" text-anchor="middle" style="fill:#dbe3dc">reconstruct the updated compute/model parameter buffer</text>
<text class="mono k" x="28" y="740">3 · NEXT FORWARD SEES MATHEMATICALLY SYNCHRONIZED MODEL PARAMS</text>
<g transform="translate(28 758)">
 <rect class="green" width="164" height="58" rx="10"/><text class="sans label" x="82" y="25" text-anchor="middle">rank 0 model params</text><text class="mono tiny" x="82" y="44" text-anchor="middle">all updated shards</text>
 <rect class="blue" x="180" width="164" height="58" rx="10"/><text class="sans label" x="262" y="25" text-anchor="middle">rank 1 model params</text><text class="mono tiny" x="262" y="44" text-anchor="middle">all updated shards</text>
 <rect class="plum" x="360" width="164" height="58" rx="10"/><text class="sans label" x="442" y="25" text-anchor="middle">rank 2 model params</text><text class="mono tiny" x="442" y="44" text-anchor="middle">all updated shards</text>
 <rect class="sand" x="540" width="164" height="58" rx="10"/><text class="sans label" x="622" y="25" text-anchor="middle">rank 3 model params</text><text class="mono tiny" x="622" y="44" text-anchor="middle">all updated shards</text>
</g>
<path class="line" d="M380 702 V726 H110 V758" marker-end="url(#a)"/><path class="line" d="M380 726 H290 V758" marker-end="url(#a)"/><path class="line" d="M380 726 H470 V758" marker-end="url(#a)"/><path class="line" d="M380 726 H650 V758" marker-end="url(#a)"/>
<text class="sans tiny" x="28" y="840">Do not conflate the two lifetimes: optimizer/master state can stay sharded while forward-visible DP model parameters remain synchronized.</text>
</svg>