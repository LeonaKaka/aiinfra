<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
<title id="title">Communication overlap critical path</title>
<desc id="desc">A dependency-first timeline showing gradient reduction and parameter all-gather overlap. Ready events launch communication asynchronously, independent compute continues, and only unfinished communication at the first data dependency becomes exposed wait time.</desc>
<defs>
 <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#747b74"/></marker>
 <style>
 .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 .ey{font-size:11px;font-weight:700;letter-spacing:1.55px;fill:#8a918a}.ttl{font-size:24px;font-weight:760;fill:#252a25}.subt{font-size:13px;fill:#687069}.sec{font-size:10px;font-weight:700;letter-spacing:1.3px;fill:#8b928b}.label{font-size:11px;font-weight:760;fill:#343c35}.small{font-size:10px;fill:#687069}.tiny{font-size:9px;fill:#687069}.panel{fill:#fcfcfa;stroke:#ccd2cb;stroke-width:1.2}.box{fill:#fff;stroke:#cdd3cc;stroke-width:1.1}.compute{fill:#edf4f8;stroke:#bfd3e0;stroke-width:1.1}.comm{fill:#eaf2ed;stroke:#bfd4c5;stroke-width:1.1}.ready{fill:#faf5ea;stroke:#dfceac;stroke-width:1.1}.wait{fill:#f7eee8;stroke:#dfc5b3;stroke-width:1.1}.dark{fill:#222824}.line{fill:none;stroke:#747b74;stroke-width:1.2}.dash{stroke:#a4aaa4;stroke-dasharray:5 5;stroke-width:1}.divider{stroke:#e2e5df;stroke-width:1}
 </style>
</defs>
<text class="mono ey" x="34" y="34">COMMUNICATION OVERLAP · DEPENDENCY-FIRST MENTAL MODEL</text>
<text class="sans ttl" x="34" y="67">READY → async launch → independent compute → WAIT</text>
<text class="sans ttl" x="34" y="94">only when the data is actually needed</text>
<text class="sans subt" x="34" y="119">Overlap can hide communication from the critical path; it does not erase the collective or its resource cost.</text>

<text class="mono sec" x="34" y="154">1 · BACKWARD + GRADIENT REDUCE</text>
<rect class="panel" x="34" y="170" width="692" height="326" rx="14"/>
<text class="sans small" x="52" y="196">A bucket can launch async reduction once every gradient inside that bucket is ready.</text>
<text class="sans tiny" x="52" y="214">MCore: start_grad_sync() may dispatch async AR/RS; finish_grad_sync() waits only when completion becomes required.</text>

<text class="mono sec" x="52" y="250">TIME</text>
<g class="mono tiny"><text x="144" y="250">t0</text><text x="228" y="250">t1</text><text x="312" y="250">t2</text><text x="396" y="250">t3</text><text x="480" y="250">t4</text><text x="564" y="250">t5</text><text x="648" y="250">t6</text></g>
<line class="dash" x1="126" y1="260" x2="696" y2="260"/>

<text class="mono sec" x="52" y="292">BACKWARD</text>
<g class="mono tiny">
 <rect class="compute" x="126" y="274" width="80" height="30" rx="5"/><text x="166" y="293" text-anchor="middle">BWD L6</text>
 <rect class="compute" x="210" y="274" width="80" height="30" rx="5"/><text x="250" y="293" text-anchor="middle">BWD L5</text>
 <rect class="compute" x="294" y="274" width="80" height="30" rx="5"/><text x="334" y="293" text-anchor="middle">BWD L4</text>
 <rect class="compute" x="378" y="274" width="80" height="30" rx="5"/><text x="418" y="293" text-anchor="middle">BWD L3</text>
 <rect class="compute" x="462" y="274" width="80" height="30" rx="5"/><text x="502" y="293" text-anchor="middle">BWD L2</text>
 <rect class="compute" x="546" y="274" width="80" height="30" rx="5"/><text x="586" y="293" text-anchor="middle">BWD L1</text>
 <rect class="box" x="630" y="274" width="66" height="30" rx="5"/><text x="663" y="293" text-anchor="middle">finalize</text>
</g>

<text class="mono sec" x="52" y="334">READY</text>
<circle class="ready" cx="250" cy="330" r="7"/><text class="mono tiny" x="262" y="333">B2</text>
<circle class="ready" cx="418" cy="330" r="7"/><text class="mono tiny" x="430" y="333">B1</text>
<circle class="ready" cx="586" cy="330" r="7"/><text class="mono tiny" x="598" y="333">B0</text>

<text class="mono sec" x="52" y="378">COMM</text>
<rect class="comm" x="250" y="358" width="154" height="34" rx="6"/><text class="mono tiny" x="327" y="379" text-anchor="middle">async RS / AR · B2</text>
<rect class="comm" x="418" y="358" width="154" height="34" rx="6"/><text class="mono tiny" x="495" y="379" text-anchor="middle">async RS / AR · B1</text>
<rect class="comm" x="586" y="358" width="82" height="34" rx="6"/><text class="mono tiny" x="627" y="379" text-anchor="middle">RS/AR B0</text>
<rect class="wait" x="668" y="358" width="28" height="34" rx="5"/><text class="mono tiny" x="682" y="379" text-anchor="middle">TAIL</text>
<path class="line" d="M250 337 V354" marker-end="url(#a)"/><path class="line" d="M418 337 V354" marker-end="url(#a)"/><path class="line" d="M586 337 V354" marker-end="url(#a)"/>

<rect class="box" x="126" y="420" width="570" height="52" rx="8"/>
<text class="sans small" x="144" y="441">Most B2/B1 communication overlaps later backward compute.</text>
<text class="sans small" x="144" y="460">Only the unfinished tail at the first required wait stays on the exposed critical path.</text>

<text class="mono sec" x="34" y="534">2 · PARAMETER ALL-GATHER PREFETCH</text>
<rect class="panel" x="34" y="550" width="692" height="260" rx="14"/>
<text class="sans small" x="52" y="576">The current parameter bucket must be ready before its layers run; the next bucket can be prefetched during current compute.</text>
<text class="sans tiny" x="52" y="594">MCore bucket-group path: finish_param_sync() completes current AG and can advance the next-bucket prefetch.</text>

<text class="mono sec" x="52" y="628">PARAM AG</text>
<g class="mono tiny">
 <rect class="comm" x="126" y="610" width="110" height="32" rx="5"/><text x="181" y="630" text-anchor="middle">AG bucket 0</text>
 <rect class="wait" x="236" y="610" width="24" height="32" rx="4"/><text x="248" y="630" text-anchor="middle">W</text>
 <rect class="comm" x="260" y="610" width="150" height="32" rx="5"/><text x="335" y="630" text-anchor="middle">prefetch AG bucket 1</text>
 <rect class="wait" x="410" y="610" width="24" height="32" rx="4"/><text x="422" y="630" text-anchor="middle">W</text>
 <rect class="comm" x="434" y="610" width="150" height="32" rx="5"/><text x="509" y="630" text-anchor="middle">prefetch AG bucket 2</text>
 <rect class="wait" x="584" y="610" width="24" height="32" rx="4"/><text x="596" y="630" text-anchor="middle">W</text>
 <rect class="comm" x="608" y="610" width="88" height="32" rx="5"/><text x="652" y="630" text-anchor="middle">next AG</text>
</g>

<text class="mono sec" x="52" y="682">FORWARD</text>
<g class="mono tiny">
 <rect class="box" x="126" y="660" width="134" height="34" rx="5"/><text x="193" y="681" text-anchor="middle">need bucket 0</text>
 <rect class="compute" x="260" y="660" width="174" height="34" rx="5"/><text x="347" y="681" text-anchor="middle">compute layers in B0</text>
 <rect class="compute" x="434" y="660" width="174" height="34" rx="5"/><text x="521" y="681" text-anchor="middle">compute layers in B1</text>
 <rect class="compute" x="608" y="660" width="88" height="34" rx="5"/><text x="652" y="681" text-anchor="middle">B2 compute</text>
</g>
<path class="line" d="M248 642 V656" marker-end="url(#a)"/><path class="line" d="M422 642 V656" marker-end="url(#a)"/><path class="line" d="M596 642 V656" marker-end="url(#a)"/>

<rect class="box" x="126" y="722" width="570" height="60" rx="8"/>
<text class="sans small" x="144" y="744">Prefetch AG for bucket k+1 can run while layers using bucket k compute.</text>
<text class="sans small" x="144" y="765">The wait marker is the dependency boundary: if AG is unfinished there, only that remainder becomes exposed.</text>

<rect class="dark" x="34" y="838" width="692" height="70" rx="10"/>
<text class="mono sec" x="52" y="860" fill="#b8c2bb">THE GENERAL METHOD</text>
<text class="sans small" x="52" y="880" style="fill:#eef2ed">Ask: what becomes READY, what launches ASYNC, what independent work exists, and where is the first unavoidable WAIT?</text>
<text class="sans tiny" x="52" y="898" style="fill:#b8c2bb">Visual overlap is not proof of speedup; concurrent kernels can contend. Verify with a real GPU/network timeline.</text>
</svg>
