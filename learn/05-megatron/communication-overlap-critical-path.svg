<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="title desc">
<title id="title">Communication overlap critical path</title>
<desc id="desc">A dependency-first timeline showing asynchronous gradient reduction and parameter all-gather. Ready events launch communication, independent compute continues, and waits expose only the unfinished communication tail.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6e756e"/></marker>
  <style>
    .bg{fill:#fff}.panel{fill:#fbfbf8;stroke:#c9cec7;stroke-width:1.4}.dark{fill:#202622}.compute{fill:#eef3f7;stroke:#c6d6e0;stroke-width:1.2}.comm{fill:#eaf1ed;stroke:#bdd2c4;stroke-width:1.2}.wait{fill:#f7eee8;stroke:#dfc5b3;stroke-width:1.2}.ready{fill:#f7f3e8;stroke:#ddcfb5;stroke-width:1.2}.muted{fill:#f4f5f1;stroke:#d8dbd5;stroke-width:1.2}.line{stroke:#707770;stroke-width:1.4;fill:none}.dash{stroke:#a7aca6;stroke-width:1.1;stroke-dasharray:5 5}.title{font:700 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20231f}.subtitle{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666d66}.kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#8b918a}.lane{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#687068}.label{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344139}.small{font:500 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#687068}.tiny{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#737b74}.strong{font:700 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#273029}.white{fill:#f4f7f3}.white2{fill:#b8c3bb}
  </style>
</defs>
<rect class="bg" width="1120" height="930"/>
<text class="kicker" x="58" y="48">COMMUNICATION OVERLAP · DEPENDENCY-FIRST MENTAL MODEL</text>
<text class="title" x="58" y="82">READY → async launch → independent compute → WAIT only when data is needed</text>
<text class="subtitle" x="58" y="109">Overlap hides communication from the critical path; it does not erase the collective or its resource cost.</text>

<rect class="panel" x="58" y="145" rx="14" width="1004" height="330"/>
<text class="kicker" x="82" y="174">A · BACKWARD + GRADIENT REDUCE</text>
<text class="strong" x="82" y="200">A bucket launches as soon as all gradients inside it are ready.</text>
<text class="small" x="82" y="222">Current MCore: overlap_grad_reduce → start_grad_sync() can dispatch async AR/RS; finish_grad_sync() waits later.</text>
<g transform="translate(82,252)">
  <text class="lane" x="0" y="24">TIME</text><text class="tiny" x="126" y="24">t0</text><text class="tiny" x="245" y="24">t1</text><text class="tiny" x="364" y="24">t2</text><text class="tiny" x="483" y="24">t3</text><text class="tiny" x="602" y="24">t4</text><text class="tiny" x="721" y="24">t5</text><text class="tiny" x="840" y="24">t6</text>
  <line class="dash" x1="102" y1="34" x2="934" y2="34"/>
  <text class="lane" x="0" y="72">BACKWARD</text>
  <rect class="compute" x="104" y="51" rx="6" width="116" height="36"/><text class="label" x="139" y="74">BWD L6</text><rect class="compute" x="223" y="51" rx="6" width="116" height="36"/><text class="label" x="258" y="74">BWD L5</text><rect class="compute" x="342" y="51" rx="6" width="116" height="36"/><text class="label" x="377" y="74">BWD L4</text><rect class="compute" x="461" y="51" rx="6" width="116" height="36"/><text class="label" x="496" y="74">BWD L3</text><rect class="compute" x="580" y="51" rx="6" width="116" height="36"/><text class="label" x="615" y="74">BWD L2</text><rect class="compute" x="699" y="51" rx="6" width="116" height="36"/><text class="label" x="734" y="74">BWD L1</text><rect class="muted" x="818" y="51" rx="6" width="116" height="36"/><text class="tiny" x="849" y="74">finalize</text>
  <text class="lane" x="0" y="122">READY</text><circle class="ready" cx="281" cy="116" r="9"/><text class="tiny" x="295" y="120">bucket B2 ready</text><circle class="ready" cx="519" cy="116" r="9"/><text class="tiny" x="533" y="120">bucket B1 ready</text><circle class="ready" cx="757" cy="116" r="9"/><text class="tiny" x="771" y="120">bucket B0 ready</text>
  <text class="lane" x="0" y="173">COMM</text><rect class="comm" x="281" y="151" rx="6" width="210" height="38"/><text class="label" x="324" y="175">async RS / AR · B2</text><rect class="comm" x="519" y="151" rx="6" width="210" height="38"/><text class="label" x="562" y="175">async RS / AR · B1</text><rect class="comm" x="757" y="151" rx="6" width="150" height="38"/><text class="label" x="785" y="175">RS / AR · B0</text><rect class="wait" x="907" y="151" rx="6" width="27" height="38"/><text class="tiny" transform="translate(926 181) rotate(-90)">TAIL</text>
  <path class="line" marker-end="url(#arrow)" d="M281 126 V146"/><path class="line" marker-end="url(#arrow)" d="M519 126 V146"/><path class="line" marker-end="url(#arrow)" d="M757 126 V146"/>
  <text class="tiny" x="288" y="211">hidden under later backward compute</text><line class="line" x1="286" y1="217" x2="815" y2="217"/><text class="tiny" x="829" y="211">exposed wait</text><line class="line" x1="829" y1="217" x2="934" y2="217"/>
</g>

<rect class="panel" x="58" y="500" rx="14" width="1004" height="286"/>
<text class="kicker" x="82" y="529">B · PARAMETER ALL-GATHER PREFETCH</text>
<text class="strong" x="82" y="555">Forward pre-hook waits for the current bucket, then can dispatch the next bucket before compute.</text>
<text class="small" x="82" y="577">Current DDP bucket-group path: finish_param_sync() can finish current AG and advance next-bucket prefetch.</text>
<g transform="translate(82,606)">
  <text class="lane" x="0" y="25">TIME</text><text class="tiny" x="127" y="25">t0</text><text class="tiny" x="246" y="25">t1</text><text class="tiny" x="365" y="25">t2</text><text class="tiny" x="484" y="25">t3</text><text class="tiny" x="603" y="25">t4</text><text class="tiny" x="722" y="25">t5</text><text class="tiny" x="841" y="25">t6</text><line class="dash" x1="102" y1="35" x2="934" y2="35"/>
  <text class="lane" x="0" y="76">PARAM AG</text><rect class="comm" x="104" y="54" rx="6" width="150" height="38"/><text class="label" x="137" y="78">AG bucket 0</text><rect class="wait" x="254" y="54" rx="6" width="26" height="38"/><text class="tiny" transform="translate(273 84) rotate(-90)">WAIT</text><rect class="comm" x="280" y="54" rx="6" width="210" height="38"/><text class="label" x="326" y="78">prefetch AG bucket 1</text><rect class="wait" x="490" y="54" rx="6" width="26" height="38"/><text class="tiny" transform="translate(509 84) rotate(-90)">WAIT</text><rect class="comm" x="516" y="54" rx="6" width="210" height="38"/><text class="label" x="562" y="78">prefetch AG bucket 2</text><rect class="wait" x="726" y="54" rx="6" width="26" height="38"/><text class="tiny" transform="translate(745 84) rotate(-90)">WAIT</text><rect class="comm" x="752" y="54" rx="6" width="182" height="38"/><text class="label" x="793" y="78">prefetch next</text>
  <text class="lane" x="0" y="129">FORWARD</text><rect class="muted" x="104" y="107" rx="6" width="176" height="38"/><text class="tiny" x="139" y="131">need bucket 0</text><rect class="compute" x="280" y="107" rx="6" width="236" height="38"/><text class="label" x="340" y="131">compute layers in B0</text><rect class="compute" x="516" y="107" rx="6" width="236" height="38"/><text class="label" x="576" y="131">compute layers in B1</text><rect class="compute" x="752" y="107" rx="6" width="182" height="38"/><text class="label" x="788" y="131">compute B2</text>
  <path class="line" marker-end="url(#arrow)" d="M267 98 V104"/><path class="line" marker-end="url(#arrow)" d="M503 98 V104"/><path class="line" marker-end="url(#arrow)" d="M739 98 V104"/><text class="tiny" x="292" y="171">AG for the next bucket runs while current bucket's layers compute</text>
</g>

<rect class="dark" x="58" y="811" rx="13" width="1004" height="81"/><text class="kicker white2" x="82" y="836">ONE METHOD, MANY PARALLELISMS</text><text class="strong white" x="82" y="861">DP bucket reduce / param prefetch · TP AG/RS pipelining · PP P2P scheduling · EP A2A batch-level overlap</text><text class="tiny white2" x="82" y="880">Always ask: what becomes READY, what launches ASYNC, what independent work exists, and where is the first unavoidable WAIT?</text>
<text class="tiny" x="58" y="916">A wide overlap region is useful only if concurrent kernels do not slow each other enough to erase the gain; verify with a GPU timeline.</text>
</svg>