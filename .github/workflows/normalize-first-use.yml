name: Normalize First-Use Terminology

on:
  push:
    branches: [main]
    paths:
      - 'scripts/first_use_terms.py'
      - 'scripts/audit_first_use_terms.py'
      - '.github/workflows/normalize-first-use.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize first-use explanations
        run: python scripts/audit_first_use_terms.py --write
      - name: Refresh lesson term tables
        run: python scripts/lesson_terms.py --write
      - name: Commit normalized pages
        run: |
          if git diff --quiet -- learn labs; then
            echo "No page changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learn labs
          git commit -m "Normalize first-use terminology explanations"
          git push origin HEAD:main
