name: Normalize First-Use Terminology

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize first-use explanations
        run: python scripts/audit_first_use_terms.py --write
      - name: Refresh lesson term tables
        run: python scripts/lesson_terms.py --write
      - name: Show diff only
        run: git diff -- learn labs
