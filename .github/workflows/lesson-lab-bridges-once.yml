name: Add Lesson Lab Bridges Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lesson-lab-bridges-once.yml'

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add course-to-lab bridges
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mapping = {
              'learn/05-megatron/why-model-parallel.html': [
                  ('A3', 'DP + Gradient Accumulation', 'mini-dp-grad-accum.html', '先看复制式 DP 的本地梯度与同步，再把它和模型分片问题区分开。'),
                  ('A6', 'TP × DP 2D Topology', 'mini-tp-dp-2d.html', '亲手构造 TP×DP process groups，验证同一个 rank 为什么同时属于多条并行轴。'),
              ],
              'learn/05-megatron/tensor-parallel.html': [
                  ('A1', 'Mini Megatron TP', 'mini-megatron.html', '把 Column → Row 的 forward shard、local GEMM 与最终 reduction 跑一遍。'),
                  ('A2', 'Mini TP Backward', 'mini-tp-backward.html', '继续追 dW、dX，确认 backward 的通信边界为什么和 forward 不完全相同。'),
              ],
              'learn/05-megatron/sequence-parallel.html': [
                  ('A8', 'Mini Sequence Parallel', 'mini-sequence-parallel.html', '让 Row-parallel partial output 直接 reduce-scatter 成 sequence shard，并和 dense reference 对齐。'),
              ],
              'learn/05-megatron/pipeline-parallel.html': [
                  ('A9', 'Mini Pipeline Parallel', 'mini-pipeline-parallel.html', '跑通 stage boundary 的 activation send 与 backward dActivation 回传。'),
              ],
              'learn/05-megatron/distributed-optimizer.html': [
                  ('A4', 'Mini Distributed Optimizer', 'mini-distributed-optimizer.html', '验证 reduce-scatter → local optimizer shard update → parameter all-gather 的 ownership 转移。'),
              ],
              'learn/05-megatron/context-parallel.html': [
                  ('A10', 'Mini Context Parallel', 'mini-context-parallel.html', '让 Q shard 留在本地、KV chunks 轮转，并和 dense causal attention 对齐。'),
              ],
              'learn/05-megatron/expert-parallel.html': [
                  ('A11', 'Mini Expert Parallel', 'mini-expert-parallel.html', '跑通 router → dispatch → local experts → reverse combine，并检查 token identity。'),
              ],
              'learn/05-megatron/communication-overlap.html': [
                  ('A5', 'Bucketed Async Reduce-Scatter', 'mini-bucketed-reduce-scatter.html', '先制造 gradient-ready → async launch → later wait 的真实依赖窗口。'),
                  ('A7', 'Profiler-ready Overlap', 'mini-profiler-overlap.html', '再用 profiler 标记关键事件；CPU 只验顺序，GPU/NCCL 才能证明真实 overlap。'),
                  ('A12', 'Mini Training System', 'mini-training-system.html', '最后把 TP×DP、bucket readiness、sharded optimizer 与 parameter gather 串成一个 training step。'),
              ],
              'learn/08-kv-connector/why-move-kv.html': [
                  ('B1', 'Mini KV Handoff', 'mini-kv-handoff.html', '先验证“远端 KV 能否等价接管模型状态”。'),
                  ('B2', 'Mini Block KV Handoff', 'mini-block-kv-handoff.html', '再加入 logical→physical block table，避免把 KV handoff 只理解成连续 tensor copy。'),
              ],
              'learn/08-kv-connector/connector-architecture.html': [
                  ('B5', 'KV Handshake + Lifetime', 'mini-kv-handshake-lifetime.html', '把 compatibility descriptor、accept、transfer、completion 跑成一条最小控制面。'),
              ],
              'learn/08-kv-connector/transfer-lifecycle.html': [
                  ('B3', 'Mini Async KV Transfer', 'mini-async-kv-transfer.html', '练习 launch → independent work → wait 的 request-level 异步依赖。'),
                  ('B4', 'Layer-wise KV Streaming', 'mini-layerwise-kv-stream.html', '把 readiness 细化到 layer：进入 layer L 前只等待 KV[L]。'),
              ],
              'learn/08-kv-connector/nixl-rdma.html': [
                  ('B6', 'Registered Region Descriptor', 'mini-registered-region-descriptor.html', '用共享 storage + region/stride descriptor 建立 memory registration 前的地址几何。'),
              ],
              'learn/08-kv-connector/production-pd.html': [
                  ('B7', 'KV Lease / Expiry', 'mini-kv-lease-expiry.html', '用 heartbeat、completion、expiry 同时防止提前释放和永久泄漏。'),
                  ('B8', 'Mini Inference Engine', 'mini-inference-engine.html', '把 local hit、remote KV、cold prefill、scheduler budget 与 completion lifetime 合成一个最小 serving loop。'),
              ],
          }

          bridge_re = re.compile(r'\n\s*<section class="article-section lesson-lab-bridge".*?</section>\s*', re.S)
          terms_marker = '<section class="lesson-terms" id="lesson-terms">'

          for path_s, labs in mapping.items():
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              text = bridge_re.sub('\n', text)
              if terms_marker not in text:
                  raise SystemExit(f'missing lesson terms marker: {path_s}')
              cards = []
              for code, title, href, note in labs:
                  cards.append(
                      f'<div class="concept-note"><p><strong>Lab {code} · {title}</strong><br />{note} '
                      f'<a href="../../labs/{href}">打开实验 →</a></p></div>'
                  )
              bridge = (
                  '<section class="article-section lesson-lab-bridge" id="hands-on">'
                  '<div class="section-no">HANDS-ON · 对应实验</div>'
                  '<h2>现在把这节课的数据流亲手跑一遍。</h2>'
                  '<p>先用小规模 reference 验证 correctness 与依赖关系；性能结论仍以真实 GPU / NCCL / NIXL 环境为准。</p>'
                  + ''.join(cards) +
                  '</section>\n\n      '
              )
              text = text.replace(terms_marker, bridge + terms_marker, 1)
              path.write_text(text, encoding='utf-8')

          print(f'Added hands-on bridges to {len(mapping)} lessons.')
          PY
          python scripts/lesson_terms.py --write
      - name: Verify site after bridge insertion
        run: |
          python scripts/check_site.py
          python scripts/normalize_site_navigation.py
          python scripts/normalize_navigation.py
          python scripts/lesson_terms.py
          python scripts/audit_lesson_acronyms.py
          python scripts/check_glossary_terms.py
          python scripts/audit_term_density.py
          python scripts/check_diagrams.py
          git diff --check
      - name: Commit lesson bridges and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/lesson-lab-bridges-once.yml
          git add -A
          git commit -m 'Connect core lessons to runnable labs'
          git push
