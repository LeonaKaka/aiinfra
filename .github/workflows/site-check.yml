name: Site Quality Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check static site
        run: python scripts/check_site.py
      - name: Check canonical site navigation
        run: python scripts/normalize_site_navigation.py
      - name: Check static navigation
        run: python scripts/normalize_navigation.py
      - name: Check lesson terminology
        run: python scripts/lesson_terms.py
      - name: Audit unregistered acronym candidates
        run: python scripts/audit_lesson_acronyms.py
      - name: Check curated global glossary
        run: python scripts/check_glossary_terms.py
      - name: Audit term density and placement
        run: python scripts/audit_term_density.py
      - name: Check core diagrams
        run: python scripts/check_diagrams.py
