name: Apply Content Foundation Review

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply content review
        run: python scripts/apply_content_foundation_review.py
      - name: Regenerate lesson terminology
        run: python scripts/lesson_terms.py --write
      - name: Verify terminology is stable
        run: python scripts/lesson_terms.py
      - name: Audit unregistered acronyms
        run: python scripts/audit_lesson_acronyms.py
      - name: Audit term density
        run: python scripts/audit_term_density.py
      - name: Check global glossary
        run: python scripts/check_glossary_terms.py
      - name: Check site
        run: python scripts/check_site.py
      - name: Check static navigation
        run: python scripts/normalize_navigation.py
      - name: Check core diagrams
        run: python scripts/check_diagrams.py
      - name: Commit reviewed content
        run: |
          if git diff --quiet; then
            echo "No content changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learn/01-foundations/tensor.html learn/02-transformer/transformer-block.html learn/05-megatron/why-model-parallel.html
          git commit -m "Strengthen memory and position foundations"
          git push origin HEAD:main
