name: Apply Site Navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-site-navigation.yml'
      - 'scripts/normalize_site_navigation.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize full-site navigation
        run: python scripts/normalize_site_navigation.py --write
      - name: Verify canonical navigation is stable
        run: python scripts/normalize_site_navigation.py
      - name: Verify all local links and fragments
        run: python scripts/check_site.py
      - name: Check diff
        run: git diff --check
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No navigation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Unify site and Lab navigation'
          git push

# one-time migration trigger
