name: Lab Correctness Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'labs/**'
      - 'scripts/run_lab_smoke.py'
      - '.github/workflows/lab-smoke.yml'

permissions:
  contents: read

jobs:
  cpu-gloo-smoke:
    # All 18 runnable reference labs are correctness checks; CPU timings are not performance claims.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and NumPy
        run: |
          python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade numpy
      - name: Run all 18 CPU/Gloo labs
        run: python scripts/run_lab_smoke.py
