name: Lab Correctness Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'labs/**'
      - 'scripts/run_lab_smoke.py'
      - '.github/workflows/lab-smoke.yml'

permissions:
  contents: read

jobs:
  cpu-gloo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run all 14 CPU/Gloo labs
        run: python scripts/run_lab_smoke.py
