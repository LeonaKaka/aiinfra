name: Apply Content Maintenance

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_2026_09_01_term_semantics.py
      - scripts/finalize_2026_09_01_term_audit.py
      - .github/workflows/apply-content-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply maintenance
        run: python scripts/apply_2026_09_01_term_semantics.py

      - name: Finalize acronym audit
        run: python scripts/finalize_2026_09_01_term_audit.py

      - name: Regenerate lesson terminology
        run: python scripts/lesson_terms.py --write

      - name: Enforce reverse acronym audit
        run: python scripts/audit_lesson_acronyms.py

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated content
        run: |
          git config user.name "leona"
          git config user.email "124779759+LeonaKaka@users.noreply.github.com"
          git add README.md scripts/lesson_terms.py scripts/audit_lesson_acronyms.py learn/
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Harden acronym audit and improve term placement"
          git push origin HEAD:main
