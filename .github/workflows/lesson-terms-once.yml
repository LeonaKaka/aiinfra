name: One-time lesson terminology migration

on:
  push:
    paths:
      - '.github/workflows/lesson-terms-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize every lesson terminology table and first use
        run: python scripts/lesson_terms.py --write
      - name: Add shared lesson terminology styles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lesson.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* LESSON TERMS · per-lesson acronym table */'
          if marker not in text:
              text += r'''

/* LESSON TERMS · per-lesson acronym table */
.lesson-terms{margin:64px 0 0;padding-top:34px;border-top:1px solid var(--line-dark)}
.lesson-terms h2{margin-bottom:10px}.lesson-terms-intro{max-width:690px;margin-top:0!important;color:#656962!important;font-size:13px!important}
.lesson-terms-scroll{overflow-x:auto;margin-top:22px;border:1px solid var(--line);border-radius:14px;background:#fff}
.lesson-terms-table{width:100%;min-width:700px;border-collapse:collapse;text-align:left}
.lesson-terms-table th{padding:12px 14px;border-bottom:1px solid var(--line-dark);background:#f2f3ef;color:#777b74;font:700 9px/1.3 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.lesson-terms-table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:#535750;font-size:12px;line-height:1.65}
.lesson-terms-table tr:last-child td{border-bottom:0}.lesson-terms-table td:first-child{width:82px}.lesson-terms-table td:nth-child(2){width:190px;font-weight:650;color:#2d302c}.lesson-terms-table td:nth-child(3){width:150px;color:#315f82;font-weight:650}.lesson-terms-table code{font-size:11px;font-weight:750;color:#255b46;background:#eef4ef;border:1px solid #d7e2da;border-radius:6px;padding:3px 6px}
@media(max-width:760px){.lesson-terms{margin-top:50px}.lesson-terms-scroll{margin-left:0;margin-right:0}.lesson-terms-table{min-width:660px}.lesson-terms-table td{font-size:11.5px}}
'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Make terminology coverage permanent in Site Quality
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/site-check.yml')
          text = path.read_text(encoding='utf-8')
          step = "      - name: Check lesson terminology\n        run: python scripts/lesson_terms.py\n"
          if step not in text:
              anchor = "      - name: Check core diagrams\n        run: python scripts/check_diagrams.py\n"
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one diagram-check anchor, got {text.count(anchor)}')
              text = text.replace(anchor, step + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify normalized tree
        run: |
          python scripts/lesson_terms.py
          python scripts/check_site.py
          python scripts/normalize_navigation.py
          python scripts/check_diagrams.py
      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git rm .github/workflows/lesson-terms-once.yml
          git add learn lesson.css scripts/lesson_terms.py .github/workflows/site-check.yml
          git commit -m 'Add per-lesson terminology tables'
          git push origin HEAD:main
