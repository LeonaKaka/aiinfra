name: One-time lesson terminology migration

# Diagnose the final two non-idempotent lesson diffs.
on:
  push:
    paths:
      - '.github/workflows/lesson-terms-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: First terminology pass
        run: |
          python scripts/lesson_terms.py --write
          python scripts/link_lesson_terms_css.py
          cp learn/03-gpu-systems/gpu-bottlenecks.html /tmp/gpu-bottlenecks.first.html
          cp learn/04-distributed/nccl-topology.html /tmp/nccl-topology.first.html
      - name: Show second-pass drift
        run: |
          python scripts/lesson_terms.py --write
          echo '--- 03.3 second-pass diff ---'
          diff -u /tmp/gpu-bottlenecks.first.html learn/03-gpu-systems/gpu-bottlenecks.html || true
          echo '--- 04.3 second-pass diff ---'
          diff -u /tmp/nccl-topology.first.html learn/04-distributed/nccl-topology.html || true
          python scripts/lesson_terms.py
          exit 1
