name: One-time lesson terminology migration

# Final migration after making normalized terminology phrases atomic.
on:
  push:
    paths:
      - '.github/workflows/lesson-terms-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Normalize lesson terminology
        run: python scripts/lesson_terms.py --write
      - name: Link terminology stylesheet
        run: python scripts/link_lesson_terms_css.py
      - name: Verify normalized site
        run: |
          python scripts/lesson_terms.py
          python scripts/check_site.py
          python scripts/normalize_navigation.py
          python scripts/check_diagrams.py
      - name: Commit normalized lessons
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git rm .github/workflows/lesson-terms-once.yml
          git add learn
          git commit -m 'Add per-lesson terminology tables'
          git push origin HEAD:main
