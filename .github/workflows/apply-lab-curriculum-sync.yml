name: Apply Lab Curriculum Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Make Source Map anchor unique
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_lab_curriculum_sync.py')
          s = p.read_text(encoding='utf-8')
          old = "'<a href=\"../labs/mini-tp-backward.html\">A2 →</a></div>',\n        '<a href=\"../labs/mini-tp-backward.html\">A2 →</a><a href=\"../labs/mini-sequence-parallel.html\">A8 SP →</a></div>',"
          new = "'<div class=\"source-actions\"><a href=\"https://github.com/NVIDIA/Megatron-LM/blob/main/megatron/core/tensor_parallel/mappings.py\">源码 ↗</a><a href=\"../labs/mini-tp-backward.html\">A2 →</a></div>',\n        '<div class=\"source-actions\"><a href=\"https://github.com/NVIDIA/Megatron-LM/blob/main/megatron/core/tensor_parallel/mappings.py\">源码 ↗</a><a href=\"../labs/mini-tp-backward.html\">A2 →</a><a href=\"../labs/mini-sequence-parallel.html\">A8 SP →</a></div>',"
          if old not in s:
              raise SystemExit('expected generic SP anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Sync curriculum surfaces
        run: python scripts/apply_lab_curriculum_sync.py
      - name: Check site
        run: python scripts/check_site.py
      - name: Check static navigation
        run: python scripts/normalize_navigation.py
      - name: Check lesson terminology
        run: python scripts/lesson_terms.py
      - name: Audit acronyms
        run: python scripts/audit_lesson_acronyms.py
      - name: Check glossary
        run: python scripts/check_glossary_terms.py
      - name: Check diagrams
        run: python scripts/check_diagrams.py
      - name: Commit curriculum sync
        run: |
          if git diff --quiet; then
            echo "No curriculum changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md labs/README.md labs/index.html source-map/index.html
          git commit -m "Connect SP PP CP EP labs to curriculum"
          git push origin HEAD:main
