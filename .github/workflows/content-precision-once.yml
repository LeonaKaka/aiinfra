name: One-time content precision patch

on:
  push:
    paths:
      - '.github/workflows/content-precision-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch teaching precision points
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('learn/03-gpu-systems/gpu-memory.html'): [
                  (
                      '<div class="memory-row train-only"><b>Activations</b><span>forward 产生、backward 之后还要用的中间结果。大小和 batch、sequence、hidden、layer 数强相关。</span><code>mostly train</code></div>',
                      '<div class="memory-row"><b>Activations</b><span>forward 产生的中间结果。训练会为 backward 保留一部分；推理也会产生临时 activation，但通常不会保留 backward 所需的完整中间轨迹。</span><code>both · train-heavy</code></div>',
                  ),
                  (
                      '<p>训练时 forward 产生的某些中间结果必须留到 backward 使用。batch 越大、sequence 越长、hidden 越宽、layer 越多，activation 的总量通常越大。</p>',
                      '<p>训练时 forward 产生的某些中间结果必须留到 backward 使用；推理同样会产生 layer output、attention / MLP 中间结果等 activation，但通常只需短暂存活，不必为 backward 跨阶段保留。batch 越大、sequence 越长、hidden 越宽、layer 越多，训练时需要保存的 activation 总量通常越大。</p>',
                  ),
              ],
              Path('learn/01-foundations/autograd-optimizer.html'): [
                  (
                      '<p>这不是 PyTorch 的坏习惯，而是一个有用特性：显存放不下大 batch 时，可以用多个小 microbatch 累积梯度，再更新一次参数。以后你在 Megatron 里看到 microbatch 和 gradient accumulation，这个基础会再次出现。</p>',
                      '<p>这不是 PyTorch 的坏习惯，而是一个有用特性：显存放不下大 batch 时，可以用多个小 microbatch 累积梯度，再更新一次参数。但要注意：<strong>“累积多个 microbatch”不自动等于“一次大 batch”。</strong>如果每个 microbatch 的 loss 都用 mean reduction，等大 microbatch 常见做法是先除以 accumulation steps 再 backward；如果 microbatch 大小不同，则要按 sample / token 数正确加权。否则累计梯度的整体尺度或样本权重会和一次大 batch 不同。以后你在 Megatron 里看到 microbatch 和 gradient accumulation，这个基础会再次出现。</p>',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match, got {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print(f'patched {path}')
          PY
      - name: Run static quality checks
        run: |
          python scripts/check_site.py
          python scripts/check_diagrams.py
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git rm .github/workflows/content-precision-once.yml
          git add learn/03-gpu-systems/gpu-memory.html learn/01-foundations/autograd-optimizer.html
          git commit -m 'Clarify activation lifetime and gradient accumulation'
          git push origin HEAD:main
