name: Clean Lab Bridge Terms Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-lab-bridge-terms-once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove bridge-only acronym noise
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              *Path('learn/05-megatron').glob('*.html'),
              *Path('learn/08-kv-connector').glob('*.html'),
          ]
          pattern = re.compile(
              r'(<section class="article-section lesson-lab-bridge" id="hands-on">.*?<h2>现在把这节课的数据流亲手跑一遍。</h2>)'
              r'<p>.*?性能结论仍以真实.*?环境为准。</p>',
              re.S,
          )
          replacement = r'\1<p>先用小规模 reference 验证 correctness 与依赖关系；真实性能结论仍以对应硬件与通信栈实测为准。</p>'
          changed = 0
          for path in targets:
              text = path.read_text(encoding='utf-8')
              new, n = pattern.subn(replacement, text, count=1)
              if n:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          if changed != 13:
              raise SystemExit(f'expected 13 lesson bridges, cleaned {changed}')
          print(f'Cleaned {changed} lab bridges.')
          PY
          python scripts/lesson_terms.py --write
      - name: Verify cleaned site
        run: |
          python scripts/check_site.py
          python scripts/normalize_site_navigation.py
          python scripts/normalize_navigation.py
          python scripts/lesson_terms.py
          python scripts/audit_lesson_acronyms.py
          python scripts/check_glossary_terms.py
          python scripts/audit_term_density.py
          python scripts/check_diagrams.py
          git diff --check
      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/clean-lab-bridge-terms-once.yml
          git add -A
          git commit -m 'Keep lesson lab bridges terminology-neutral'
          git push
