name: One-time static navigation normalization

on:
  push:
    paths:
      - '.github/workflows/normalize-navigation-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize published lesson navigation
        run: python scripts/normalize_navigation.py --write
      - name: Verify normalized navigation and site
        run: |
          python scripts/normalize_navigation.py
          python scripts/check_site.py
          python scripts/check_diagrams.py
      - name: Commit normalized pages and remove one-time workflow
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git rm .github/workflows/normalize-navigation-once.yml
          git add learn
          if git diff --cached --quiet; then
            echo 'No navigation changes were needed.'
            exit 1
          fi
          git commit -m 'Normalize published lesson navigation'
          git push origin HEAD:main
