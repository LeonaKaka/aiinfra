name: One-time terminology coverage refresh

on:
  push:
    paths:
      - '.github/workflows/terminology-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Extend terminology registry and discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/lesson_terms.py')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {s.count(old)}')
              s = s.replace(old, new, 1)

          once(
              '    "GELU": ("Gaussian Error Linear Unit", "高斯误差线性单元", "Transformer/MLP 中常见的非线性激活函数。", True),\n',
              '    "GELU": ("Gaussian Error Linear Unit", "高斯误差线性单元", "Transformer/MLP 中常见的非线性激活函数。", True),\n'
              '    "MSE": ("Mean Squared Error", "均方误差", "用预测值与目标值之差的平方衡量误差；基础训练课用它作为最小 loss 示例。", True),\n'
              '    "SGD": ("Stochastic Gradient Descent", "随机梯度下降", "按梯度更新参数的经典优化方法；基础课用 PyTorch SGD 展示 optimizer step。", True),\n'
              '    "FFN": ("Feed-Forward Network", "前馈网络", "Transformer / MoE 中按 token 独立应用的前馈子网络；MoE expert 通常就是一类 FFN。", True),\n',
              'training terms',
          )
          once(
              '    "NCCL": ("NVIDIA Collective Communications Library", "NVIDIA 集体通信库", "GPU 集群中常用的 collective / P2P 通信软件库。", True),\n',
              '    "NCCL": ("NVIDIA Collective Communications Library", "NVIDIA 集体通信库", "GPU 集群中常用的 collective / P2P 通信软件库。", True),\n'
              '    "NVLS": ("NVLink Sharp", "NVLink Sharp 算法", "NCCL 在支持的平台上可选择的 NVLink/NVSwitch 相关 collective 加速算法族。", True),\n',
              'NVLS term',
          )
          once(
              '    "IB": ("InfiniBand", "InfiniBand 高速互连", "HPC/AI 集群常见的低延迟高带宽网络技术。", True),\n',
              '    "IB": ("InfiniBand", "InfiniBand 高速互连", "HPC/AI 集群常见的低延迟高带宽网络技术。", True),\n'
              '    "TCP": ("Transmission Control Protocol", "传输控制协议", "可靠的字节流传输协议；分布式初始化/控制面可能通过 TCP 网络完成 rendezvous 或消息交换。", True),\n',
              'TCP term',
          )
          once(
              '    "LBNHC": ("LBNHC KV layout", "LBNHC KV 布局", "另一种 KV cache 维度布局记号，本身是维度顺序代码。", False),\n}\n\nSKIP_TAGS',
              '    "LBNHC": ("LBNHC KV layout", "LBNHC KV 布局", "另一种 KV cache 维度布局记号，本身是维度顺序代码。", False),\n}\n\n'
              '# Discovery aliases cover API/container spellings without rewriting code.\n'
              'TERM_ALIASES = {\n'
              '    "MSE": ("MSE", "MSELoss"),\n'
              '}\n\n'
              'SKIP_TAGS',
              'aliases',
          )
          once(
              'def term_pattern(abbr: str) -> re.Pattern[str]:\n    if abbr == "P/D":\n        return re.compile(r"(?<![A-Za-z0-9])P/D(?![A-Za-z0-9])")\n    return re.compile(rf"(?<![A-Za-z0-9]){re.escape(abbr)}(?![A-Za-z0-9])")\n\n\ndef normalized_form',
              'def term_pattern(abbr: str) -> re.Pattern[str]:\n    if abbr == "P/D":\n        return re.compile(r"(?<![A-Za-z0-9])P/D(?![A-Za-z0-9])")\n    return re.compile(rf"(?<![A-Za-z0-9]){re.escape(abbr)}(?![A-Za-z0-9])")\n\n\ndef discovery_pattern(abbr: str) -> re.Pattern[str]:\n    aliases = TERM_ALIASES.get(abbr, (abbr,))\n    body = "|".join(re.escape(alias) for alias in sorted(aliases, key=len, reverse=True))\n    return re.compile(rf"(?<![A-Za-z0-9])(?:{body})(?![A-Za-z0-9])")\n\n\ndef normalized_form',
              'discovery pattern',
          )
          once(
              'def visible_text(body: str) -> str:\n    chunks = []\n    for kind, text, blocked in tokenize_body(body):\n        if kind == "text" and not blocked:\n            chunks.append(semanticize_text(html_lib.unescape(text)))\n    return " ".join(chunks)\n\n\ndef found_terms(body: str) -> list[str]:\n    text = visible_text(body)\n    positions = []\n    for order, abbr in enumerate(TERMS):\n        m = term_pattern(abbr).search(text)\n        if m:\n            positions.append((m.start(), order, abbr))\n    return [abbr for _, _, abbr in sorted(positions)]\n',
              'def visible_text(body: str) -> str:\n    chunks = []\n    for kind, text, blocked in tokenize_body(body):\n        if kind == "text" and not blocked:\n            chunks.append(semanticize_text(html_lib.unescape(text)))\n    return " ".join(chunks)\n\n\ndef discovery_text(body: str) -> str:\n    """Text a learner can encounter inside the article, including headings/code.\n\n    This is intentionally broader than first-use expansion. Generated term tables\n    are removed before this function is called; HTML tags/attributes are stripped\n    so code and headings count without mutating them.\n    """\n    text = re.sub(r"<script\\b.*?</script>|<style\\b.*?</style>|<svg\\b.*?</svg>", " ", body, flags=re.S | re.I)\n    text = re.sub(r"<[^>]+>", " ", text)\n    return semanticize_text(html_lib.unescape(text))\n\n\ndef found_terms(body: str) -> list[str]:\n    text = discovery_text(body)\n    positions = []\n    for order, abbr in enumerate(TERMS):\n        m = discovery_pattern(abbr).search(text)\n        if m:\n            positions.append((m.start(), order, abbr))\n    return [abbr for _, _, abbr in sorted(positions)]\n',
              'broader discovery',
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Refresh all lesson tables
        run: python scripts/lesson_terms.py --write
      - name: Verify terminology and site
        run: |
          python scripts/lesson_terms.py
          python scripts/check_site.py
          python scripts/normalize_navigation.py
          python scripts/check_diagrams.py
      - name: Commit refresh
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git rm .github/workflows/terminology-refresh-once.yml
          git add scripts/lesson_terms.py learn
          git commit -m 'Close per-lesson terminology coverage gaps'
          git push origin HEAD:main
