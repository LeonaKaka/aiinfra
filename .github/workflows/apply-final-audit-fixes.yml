name: Apply Final Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-audit-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Correct Data Parallel scope in lesson 05.1
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('learn/05-megatron/why-model-parallel.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '解释为什么 Data Parallel 不能解决“单份模型本身就放不下”的问题。':
                  '解释为什么复制完整模型的传统 Data Parallel 不能解决“单份模型本身就放不下”的问题，并知道参数分片型 FSDP / ZeRO-3 是另一条路线。',
              'Data Parallel 擅长“多吃数据”，但默认会复制完整模型。':
                  '复制式 Data Parallel 擅长“多吃数据”，但每个 replica 都要有完整模型。',
              '所以要区分两个不同问题：<strong>吞吐不够</strong>和<strong>单份模型放不下</strong>。DP 对第一个问题非常有效；模型并行首先解决第二个问题。':
                  '所以要区分两个不同问题：<strong>吞吐不够</strong>和<strong>单份模型放不下</strong>。复制式 DP 对第一个问题非常有效；第二个问题既可以用 TP / PP 等模型并行去切计算与权重，也可以用能够分片参数的 FSDP / ZeRO-3 类 data-parallel state sharding 降低每个 rank 的常驻 model states。它们不是同一个机制；05.5 会再专门看 Megatron Distributed Optimizer。',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'expected lesson 05.1 anchor not found: {old}')
          if not changed:
              print('lesson 05.1 already corrected')
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/lesson_terms.py --write
      - name: Verify affected teaching surface
        run: |
          python scripts/lesson_terms.py
          python scripts/audit_lesson_acronyms.py
          python scripts/check_site.py
          python scripts/check_diagrams.py
          git diff --check
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-final-audit-fixes.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clarify Data Parallel model-fit limits'
          git push

