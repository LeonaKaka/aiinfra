name: Apply Final Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-audit-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fix contextual PC terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/lesson_terms.py')
          text = p.read_text(encoding='utf-8')
          old = '    "PC": ("Program Counter", "程序计数器", "执行单元用于跟踪下一条指令位置的控制状态；GPU SIMT 控制流讨论中会遇到。", True),'
          new = '    "PC": ("Personal Computer", "个人电脑", "这里指普通个人电脑/工作站语境；与硬件控制流里的 program counter 不是同一个缩写含义。", True),'
          if old not in text:
              raise SystemExit('expected PC registry entry not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/lesson_terms.py --write
      - name: Verify terminology and site
        run: |
          python scripts/lesson_terms.py
          python scripts/audit_lesson_acronyms.py
          python scripts/check_site.py
          python scripts/normalize_site_navigation.py
          git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lesson_terms.py learn/
          git commit -m 'Correct PC terminology in GPU foundations'
          git push

# trigger
