name: Apply Final Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-audit-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Clean legacy terminology artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('learn/03-gpu-systems/gpu-mental-model.html')
          text = p.read_text(encoding='utf-8')
          bad = 'Program Counter (Personal Computer (PC，个人电脑)，程序计数器)'
          good = 'Personal Computer (PC，个人电脑)'
          if bad not in text:
              raise SystemExit('legacy nested PC phrase not found')
          p.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
          python scripts/lesson_terms.py --write
      - name: Verify terminology and site
        run: |
          python scripts/lesson_terms.py
          python scripts/audit_lesson_acronyms.py
          python scripts/check_site.py
          python scripts/normalize_site_navigation.py
          git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn/03-gpu-systems/gpu-mental-model.html
          git commit -m 'Clean legacy PC terminology expansion'
          git push

# audit-fix-v3
