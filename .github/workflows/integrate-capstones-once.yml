name: One-time capstone integration

on:
  push:
    paths:
      - '.github/workflows/integrate-capstones-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Integrate A12 and B8 across the course
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('scripts/run_lab_smoke.py', '    ("A11 Mini Expert Parallel", 2, "labs/code/mini_expert_parallel.py", ()),\n    ("B1 Mini KV Handoff", 2, "labs/code/mini_kv_handoff.py", ()),', '    ("A11 Mini Expert Parallel", 2, "labs/code/mini_expert_parallel.py", ()),\n    ("A12 Mini Training System", 4, "labs/code/mini_training_system.py", ()),\n    ("B1 Mini KV Handoff", 2, "labs/code/mini_kv_handoff.py", ()),')
          replace_once('scripts/run_lab_smoke.py', '    ("B7 KV Lease / Expiry", 2, "labs/code/mini_kv_lease_expiry.py", ()),\n)', '    ("B7 KV Lease / Expiry", 2, "labs/code/mini_kv_lease_expiry.py", ()),\n    ("B8 Mini Inference Engine", 2, "labs/code/mini_inference_engine.py", ()),\n)')

          replace_once('labs/index.html', 'Training 线从 TP forward/backward 走到 DP、Distributed Optimizer、bucketed overlap、TP×DP、SP、PP、CP、EP 与 profiler 证据层；Inference 线从 KV handoff 走到 block table、nonblocking transfer、layer-wise streaming、handshake/lifetime 与 registered-region descriptor。每一步都先做 correctness reference，再谈性能。', 'Training 线从 TP forward/backward 走到 DP、Distributed Optimizer、bucketed overlap、TP×DP、SP、PP、CP、EP，最后用 A12 把它们串成一个 training step；Inference 线从 KV handoff 走到 block table、nonblocking transfer、layer-wise streaming、handshake/lifetime 与 registered-region descriptor，最后用 B8 把 request scheduling、block state、remote KV 与 completion 串成一个最小 inference engine。每一步都先做 correctness reference，再谈性能。')
          replace_once('labs/index.html', '<b>Runnable labs</b><span>18 experiments</span>', '<b>Runnable labs</b><span>20 experiments</span>')
          replace_once('labs/index.html', '      <a class="lab-card train" href="./mini-expert-parallel.html"><small>LAB A11 · EXPERT PARALLEL</small><h2>Mini Expert Parallel</h2><p>router → all-to-all dispatch → local experts → reverse combine；同时验证数值和 token identity。</p><footer><span>核心问题</span><strong>token 为什么必须去 expert owner，再回到原顺序？</strong></footer></a>\n    </section>', '      <a class="lab-card train" href="./mini-expert-parallel.html"><small>LAB A11 · EXPERT PARALLEL</small><h2>Mini Expert Parallel</h2><p>router → all-to-all dispatch → local experts → reverse combine；同时验证数值和 token identity。</p><footer><span>核心问题</span><strong>token 为什么必须去 expert owner，再回到原顺序？</strong></footer></a>\n      <a class="lab-card train" href="./mini-training-system.html"><small>LAB A12 · TRAINING CAPSTONE</small><h2>Mini Training System</h2><p>把 TP×DP、gradient readiness、async reduce-scatter、sharded optimizer update 与 parameter all-gather 串成一次完整 training step。</p><footer><span>核心问题</span><strong>这些并行机制在一次 step 里如何真正接起来？</strong></footer></a>\n    </section>')
          replace_once('labs/index.html', '      <a class="lab-card infer" href="./mini-kv-lease-expiry.html"><small>LAB B7 · RESOURCE LIFETIME</small><h2>KV Lease / Expiry</h2><p>用 heartbeat、completion 与 expiry 状态机解决两个相反风险：远端仍在读时不能释放，对端失联后又不能永久钉住 blocks。</p><footer><span>核心问题</span><strong>怎样既不提前释放，也不永久泄漏 KV？</strong></footer></a>\n    </section>', '      <a class="lab-card infer" href="./mini-kv-lease-expiry.html"><small>LAB B7 · RESOURCE LIFETIME</small><h2>KV Lease / Expiry</h2><p>用 heartbeat、completion 与 expiry 状态机解决两个相反风险：远端仍在读时不能释放，对端失联后又不能永久钉住 blocks。</p><footer><span>核心问题</span><strong>怎样既不提前释放，也不永久泄漏 KV？</strong></footer></a>\n      <a class="lab-card infer" href="./mini-inference-engine.html"><small>LAB B8 · INFERENCE CAPSTONE</small><h2>Mini Inference Engine</h2><p>把 local KV hit、remote KV、cold prefill 放进同一个 scheduler token budget，再接上 block table、async load、decode 与 completion lifetime。</p><footer><span>核心问题</span><strong>一个 request 从“可调度”到“可安全释放”经历哪些系统状态？</strong></footer></a>\n    </section>')
          replace_once('labs/index.html', '18 个脚本目前的第一验收标准', '20 个脚本目前的第一验收标准')

          replace_once('labs/README.md', '### Lab A11 — Mini Expert Parallel\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_expert_parallel.py\n```\n确定性 balanced router 把 token 通过 `all_to_all_single` 发给 expert owners，本地 expert compute 后 reverse all-to-all，再恢复原 token 顺序并与 reference 对齐。该实验只教学 ownership / dispatch / combine 生命周期，不模拟 capacity、dropping 或 load balancing。\n\n## Inference Infra', '### Lab A11 — Mini Expert Parallel\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_expert_parallel.py\n```\n确定性 balanced router 把 token 通过 `all_to_all_single` 发给 expert owners，本地 expert compute 后 reverse all-to-all，再恢复原 token 顺序并与 reference 对齐。该实验只教学 ownership / dispatch / combine 生命周期，不模拟 capacity、dropping 或 load balancing。\n\n### Lab A12 — Mini Training System\n```bash\ntorchrun --standalone --nproc-per-node=4 labs/code/mini_training_system.py\n```\n4 ranks 组成 TP=2 × DP=2：TP shards 完成两层 MLP forward；W2 gradient ready 后立刻启动 DP async `reduce_scatter_single`，同时继续计算 W1；每个 DP rank 只更新自己负责的 parameter chunk，再 `all_gather_single` 恢复下一次 forward 所需的 TP parameter shard。最终与同一 global batch 的 dense SGD step 对齐。CPU/Gloo 只验证 correctness 与依赖顺序，不证明真实硬件 overlap。\n\n## Inference Infra')
          replace_once('labs/README.md', '### Lab B7 — KV Lease / Expiry\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_kv_lease_expiry.py\n```\n用 deterministic virtual clock 跑两条资源生命周期：一个 request 通过 heartbeat 延长 lease 后正常 completion；另一个 request 完全失联，最终靠 expiry 回收。另用 toy generation ID 演示 stale heartbeat 不能续约已复用资源。该状态机教学 lifetime invariant，不宣称复刻当前 vLLM 的全部 lease 实现。\n\n## Environment', '### Lab B7 — KV Lease / Expiry\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_kv_lease_expiry.py\n```\n用 deterministic virtual clock 跑两条资源生命周期：一个 request 通过 heartbeat 延长 lease 后正常 completion；另一个 request 完全失联，最终靠 expiry 回收。另用 toy generation ID 演示 stale heartbeat 不能续约已复用资源。该状态机教学 lifetime invariant，不宣称复刻当前 vLLM 的全部 lease 实现。\n\n### Lab B8 — Mini Inference Engine\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_inference_engine.py\n```\n把三类 request 放进同一个最小 scheduler：local KV hit 直接 decode；cold miss 消耗 token budget 做本地 prefill；remote KV request 先验证 descriptor、分配 logical→physical block table，并在异步传输期间等待真正的 KV dependency。最后 remote decode 与本地重算 prompt KV 的 correctness reference 对齐，并通过 completion acknowledgement 才释放 producer-side lifetime。request state、descriptor 字段和 block ID 都是教学模型，不宣称是当前 vLLM 的逐字段复刻。\n\n## Environment')
          replace_once('labs/README.md', '软件实验现在覆盖 Training A1–A11 与 Inference B1–B7。下一阶段优先做跨机制 capstone 与有证据的硬件验证：真实 GPU/NCCL profiler overlap，以及具备对应 NIC/driver/software stack 时的 NIXL/UCX/RDMA/GPUDirect 数据面。', '软件实验现在覆盖 Training A1–A12 与 Inference B1–B8，共 20 个 runnable correctness labs。A12 与 B8 已分别把训练和推理主线装成 end-to-end teaching capstone。下一阶段重点转向真实源码阅读闭环与有证据的硬件验证：GPU/NCCL profiler overlap，以及具备对应 NIC/driver/software stack 时的 NIXL/UCX/RDMA/GPUDirect 数据面。')

          replace_once('labs/mini-expert-parallel.html', '<nav class="lab-footer-nav"><a href="./mini-context-parallel.html">← Lab A10 · Context Parallel</a><a href="./index.html">返回 Labs 总览 →</a></nav>', '<nav class="lab-footer-nav"><a href="./mini-context-parallel.html">← Lab A10 · Context Parallel</a><a href="./mini-training-system.html">Lab A12 · Training System →</a></nav>')
          replace_once('labs/mini-kv-lease-expiry.html', '<nav class="lab-footer-nav"><a href="./mini-registered-region-descriptor.html">← Lab B6 · Registered Region</a><a href="../source-map/index.html#vllm">进入 vLLM / NIXL Source Map →</a></nav>', '<nav class="lab-footer-nav"><a href="./mini-registered-region-descriptor.html">← Lab B6 · Registered Region</a><a href="./mini-inference-engine.html">Lab B8 · Inference Engine →</a></nav>')

          replace_once('README.md', '当前有 18 个可运行实验，分成两条完整主线：', '当前有 20 个可运行实验，分成两条完整主线：')
          replace_once('README.md', '**Training · A1–A11**', '**Training · A1–A12**')
          replace_once('README.md', '- A11 Mini Expert Parallel\n', '- A11 Mini Expert Parallel\n- A12 Mini Training System\n')
          replace_once('README.md', '**Inference · B1–B7**', '**Inference · B1–B8**')
          replace_once('README.md', '- B7 KV Lease / Expiry\n', '- B7 KV Lease / Expiry\n- B8 Mini Inference Engine\n')
          replace_once('README.md', '用 `torchrun` / Gloo 实际执行 A1–A11 与 B1–B7 共 18 个实验。', '用 `torchrun` / Gloo 实际执行 A1–A12 与 B1–B8 共 20 个实验。')

          replace_once('index.html', 'AI Infra from Zero：8 个学习模块、14 个可运行实验，从基础知识一路学到 Megatron Core 与 vLLM KV Connector。', 'AI Infra from Zero：8 个学习模块、20 个可运行实验，从基础知识一路学到 Megatron Core 与 vLLM KV Connector。')
          replace_once('index.html', '<div><strong>14</strong><span>可运行实验</span></div>', '<div><strong>20</strong><span>可运行实验</span></div>')
          replace_once('index.html', '<div class="road-outcome"><small>阶段项目</small> Mini Megatron 系列从 TP 一路做到 TP×DP 与 profiler evidence。</div>', '<div class="road-outcome"><small>阶段项目</small> 从 TP/DP/SP/PP/CP/EP 单机制实验一路做到 A12 Mini Training System，把一次 training step 串起来。</div>')
          PY
      - name: Verify integrated site
        run: |
          python scripts/check_site.py
          python scripts/normalize_navigation.py
          python scripts/check_diagrams.py
      - name: Commit integrated capstones
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git add README.md index.html labs scripts/run_lab_smoke.py
          git commit -m 'Integrate training and inference capstone labs'
          git push origin HEAD:main
