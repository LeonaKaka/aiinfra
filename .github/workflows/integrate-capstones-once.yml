name: One-time capstone integration

on:
  push:
    paths:
      - '.github/workflows/integrate-capstones-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Integrate A12 and B8 across the course
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one match, got {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Smoke runner: 18 -> 20 real correctness labs.
          replace_once(
              'scripts/run_lab_smoke.py',
              '    ("A11 Mini Expert Parallel", 2, "labs/code/mini_expert_parallel.py", ()),\n    ("B1 Mini KV Handoff", 2, "labs/code/mini_kv_handoff.py", ()),',
              '    ("A11 Mini Expert Parallel", 2, "labs/code/mini_expert_parallel.py", ()),\n    ("A12 Mini Training System", 4, "labs/code/mini_training_system.py", ()),\n    ("B1 Mini KV Handoff", 2, "labs/code/mini_kv_handoff.py", ()),'
          )
          replace_once(
              'scripts/run_lab_smoke.py',
              '    ("B7 KV Lease / Expiry", 2, "labs/code/mini_kv_lease_expiry.py", ()),\n)',
              '    ("B7 KV Lease / Expiry", 2, "labs/code/mini_kv_lease_expiry.py", ()),\n    ("B8 Mini Inference Engine", 2, "labs/code/mini_inference_engine.py", ()),\n)'
          )

          replace_once('.github/workflows/lab-smoke.yml', 'All 18 runnable reference labs', 'All 20 runnable reference labs')
          replace_once('.github/workflows/lab-smoke.yml', 'Run all 18 CPU/Gloo labs', 'Run all 20 CPU/Gloo labs')

          # Labs overview.
          replace_once(
              'labs/index.html',
              'Training 线从 TP forward/backward 走到 DP、Distributed Optimizer、bucketed overlap、TP×DP、SP、PP、CP、EP 与 profiler 证据层；Inference 线从 KV handoff 走到 block table、nonblocking transfer、layer-wise streaming、handshake/lifetime 与 registered-region descriptor。每一步都先做 correctness reference，再谈性能。',
              'Training 线从 TP forward/backward 走到 DP、Distributed Optimizer、bucketed overlap、TP×DP、SP、PP、CP、EP，最后用 A12 把它们串成一个 training step；Inference 线从 KV handoff 走到 block table、nonblocking transfer、layer-wise streaming、handshake/lifetime 与 registered-region descriptor，最后用 B8 把 request scheduling、block state、remote KV 与 completion 串成一个最小 inference engine。每一步都先做 correctness reference，再谈性能。'
          )
          replace_once('labs/index.html', '<b>Runnable labs</b><span>18 experiments</span>', '<b>Runnable labs</b><span>20 experiments</span>')
          replace_once(
              'labs/index.html',
              '      <a class="lab-card train" href="./mini-expert-parallel.html"><small>LAB A11 · EXPERT PARALLEL</small><h2>Mini Expert Parallel</h2><p>router → all-to-all dispatch → local experts → reverse combine；同时验证数值和 token identity。</p><footer><span>核心问题</span><strong>token 为什么必须去 expert owner，再回到原顺序？</strong></footer></a>\n    </section>',
              '      <a class="lab-card train" href="./mini-expert-parallel.html"><small>LAB A11 · EXPERT PARALLEL</small><h2>Mini Expert Parallel</h2><p>router → all-to-all dispatch → local experts → reverse combine；同时验证数值和 token identity。</p><footer><span>核心问题</span><strong>token 为什么必须去 expert owner，再回到原顺序？</strong></footer></a>\n      <a class="lab-card train" href="./mini-training-system.html"><small>LAB A12 · TRAINING CAPSTONE</small><h2>Mini Training System</h2><p>把 TP×DP、gradient readiness、async reduce-scatter、sharded optimizer update 与 parameter all-gather 串成一次完整 training step。</p><footer><span>核心问题</span><strong>这些并行机制在一次 step 里如何真正接起来？</strong></footer></a>\n    </section>'
          )
          replace_once(
              'labs/index.html',
              '      <a class="lab-card infer" href="./mini-kv-lease-expiry.html"><small>LAB B7 · RESOURCE LIFETIME</small><h2>KV Lease / Expiry</h2><p>用 heartbeat、completion 与 expiry 状态机解决两个相反风险：远端仍在读时不能释放，对端失联后又不能永久钉住 blocks。</p><footer><span>核心问题</span><strong>怎样既不提前释放，也不永久泄漏 KV？</strong></footer></a>\n    </section>',
              '      <a class="lab-card infer" href="./mini-kv-lease-expiry.html"><small>LAB B7 · RESOURCE LIFETIME</small><h2>KV Lease / Expiry</h2><p>用 heartbeat、completion 与 expiry 状态机解决两个相反风险：远端仍在读时不能释放，对端失联后又不能永久钉住 blocks。</p><footer><span>核心问题</span><strong>怎样既不提前释放，也不永久泄漏 KV？</strong></footer></a>\n      <a class="lab-card infer" href="./mini-inference-engine.html"><small>LAB B8 · INFERENCE CAPSTONE</small><h2>Mini Inference Engine</h2><p>把 local KV hit、remote KV、cold prefill 放进同一个 scheduler token budget，再接上 block table、async load、decode 与 completion lifetime。</p><footer><span>核心问题</span><strong>一个 request 从“可调度”到“可安全释放”经历哪些系统状态？</strong></footer></a>\n    </section>'
          )
          replace_once('labs/index.html', '18 个脚本目前的第一验收标准', '20 个脚本目前的第一验收标准')

          # README for the Labs.
          replace_once(
              'labs/README.md',
              '### Lab A11 — Mini Expert Parallel\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_expert_parallel.py\n```\n确定性 balanced router 把 token 通过 `all_to_all_single` 发给 expert owners，本地 expert compute 后 reverse all-to-all，再恢复原 token 顺序并与 reference 对齐。该实验只教学 ownership / dispatch / combine 生命周期，不模拟 capacity、dropping 或 load balancing。\n\n## Inference Infra',
              '### Lab A11 — Mini Expert Parallel\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_expert_parallel.py\n```\n确定性 balanced router 把 token 通过 `all_to_all_single` 发给 expert owners，本地 expert compute 后 reverse all-to-all，再恢复原 token 顺序并与 reference 对齐。该实验只教学 ownership / dispatch / combine 生命周期，不模拟 capacity、dropping 或 load balancing。\n\n### Lab A12 — Mini Training System\n```bash\ntorchrun --standalone --nproc-per-node=4 labs/code/mini_training_system.py\n```\n4 ranks 组成 TP=2 × DP=2：TP shards 完成两层 MLP forward；W2 gradient ready 后立刻启动 DP async `reduce_scatter_single`，同时继续计算 W1；每个 DP rank 只更新自己负责的 parameter chunk，再 `all_gather_single` 恢复下一次 forward 所需的 TP parameter shard。最终与同一 global batch 的 dense SGD step 对齐。CPU/Gloo 只验证 correctness 与依赖顺序，不证明真实硬件 overlap。\n\n## Inference Infra'
          )
          replace_once(
              'labs/README.md',
              '### Lab B7 — KV Lease / Expiry\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_kv_lease_expiry.py\n```\n用 deterministic virtual clock 跑两条资源生命周期：一个 request 通过 heartbeat 延长 lease 后正常 completion；另一个 request 完全失联，最终靠 expiry 回收。另用 toy generation ID 演示 stale heartbeat 不能续约已复用资源。该状态机教学 lifetime invariant，不宣称复刻当前 vLLM 的全部 lease 实现。\n\n## Environment',
              '### Lab B7 — KV Lease / Expiry\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_kv_lease_expiry.py\n```\n用 deterministic virtual clock 跑两条资源生命周期：一个 request 通过 heartbeat 延长 lease 后正常 completion；另一个 request 完全失联，最终靠 expiry 回收。另用 toy generation ID 演示 stale heartbeat 不能续约已复用资源。该状态机教学 lifetime invariant，不宣称复刻当前 vLLM 的全部 lease 实现。\n\n### Lab B8 — Mini Inference Engine\n```bash\ntorchrun --standalone --nproc-per-node=2 labs/code/mini_inference_engine.py\n```\n把三类 request 放进同一个最小 scheduler：local KV hit 直接 decode；cold miss 消耗 token budget 做本地 prefill；remote KV request 先验证 descriptor、分配 logical→physical block table，并在异步传输期间等待真正的 KV dependency。最后 remote decode 与本地重算 prompt KV 的 correctness reference 对齐，并通过 completion acknowledgement 才释放 producer-side lifetime。request state、descriptor 字段和 block ID 都是教学模型，不宣称是当前 vLLM 的逐字段复刻。\n\n## Environment'
          )
          replace_once(
              'labs/README.md',
              '软件实验现在覆盖 Training A1–A11 与 Inference B1–B7。下一阶段优先做跨机制 capstone 与有证据的硬件验证：真实 GPU/NCCL profiler overlap，以及具备对应 NIC/driver/software stack 时的 NIXL/UCX/RDMA/GPUDirect 数据面。',
              '软件实验现在覆盖 Training A1–A12 与 Inference B1–B8，共 20 个 runnable correctness labs。A12 与 B8 已分别把训练和推理主线装成 end-to-end teaching capstone。下一阶段重点转向真实源码阅读闭环与有证据的硬件验证：GPU/NCCL profiler overlap，以及具备对应 NIC/driver/software stack 时的 NIXL/UCX/RDMA/GPUDirect 数据面。'
          )

          # Connect the end-of-track navigation.
          replace_once(
              'labs/mini-expert-parallel.html',
              '<nav class="lab-footer-nav"><a href="./mini-context-parallel.html">← Lab A10 · Context Parallel</a><a href="./index.html">返回 Labs 总览 →</a></nav>',
              '<nav class="lab-footer-nav"><a href="./mini-context-parallel.html">← Lab A10 · Context Parallel</a><a href="./mini-training-system.html">Lab A12 · Training System →</a></nav>'
          )
          replace_once(
              'labs/mini-kv-lease-expiry.html',
              '<nav class="lab-footer-nav"><a href="./mini-registered-region-descriptor.html">← Lab B6 · Registered Region</a><a href="../source-map/index.html#vllm">进入 vLLM / NIXL Source Map →</a></nav>',
              '<nav class="lab-footer-nav"><a href="./mini-registered-region-descriptor.html">← Lab B6 · Registered Region</a><a href="./mini-inference-engine.html">Lab B8 · Inference Engine →</a></nav>'
          )

          # Root README.
          replace_once('README.md', '当前有 18 个可运行实验，分成两条完整主线：', '当前有 20 个可运行实验，分成两条完整主线：')
          replace_once('README.md', '**Training · A1–A11**', '**Training · A1–A12**')
          replace_once('README.md', '- A11 Mini Expert Parallel\n', '- A11 Mini Expert Parallel\n- A12 Mini Training System\n')
          replace_once('README.md', '**Inference · B1–B7**', '**Inference · B1–B8**')
          replace_once('README.md', '- B7 KV Lease / Expiry\n', '- B7 KV Lease / Expiry\n- B8 Mini Inference Engine\n')
          replace_once(
              'README.md',
              '用 `torchrun` / Gloo 实际执行 A1–A11 与 B1–B7 共 18 个实验。',
              '用 `torchrun` / Gloo 实际执行 A1–A12 与 B1–B8 共 20 个实验。'
          )

          # Homepage count and capstone outcome.
          replace_once(
              'index.html',
              'AI Infra from Zero：8 个学习模块、14 个可运行实验，从基础知识一路学到 Megatron Core 与 vLLM KV Connector。',
              'AI Infra from Zero：8 个学习模块、20 个可运行实验，从基础知识一路学到 Megatron Core 与 vLLM KV Connector。'
          )
          replace_once('index.html', '<div><strong>14</strong><span>可运行实验</span></div>', '<div><strong>20</strong><span>可运行实验</span></div>')
          replace_once(
              'index.html',
              '<div class="road-outcome"><small>阶段项目</small> Mini Megatron 系列从 TP 一路做到 TP×DP 与 profiler evidence。</div>',
              '<div class="road-outcome"><small>阶段项目</small> 从 TP/DP/SP/PP/CP/EP 单机制实验一路做到 A12 Mini Training System，把一次 training step 串起来。</div>'
          )

          # New inference capstone teaching page.
          b8 = '''<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="description" content="Mini Inference Engine：把 request scheduling、token budget、KV block mapping、remote KV transfer、decode 与 completion lifetime 串成一个可验证推理生命周期。" />
            <title>Lab B8 · Mini Inference Engine</title>
            <link rel="stylesheet" href="../styles.css" />
            <link rel="stylesheet" href="../lesson.css" />
            <link rel="stylesheet" href="./lab.css" />
          </head>
          <body class="lab-body">
            <div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>
            <header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">AI</span><span class="brand-copy"><strong>Infra from Zero</strong><small>Lab B8</small></span></a><nav class="site-nav"><a href="./index.html">Labs</a><a href="../source-map/index.html">Source Map</a></nav></header>

            <main class="lab-article">
              <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="./index.html">Labs</a><span>/</span><span>Mini Inference Engine</span></div>
              <div class="lab-kicker">LAB B8 · INFERENCE CAPSTONE</div>
              <h1>B1–B7 是 KV 数据面的零件。<br />这一节第一次让多个 request 在同一个 engine 生命周期里竞争资源。</h1>
              <p class="dek">2 个 ranks 分别扮演 remote KV Producer 与 Inference Consumer。Consumer 同时面对 local KV hit、remote KV request 和 cold miss：scheduler 必须分配 model-compute token budget，block table 必须把 logical KV 映射到 physical pool，remote transfer 必须在 decode 真正需要前完成，最后 completion 才允许 Producer 释放那一代 KV。</p>

              <section class="lab-section" id="requests"><div class="lab-kicker">01 · THREE REQUEST PATHS</div><h2>推理系统不是“一条 prompt 顺序跑到底”，而是在不同状态的 request 之间不断做选择。</h2>
                <div class="stage-flow"><div class="stage-card infer"><small>REQ 201 · LOCAL HIT</small><b>KV already local → decode</b><span>不需要重新 prefill；只消耗 1 个 decode token 的 model-compute budget。</span></div><div class="stage-card comm"><small>REQ 202 · REMOTE KV</small><b>descriptor → blocks → async load</b><span>先验证远端对象兼容性并预留 physical blocks；KV 到达后才能进入 decode。</span></div><div class="stage-card train"><small>REQ 203 · COLD MISS</small><b>no reusable KV → prefill</b><span>远端 KV 仍在传输时，本地可以把计算预算用在另一个 cold request 的 prefill 上。</span></div></div>
                <p>这里真正要看的不是三个固定 request id，而是<strong>状态不同 → 下一步资源需求不同</strong>。这正是 continuous batching / scheduler 思维和普通“batch 一次算完”最大的差别。</p>
              </section>

              <section class="lab-section" id="budget"><div class="lab-kicker">02 · TOKEN BUDGET ≠ NETWORK BYTES</div><h2>远端 KV 在搬，并不等于它正在消耗 model-compute token budget。</h2>
                <div class="command"><div class="command-head"><span>DEFAULT TEACHING SCHEDULE</span><span>token budget = 6</span></div><pre>1 token  → request 201 local-KV decode
4 tokens → request 203 cold prefill
           [request 202 KV transfer is in flight]
1 token  → request 202 remote-KV decode after data is ready

remaining model-compute budget = 0</pre></div>
                <p>这个区分非常重要：scheduler 的 token budget 约束模型这一步准备计算多少 token；KV transfer 同时占用的是另一类 data-plane / memory / network 资源。真实 vLLM 还有更丰富的 scheduling policy，但“计算预算”和“外部状态到达”不是同一个量。</p>
              </section>

              <section class="lab-section" id="blocks"><div class="lab-kicker">03 · LOGICAL REQUEST, PHYSICAL KV POOL</div><h2>request 只需要知道自己的逻辑 block 顺序，不应该绑定某个固定显存地址。</h2>
                <div class="source-bridge"><div><small>LOGICAL</small><b>request 202 blocks [0, 1]</b><code>prompt order</code></div><span>block table →</span><div><small>PHYSICAL</small><b>pool slots [7, 3]</b><code>allocator-owned storage</code></div></div>
                <p>Consumer 在 bulk payload 完成前先建立 block table，然后把收到的 KV blocks 写进对应 physical slots；真正做 attention 时再按 logical order 取回。B2 的“逻辑序列与物理位置解耦”在这里第一次进入 scheduler + remote-transfer 生命周期。</p>
              </section>

              <section class="lab-section" id="lifetime"><div class="lab-kicker">04 · CONTROL PLANE BEFORE DATA, COMPLETION BEFORE RELEASE</div><h2>高速搬 KV 之前先确认“这是谁、长什么样”；搬完以后还要确认“现在真的可以释放”。</h2>
                <div class="command"><div class="command-head"><span>REMOTE REQUEST 202</span><span>lifetime contract</span></div><pre>Producer: descriptor(request / shape / generation / bytes)
              │
Consumer: validate → allocate physical blocks → irecv(payload)
              │
          independent local scheduling / prefill
              │
          wait only when remote decode needs KV
              │
          decode → completion(request, generation)
              │
Producer: safe to release this source generation</pre></div>
                <p><code>request_id</code>、<code>generation</code>、<code>model_signature</code> 和 block IDs 都是教学字段，不是当前 vLLM / NIXL 协议逐字段复刻。要记的是 invariant：兼容性必须在消费前成立，source memory 又必须活到远端完成为止。</p>
              </section>

              <section class="lab-section" id="run"><div class="lab-kicker">05 · RUN + REFERENCE</div><h2>真正的验收：remote handoff 后的 decode，必须等价于本地重新计算同一份 prompt KV。</h2>
                <div class="command"><div class="command-head"><span>TERMINAL</span><span>2 ranks</span></div><pre>torchrun --standalone --nproc-per-node=2 \
  labs/code/mini_inference_engine.py</pre></div>
                <p>脚本故意在 Consumer 端额外重算 prompt KV 作为 correctness-only reference；生产系统不会为了“验证 handoff”每次重算。默认条件下还要求 token budget 恰好用完、descriptor 兼容、completion/release 成功，并且 remote decode 最大误差小于 <code>1e-5</code>。</p>
                <a class="code-link" href="./code/mini_inference_engine.py"><div><small>FULL SOURCE</small><b>打开 mini_inference_engine.py</b></div><span>→</span></a>
              </section>

              <section class="lab-section" id="source"><div class="lab-kicker">06 · SOURCE READING PAYOFF</div><h2>现在可以把 vLLM 看成一条跨 subsystem 的 request lifecycle，而不是只盯 Scheduler 一个 class。</h2>
                <div class="source-bridge"><div><small>OUR CAPSTONE</small><b>request state → token budget → block table → remote KV → decode → completion</b><code>scheduler · allocator · transfer · lifetime</code></div><span>maps to →</span><div><small>VLLM</small><b>Scheduler + KVCacheManager / block pool + model runner + KVConnector</b><code>具体 class / 文件拆分会随版本演化</code></div></div>
                <p>真正源码里，这些职责不会都待在一个文件。B8 的作用就是给你一个稳定的阅读问题清单：谁决定 request 现在能不能跑？谁分配 KV blocks？谁启动/等待外部 KV？谁知道 decode 已完成？谁最终允许资源回收？</p>
              </section>

              <section class="lab-section" id="checkpoint"><div class="lab-kicker">07 · CHECKPOINT</div><h2>能回答这四问，Inference Infra 的主线才算真正闭环。</h2><div class="check-list"><div>① 为什么 remote KV load 可以和另一个 request 的 prefill 并行存在，却不能绕过 remote request 自己的 decode dependency？</div><div>② token budget 和 KV/network bytes 分别约束什么资源？</div><div>③ 为什么 logical block order 与 physical pool slots 要解耦？</div><div>④ 为什么 Producer 不能在 <code>isend</code> 返回后立刻复用 source KV？</div></div></section>

              <nav class="lab-footer-nav"><a href="./mini-kv-lease-expiry.html">← Lab B7 · KV Lease / Expiry</a><a href="../source-map/index.html#vllm">进入 vLLM / NIXL Source Map →</a></nav>
            </main>
            <script src="../app.js"></script>
          </body>
          </html>'''
          b8 = '\n'.join(line[10:] if line.startswith('          ') else line for line in b8.splitlines())
          target = Path('labs/mini-inference-engine.html')
          if target.exists():
              raise SystemExit('labs/mini-inference-engine.html already exists')
          target.write_text(b8 + '\n', encoding='utf-8')
          PY
      - name: Verify integrated site
        run: |
          python scripts/check_site.py
          python scripts/normalize_navigation.py
          python scripts/check_diagrams.py
      - name: Commit integrated capstones
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git rm .github/workflows/integrate-capstones-once.yml
          git add README.md index.html labs .github/workflows/lab-smoke.yml scripts/run_lab_smoke.py
          git commit -m 'Integrate training and inference capstone labs'
          git push origin HEAD:main
