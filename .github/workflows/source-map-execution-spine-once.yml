name: One-time Source Map execution spine patch

on:
  push:
    paths:
      - '.github/workflows/source-map-execution-spine-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add Megatron execution spine
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'source-map/index.html',
              '<p>推荐顺序是 TP 的“切分与通信语义” → rank/group 拓扑 → PP 时序 → optimizer sharding → bucket/overlap。不要先从庞大的配置类或 feature flag 开始。</p>',
              '<p>先用 5 分钟扫一遍 <strong>entry → training loop → schedule → optimizer step</strong> 的执行骨架，知道“谁调用谁”；再下钻 TP 的切分与通信语义 → rank/group 拓扑 → PP/CP/EP → optimizer sharding → bucket/overlap。这样读到任何局部 class 时，都知道它在一次 training step 的什么位置。</p>'
          )

          anchor = '''      <div class="source-list train-source">\n        <div class="source-row">\n          <span class="order">01</span>\n          <div><em class="phase-label">DATA · TP</em><b>Tensor Parallel layers</b><code>megatron/core/tensor_parallel/layers.py</code></div>'''
          addition = '''      <div class="source-list train-source">\n        <div class="source-row">\n          <span class="order">00</span>\n          <div><em class="phase-label">CONTROL · EXECUTION SPINE</em><b>GPT entry → training step → schedule</b><code>pretrain_gpt.py → megatron/training/training.py → core/pipeline_parallel/schedules.py</code></div>\n          <p>先别追 tensor。第一遍只追调用关系：<code>pretrain_gpt.py</code> 组装 config、dataset provider 与 <code>forward_step</code> 后进入 <code>pretrain()</code>；训练循环的 <code>train_step()</code> 再把当前 model / iterator 交给 <code>get_forward_backward_func()</code> 选出的 schedule，完成 forward/backward 后才进入 optimizer 更新。当前 <code>main</code> 还把 sequence-packing scheduler 接进了这条顶层路径，因此这里比只看某个并行层更适合作为源码第一站。</p>\n          <div class="source-actions"><a href="https://github.com/NVIDIA/Megatron-LM/blob/main/pretrain_gpt.py">entry ↗</a><a href="https://github.com/NVIDIA/Megatron-LM/blob/main/megatron/training/training.py">training loop ↗</a><a href="https://github.com/NVIDIA/Megatron-LM/blob/main/megatron/core/pipeline_parallel/schedules.py">schedule selector ↗</a><a href="../labs/mini-training-system.html">A12 →</a></div>\n        </div>\n        <div class="source-row">\n          <span class="order">01</span>\n          <div><em class="phase-label">DATA · TP</em><b>Tensor Parallel layers</b><code>megatron/core/tensor_parallel/layers.py</code></div>'''
          replace_once('source-map/index.html', anchor, addition)

          replace_once(
              'README.md',
              '- NVIDIA/Megatron-LM `main`: `6c440e61fd5f8e6ad526d3225c02ec85be8e8fa8`',
              '- NVIDIA/Megatron-LM `main`: `1cb3264479f28b8526db3d335faa9c5ef2183989`'
          )
          old_para = '这轮继续复核了 vLLM GPU runner selector / V1-V2 runner 分流、Scheduler、KV Connector / NIXL lifecycle，以及 Megatron Expert Parallel dispatcher、Distributed Optimizer、Context Parallel 与 communication-overlap 生命周期。相对上一快照，vLLM 又前进了 5 个提交：大部分集中在测试与 ROCm MLA，但其中 KV cache coordinator / prefix-cache tests 已明确覆盖 hybrid full-attention + Mamba `align` 的 fine-grained partial prefix-cache hits，因此 07.5 已补上“完整 hash block 是基础心智模型、不是所有当前路径的全局不变量”这一例外；这些提交未改变本课程的 continuous-batching / KV budget 主契约。Megatron 当前 `main` 仍是本次复核使用的快照，最新提交只重构 experimental FSDP gradient-readiness countdown，未触及本课程使用的 DDP bucket、CP、MoE dispatcher 或 overlap contract。网页中的源码链接仍指向上游 `main`，方便继续阅读最新代码；上面的 SHA 只是说明这轮课程语义核对时使用的具体快照。上游继续演化后，应重新复查版本敏感内容。'
          new_para = '这轮继续复核了 vLLM GPU runner selector / V1-V2 runner 分流、Scheduler、KV Connector / NIXL lifecycle，以及 Megatron 的顶层 GPT pretraining execution spine、Expert Parallel dispatcher、Distributed Optimizer、Context Parallel 与 communication-overlap 生命周期。相对上一快照，vLLM 又前进了 5 个提交：大部分集中在测试与 ROCm MLA，但其中 KV cache coordinator / prefix-cache tests 已明确覆盖 hybrid full-attention + Mamba `align` 的 fine-grained partial prefix-cache hits，因此 07.5 已补上“完整 hash block 是基础心智模型、不是所有当前路径的全局不变量”这一例外；这些提交未改变本课程的 continuous-batching / KV budget 主契约。Megatron `main` 已前进到 `1cb3264479f28b8526db3d335faa9c5ef2183989`；最新提交把 sequence-packing scheduler 接入 training loop，并把 variable-length dataset 路径接进 GPT pretraining。这个变化直接触及“入口 → batch/data schedule → train step”的阅读主线，因此 Source Map 新增了 `pretrain_gpt.py → megatron/training/training.py → get_forward_backward_func()` 的 execution spine，而不是把训练系统只拆成 TP/PP/CP/EP 零件。网页中的源码链接仍指向上游 `main`，方便继续阅读最新代码；上面的 SHA 只是说明这轮课程语义核对时使用的具体快照。上游继续演化后，应重新复查版本敏感内容。'
          replace_once('README.md', old_para, new_para)
          PY
      - name: Verify site
        run: |
          python scripts/check_site.py
          python scripts/normalize_navigation.py
          python scripts/check_diagrams.py
      - name: Commit content patch
        run: |
          git config user.name 'LeonaKaka QA Bot'
          git config user.email '124779759+LeonaKaka@users.noreply.github.com'
          git add source-map/index.html README.md
          git commit -m 'Add Megatron execution spine to Source Map'
          git push origin HEAD:main
